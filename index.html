<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f1f5f9">
<title>ArtisanApp V19</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* TON CSS EXISTANT (inchangé pour garder le design premium) */
:root{
  --bg: #f1f5f9; --surface: #ffffff; --surface-hover: #f8fafc; --border: #e2e8f0;
  --text-main: #0f172a; --text-muted: #64748b; --primary: #2563eb; --primary-hover: #1d4ed8;
  --primary-light: #eff6ff; --danger: #ef4444; --danger-light: #fef2f2;
  --success: #10b981; --success-light: #ecfdf5; --radius: 16px;
  --font-main: 'Inter', -apple-system, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05); --shadow-glow: 0 0 15px rgba(37, 99, 235, 0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-main);font-size:15px;line-height:1.5;padding-bottom:100px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{min-height:44px;cursor:pointer;border:none;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}
button:disabled{cursor:wait;opacity:.7}
a{text-decoration:none;cursor:pointer;color:inherit}

/* HEADER & NAV */
.hdr{background:var(--surface);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.hdr-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.hdr-text h1{font-size:20px;font-weight:800;margin-left:12px}
.hdr-text p{font-size:12px;color:var(--primary);font-weight:700;margin-left:12px;text-transform:uppercase}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0 24px 0;z-index:100;box-shadow:0 -4px 10px rgba(0,0,0,0.02)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text-muted);padding:8px 16px;text-transform:uppercase}
.bottom-nav a{min-height:44px}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav svg{width:24px;height:24px;stroke-width:2.5;transition:transform 0.2s}
.bottom-nav a.active svg{transform:translateY(-2px)}
.fab{position:fixed;bottom:90px;right:24px;width:64px;height:64px;background:var(--primary);color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(37, 99, 235, 0.4);z-index:99}
.fab:hover{transform:scale(1.05) translateY(-2px)}
.fab:active{transform:scale(.95)}

/* LAYOUT & CARDS */
.layout-wrapper{display:flex;flex:1;max-width:1400px;margin:0 auto;width:100%}
.sidebar{display:none;width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-direction:column}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:14px 24px;margin:4px 16px;border-radius:12px;color:var(--text-muted);font-weight:600;cursor:pointer;transition:all 0.2s}
.sidebar .nav-item:hover{background:var(--surface-hover);color:var(--primary)}
.sidebar .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:800}
.wrap{flex:1;min-width:0;padding:32px 24px 40px;overflow-y:auto}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-content{animation:fadeInUp 0.3s ease-out forwards}

/* HERO BANNER V18 */
.hero-banner {
    background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.6) 50%, rgba(15, 23, 42, 0.1) 100%), url('hero-bg.jpg');
    background-size: cover; background-position: center center; border-radius: var(--radius);
    padding: 40px 32px; margin-bottom: 24px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: center; min-height: 240px; position: relative; overflow: hidden;
}
.hero-banner h2 { color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 32px; font-weight: 900; margin-bottom: 8px;}
.hero-banner p { color: #e2e8f0; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: 16px; max-width: 65%; font-weight: 500;}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:24px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all 0.3s ease}
.card:hover{transform:scale(1.005) translateY(-2px);box-shadow:var(--shadow-lg)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:800}
.card-sub{font-size:13px;color:var(--text-muted);margin-top:4px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);transition:all 0.3s ease;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.kpi:hover{transform:scale(1.02) translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.kpi.full{grid-column:span 2;background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);border-left:4px solid var(--primary)}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;z-index:1}
.kpi .val{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--text-main);z-index:1}
.kpi.full .val { color: var(--primary); }
.kpi-icon { position:absolute; right:-10px; bottom:-10px; width:80px; height:80px; opacity:0.05; color:var(--primary); transform:rotate(-15deg); }

/* BOUTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:700;background:var(--primary);color:#fff;width:100%;text-transform:uppercase;box-shadow:var(--shadow-md)}
.btn:hover{background:var(--primary-hover);transform:translateY(-2px)}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:var(--surface);color:var(--text-main);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{min-height:44px;padding:10px 16px;font-size:12px;width:auto;border-radius:8px}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fca5a5}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success-light);color:var(--success);border:1px solid #6ee7b7}
.btn-success:hover{background:var(--success);color:#fff}

/* FORMULAIRES */
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase}
.inp{width:100%;min-width:0;min-height:44px;padding:16px;font-size:16px;background:var(--bg);border:2px solid transparent;border-radius:12px;outline:none;font-weight:600;transition:all 0.2s}
.inp:focus{background:var(--surface);border-color:var(--primary);box-shadow:var(--shadow-glow)}
.row-2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* LISTES & LIGNES */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all 0.2s}
.list-item:hover{background:var(--surface-hover);border-color:var(--border);transform:translateX(4px)}
.list-item .title{font-weight:800;font-size:16px}
.list-item .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.list-item .amount{font-family:var(--font-mono);font-weight:800;color:var(--primary);font-size:16px}
.line-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.line-header{display:flex;justify-content:space-between;margin-bottom:12px}
.line-desc{font-weight:800;font-size:14px}
.line-total{font-family:var(--font-mono);color:var(--primary);font-weight:800}
.line-inputs{display:flex;gap:12px;align-items:center}
.pu-wrapper{display:flex;gap:8px;align-items:center;flex:2;}
.btn-reset{min-height:44px;background:var(--surface);color:var(--text-muted);padding:8px 12px;border-radius:8px;font-size:14px;border:1px solid var(--border)}

/* MODALES & TOASTS & PDF (Inchangé) */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);z-index:1000;background:var(--text-main);color:#fff;padding:14px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(15, 23, 42, 0.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:32px 24px;width:100%;border-top:4px solid var(--primary);transform:translateY(100%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;font-weight:800;margin-bottom:20px}
#pdf-template{display:none;width:210mm;padding:20mm;background:#fff;color:#000;font-family:Arial,sans-serif}
#pdf-template h1{font-size:28px;margin-bottom:24px;border-bottom:2px solid #000;padding-bottom:12px}
#pdf-template .header-info{display:flex;justify-content:space-between;margin-bottom:40px}
#pdf-template .box{width:45%;font-size:14px;line-height:1.6}
#pdf-template table{width:100%;border-collapse:collapse;margin-bottom:24px}
#pdf-template th{text-align:left;padding:12px;border-bottom:2px solid #000;font-size:14px}
#pdf-template td{padding:12px;border-bottom:1px solid #ccc;font-size:14px}
#pdf-template .totals{text-align:right;font-size:16px;line-height:1.8}
#pdf-template .legal{margin-top:60px;font-size:11px;color:#555;line-height:1.5}

@media (min-width:769px){
  body{padding-bottom:0}.bottom-nav,.fab{display:none}.hdr{display:none}.sidebar{display:flex}.wrap{padding:40px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}.kpi.full{grid-column:span 1}.row-2{grid-template-columns:1fr 1fr}
  .modal-overlay{align-items:center}.modal{border-radius:16px;max-width:500px;transform:translateY(20px) scale(0.95);border-top:none;border-left:4px solid var(--primary)}
}
@media (max-width:768px){
  .layout-wrapper,.wrap,.card,.field,.kpi-grid,.row-2{min-width:0}
  .kpi-grid,.row-2{grid-template-columns:minmax(0,1fr)}
  .kpi.full{grid-column:span 1}
  .bottom-nav a{flex:1;min-width:0;padding:8px 4px}
  .hero-banner{padding:32px 24px}
  .hero-banner p{max-width:100%}
  .kpi .val,.list-item>div:first-child{overflow-wrap:anywhere}
  .line-inputs{flex-wrap:wrap}
  .line-inputs>*{min-width:0}
  img,video,canvas{max-width:100%;height:auto}
}
</style>
</head>
<body>

<header class="hdr">
  <div style="display:flex;align-items:center;cursor:pointer" onclick="go('accueil')">
    <div class="hdr-mark">A</div>
    <div><h1>ArtisanApp</h1><p>V19 Cloud</p></div>
  </div>
</header>

<div class="layout-wrapper">
  <aside class="sidebar" id="desktop-sidebar">
    <div style="padding:0 24px 24px 24px; font-weight:900; font-size:22px; border-bottom:1px solid var(--border); margin-bottom:16px;">ArtisanApp</div>
    <div class="nav-item" onclick="go('accueil')" id="side-accueil">Tableau de bord</div>
    <div class="nav-item" onclick="go('devis')" id="side-devis">Mes Devis</div>

<a class="fab" id="fab-main" onclick="go('nouveau-devis')">+</a>

<nav class="bottom-nav">
  <a onclick="go('accueil')" id="nav-accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Accueil</a>
  <a onclick="go('clients')" id="nav-clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Clients</a>
  <a onclick="go('devis')" id="nav-devis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>Devis</a>
  <a onclick="go('parametres')" id="nav-param"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Paramètres</a>
</nav>

<div id="toast"></div>
<div class="modal-overlay" id="modal-overlay"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONNEXION SUPABASE & CONFIG
// ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://jikifsuegccvkhygrysc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dAYJ5HuvCQM4yFBaJOucZw_DS_S5ld4';
const supabaseClient = window.supabase && typeof window.supabase.createClient === 'function'
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

const SCHEMA_VERSION = 2;
const DEFAULT_SETTINGS = {
    nom_entreprise: "", siret: "", adresse: "", cp: "", ville: "",
    tel: "", email: "", iban: "", bic: "", assurance: "",
    marge: 15, aleas: 5, emailjs_service: "", emailjs_template: "", emailjs_public: "",
    openai_key: "", deepseek_key: "", agnes_key: ""
};

let SETTINGS = { ...DEFAULT_SETTINGS };
let CACHE_DATA = { schemaVersion: SCHEMA_VERSION, clients: [], devis: [], cpt: { c: 0, d: 0, f: 0 } };
let isAppReady = false;

// ═══════════════════════════════════════════════════════════════════
// INITIALISATION (On attend Supabase avant de lancer l'app)
// ═══════════════════════════════════════════════════════════════════
async function initApp() {
    try {
        if (!supabaseClient) throw new Error("Le client Supabase est indisponible");
        let timeoutId;
        const results = await Promise.race([
            Promise.all([
                supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle(),
                supabaseClient.from('clients').select('*'),
                supabaseClient.from('documents').select('*')
            ]),
            new Promise((_, reject) => {
                timeoutId = setTimeout(() => reject(new Error("Supabase ne répond pas")), 10000);
            })
        ]).finally(() => clearTimeout(timeoutId));
        const [settingsResult, clientsResult, documentsResult] = results;
        const queryError = [settingsResult, clientsResult, documentsResult].find(result => result.error);
        if (queryError) throw queryError.error;

        if (settingsResult.data) SETTINGS = { ...DEFAULT_SETTINGS, ...settingsResult.data };
        const cData = clientsResult.data;
        const clients = (cData || []).map(c => ({
            ...c, id: c.numero || c.id, uuid: c.id // Mapping pour l'UI
        }));

        const dData = documentsResult.data;
        const devis = (dData || []).map(d => ({
            id: d.numero, uuid: d.id, clientId: d.client_nom, clientNom: d.client_nom,
            type: d.type, statut: d.statut, lignes: d.lignes,
            tauxTVA: d.taux_tva, coutMateriaux: d.cout_materiaux,
            aleas: d.aleas, totalHT: d.total_ht, tva: d.tva, totalTTC: d.total_ttc,
            date: d.created_at
        }));

        CACHE_DATA = {
            schemaVersion: SCHEMA_VERSION,
            clients: clients,
            devis: devis,
            cpt: { c: clients.length, d: devis.filter(x=>x.type==='devis').length, f: devis.filter(x=>x.type==='facture').length }
        };
        
        isAppReady = true;
        home(); // Lance l'application une fois les données prêtes
    } catch (e) {
        console.error("Erreur d'init Supabase", e);
        toast("⚠️ Mode hors-ligne (Erreur Cloud)");
        isAppReady = true;
        home();
    }
}

function getData() { return CACHE_DATA; }
function saveData(d) {
    CACHE_DATA = d;
    if (!supabaseClient) return;
    // Sync clients
    if (d.clients) supabaseClient.from('clients').upsert(d.clients.map(c => ({
        id: c.uuid, numero: c.id, nom: c.nom, ville: c.ville, cp: c.cp, email: c.email, tel: c.tel
    })));
    // Sync docs
    if (d.devis) supabaseClient.from('documents').upsert(d.devis.map(x => ({
        id: x.uuid, numero: x.id, type: x.type, client_nom: x.clientNom, statut: x.statut,
        lignes: x.lignes, taux_tva: x.tauxTVA, cout_materiaux: x.coutMateriaux,
        aleas: x.aleas, total_ht: x.totalHT, tva: x.tva, total_ttc: x.totalTTC
    })));
}

// ═══════════════════════════════════════════════════════════════════
// MOTEUR DE CALCUL & HELPERS
// ═══════════════════════════════════════════════════════════════════
const TARIFS = {
    'carr.sol.std':{d:'Pose carrelage standard',u:'m2',pu:55,partF:0.35},
    'carr.sol.grand':{d:'Pose carrelage grand format',u:'m2',pu:80,partF:0.45},
    'sdb.renov':{d:'Forfait rénovation SDB',u:'forfait',pu:4500,partF:0.30}
};

function computeQuote(lignes, aleasPct, tvaPct) {
    let totalHTBrut = 0;
    lignes.forEach(l => totalHTBrut += (+l.q || 0) * (+l.pu || 0));
    totalHTBrut = Math.round(totalHTBrut * 100) / 100;
    const aleasMontant = Math.round(totalHTBrut * (aleasPct / 100) * 100) / 100;
    const totalHTNet = Math.round((totalHTBrut + aleasMontant) * 100) / 100;
    const montantTVA = Math.round(totalHTNet * (tvaPct / 100) * 100) / 100;
    const totalTTC = Math.round((totalHTNet + montantTVA) * 100) / 100;
    return { totalHTBrut, aleasMontant, totalHTNet, montantTVA, totalTTC };
}

function esc(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
function eur(n) { return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function uuid() { return crypto.randomUUID(); }

let toastTimer;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000); }

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════
let STACK = []; let CURRENT_ID = null; let CURRENT_MODE = 'new'; let DEV_LIGNES = [];

function go(page, id, mode) { CURRENT_ID = id || null; CURRENT_MODE = mode || 'new'; STACK.push({ page, id, mode }); render(); }
function back() { if (STACK.length > 1) { STACK.pop(); const p = STACK[STACK.length-1]; CURRENT_ID = p.id; CURRENT_MODE = p.mode; render(); } else { go('accueil'); } }
function home() { STACK = [{ page: 'accueil', id: null, mode: 'new' }]; CURRENT_ID = null; CURRENT_MODE = 'new'; render(); }

function render() {
    if (!isAppReady) return;
    const cur = STACK[STACK.length - 1];
    if(!cur) return; 
    
    const root = document.getElementById('root');
    let html = '';

    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.sidebar .nav-item').forEach(a => a.classList.remove('active'));
    
    let activeNav = cur.page === 'accueil' ? 'accueil' : cur.page.includes('client') ? 'clients' : cur.page.includes('devis') ? 'devis' : cur.page === 'parametres' ? 'param' : 'equipe';
    const mNav = document.getElementById('nav-' + activeNav); if(mNav) mNav.classList.add('active');
    const dNav = document.getElementById('side-' + activeNav); if(dNav) dNav.classList.add('active');

    try {
        if (cur.page === 'accueil') html = viewAccueil();
        else if (cur.page === 'parametres') html = viewParametres();
        else if (cur.page === 'clients') html = viewClients();
        else if (cur.page === 'nouveau-client') html = viewFormClient();
        else if (cur.page === 'devis') html = viewDevis();
        else if (cur.page === 'nouveau-devis') html = viewFormDevis();
        else if (cur.page === 'detail-devis') html = viewDetailDevis();
    } catch(e) { html = `<div class="card"><h3>Erreur</h3><p>${esc(e.message)}</p></div>`; }
    
    root.innerHTML = `<div class="page-content">${html}</div>`;
    if (cur.page === 'nouveau-devis') setTimeout(() => { if(document.getElementById('lines-container')) renderLines(); }, 10);
    window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════════════════════
// VUES (Accueil, Clients, Devis, etc.)
// ═══════════════════════════════════════════════════════════════════

function viewAccueil() {
    const d = getData();
    return `
        <div class="hero-banner">
            <h2>Bonjour, Chef !</h2>
            <p>Prêt à chiffrer vos chantiers aujourd'hui ?</p>
        </div>
        <div class="kpi-grid">
            <div class="kpi full"><div class="lbl">Chiffre d'Affaires</div><div class="val">${eur(d.devis.filter(x=>x.statut==='accepte').reduce((a,b)=>a+b.totalTTC,0))}</div></div>
            <div class="kpi"><div class="lbl">Devis en cours</div><div class="val">${d.devis.filter(x=>x.statut==='brouillon').length}</div></div>
            <div class="kpi"><div class="lbl">Clients</div><div class="val">${d.clients.length}</div></div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title">Derniers documents</div><button class="btn btn-sm" onclick="go('devis')">Tout voir</button></div>
            ${d.devis.slice(-3).reverse().map(x => `
                <div class="list-item" onclick="go('detail-devis', '${esc(x.id)}')">
                    <div><div class="title">${esc(x.clientNom)}</div><div class="sub">${esc(x.id)}</div></div>
                    <div class="amount">${eur(x.totalTTC)}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function viewParametres() {
    const s = SETTINGS;
    return `
        <div class="card">
            <div class="card-head"><div class="card-title">Mon Entreprise</div></div>
            <div class="field"><label>Nom</label><input class="inp" id="s-nom" value="${esc(s.nom_entreprise)}"></div>
            <button class="btn" onclick="saveParam()">Enregistrer</button>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title">Clés API (IA)</div></div>
            <div class="field"><label>OpenAI Key</label><input class="inp" type="password" id="s-openai" value="${esc(s.openai_key)}"></div>
            <div class="field"><label>DeepSeek Key</label><input class="inp" type="password" id="s-deepseek" value="${esc(s.deepseek_key)}"></div>
            <div class="field"><label>Agnes AI Key</label><input class="inp" type="password" id="s-agnes" value="${esc(s.agnes_key)}"></div>
            <button class="btn" onclick="saveParam()">Enregistrer les clés</button>
        </div>
    `;
}

async function saveParam() {
    SETTINGS.nom_entreprise = document.getElementById('s-nom').value;
    SETTINGS.openai_key = document.getElementById('s-openai').value;
    SETTINGS.deepseek_key = document.getElementById('s-deepseek').value;
    SETTINGS.agnes_key = document.getElementById('s-agnes').value;
    if (!supabaseClient) {
        toast("Mode hors-ligne : paramètres conservés en mémoire");
        return;
    }
    try {
        const { error } = await supabaseClient.from('settings').upsert({ id: 1, ...SETTINGS });
        if (error) throw error;
        toast("Paramètres enregistrés dans le Cloud");
    } catch (error) {
        console.error("Erreur d'enregistrement des paramètres", error);
        toast("Échec de la sauvegarde Cloud; paramètres conservés en mémoire");
    }
}

function viewClients() {
    const d = getData();
    return `<div class="card"><div class="card-head"><div class="card-title">Mes Clients</div></div>
        ${d.clients.map(c => `<div class="list-item" onclick="go('fiche-client', '${esc(c.id)}')"><div class="title">${esc(c.nom)}</div></div>`).join('')}
        <button class="btn" onclick="go('nouveau-client')">+ Nouveau Client</button>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// VUE CRÉATION DEVIS & IA
// ═══════════════════════════════════════════════════════════════════
function viewFormDevis() {
    return `
        <div class="card">
            <div class="card-head"><div class="card-title">Nouveau Devis</div></div>
            
            <div class="field">
                <label>Génération par IA (Texte)</label>
                <textarea class="inp" id="ia-text" rows="2" placeholder="Ex: Rénovation SDB 6m2..."></textarea>
                <button class="btn btn-ghost" id="btn-ai-quote" style="margin-top:12px;" onclick="generateQuoteWithAI()">✨ Générer avec DeepSeek/OpenAI</button>
            </div>

            <div class="field" style="background:var(--primary-light); padding:16px; border-radius:12px; border:1px solid var(--primary);">
                <label style="color:var(--primary);">📸 Rénovation Visuelle (Agnes AI)</label>
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">Prenez une photo de la pièce pour générer un visuel de rénovation.</p>
                <input type="file" id="ia-image" accept="image/*" class="inp" style="background:#fff;">
                <button class="btn" id="btn-ai-visual" style="margin-top:12px; background:var(--primary);" onclick="generateVisualWithAI()">Générer le visuel</button>
                <div id="visual-result" style="margin-top:16px;"></div>
            </div>

            <div id="lines-container"></div>
        </div>
    `;
}

async function generateQuoteWithAI() {
    const textInput = document.getElementById('ia-text');
    const button = document.getElementById('btn-ai-quote');
    const text = textInput ? textInput.value.trim() : '';
    if (!text || !button || button.disabled) return;

    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Génération en cours...";
    try {
        await new Promise(resolve => setTimeout(resolve, 1500));
        DEV_LIGNES = [{ code: 'custom', d: text, q: 1, u: 'forfait', pu: 500, puBase: 500 }];
        renderLines();
        toast("Devis généré !");
    } catch (error) {
        console.error("Erreur de génération du devis", error);
        toast("Erreur pendant la génération du devis");
    } finally {
        button.disabled = false;
        button.textContent = originalLabel;
    }
}

async function generateVisualWithAI() {
    const fileInput = document.getElementById('ia-image');
    const button = document.getElementById('btn-ai-visual');
    if (!fileInput || !fileInput.files.length) { toast("Choisissez une photo"); return; }
    if (!button || button.disabled) return;
    
    const resDiv = document.getElementById('visual-result');
    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Génération en cours...";
    resDiv.innerHTML = `<div style="text-align:center; padding:20px;">⏳ Analyse de l'image et génération par Agnes AI...</div>`;

    // Simulation de l'appel à l'Edge Function Supabase (qui cachera la clé Agnes)
    try {
        await new Promise(resolve => setTimeout(resolve, 3000));
        // On affiche une image de démo pour prouver que le pipeline UI fonctionne
        resDiv.innerHTML = `
            <div style="border-radius:12px; overflow:hidden; border:2px solid var(--success);">
                <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=400&q=80" style="width:100%; display:block;">
                <div style="background:var(--success); color:#fff; padding:8px; text-align:center; font-weight:bold;">Visuel généré par Agnes AI</div>
            </div>
        `;
        toast("Visuel généré !");
    } catch (error) {
        console.error("Erreur de génération du visuel", error);
        resDiv.textContent = "La génération du visuel a échoué. Réessayez.";
        toast("Erreur pendant la génération du visuel");
    } finally {
        button.disabled = false;
        button.textContent = originalLabel;
    }
}

function renderLines() {
    const cont = document.getElementById('lines-container');
    if(!cont) return;
    const tot = computeQuote(DEV_LIGNES, 5, 10);
    cont.innerHTML = DEV_LIGNES.map(l => `<div class="line-item">${esc(l.d)} - ${eur(l.pu)}</div>`).join('') + 
        `<div style="margin-top:20px; font-weight:bold; color:var(--primary);">Total TTC: ${eur(tot.totalTTC)}</div>`;
}

// LANCEMENT
initApp();
</script>
</body>
</html>
