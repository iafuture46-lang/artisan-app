<title>ArtisanApp V23</title>

<style>
/* Design premium ArtisanApp */
:root{
  --bg: #f8fafc; --surface: #ffffff; --surface-hover: #f1f5f9; --border: #e7ecf2;
  --text-main: #172033; --text-muted: #64748b; --primary: #f97316; --primary-hover: #ea580c;
  --primary-light: #fff1e7; --danger: #dc2626; --danger-light: #fef2f2;
  --success: #059669; --success-light: #ecfdf5; --radius: 14px;
  --font-main: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04); --shadow-md: 0 4px 12px rgba(15,23,42,.06);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.08); --shadow-glow: 0 0 0 3px rgba(249,115,22,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-main);font-size:15px;line-height:1.5;padding-bottom:100px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{min-height:44px;cursor:pointer;border:none;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}
button:disabled{cursor:wait;opacity:.7}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid rgba(249,115,22,.7);outline-offset:2px}
a{text-decoration:none;cursor:pointer;color:inherit}

/* HEADER & NAV */
.hdr{background:var(--surface);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.hdr-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.hdr-text h1{font-size:20px;font-weight:800;margin-left:12px}
.hdr-text p{font-size:12px;color:var(--primary);font-weight:700;margin-left:12px;text-transform:uppercase}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0 max(8px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 10px rgba(0,0,0,0.02)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text-muted);padding:8px 16px;text-transform:uppercase}
.bottom-nav a{min-height:44px}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav svg{width:24px;height:24px;stroke-width:2.5;transition:transform 0.2s}
.bottom-nav a.active svg{transform:translateY(-2px)}
.fab{position:fixed;bottom:90px;right:24px;width:56px;height:56px;background:var(--primary);color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 24px rgba(194,65,12,.24);z-index:99}
.fab:hover{transform:scale(1.05) translateY(-2px)}
.fab:active{transform:scale(.95)}

/* LAYOUT & CARDS */
.layout-wrapper{display:flex;flex:1;max-width:1400px;margin:0 auto;width:100%}
.sidebar{display:none;width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-direction:column}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:14px 24px;margin:4px 16px;border-radius:12px;color:var(--text-muted);font-weight:600;cursor:pointer;transition:all 0.2s}
.sidebar .nav-item:hover{background:var(--surface-hover);color:var(--primary)}
.sidebar .nav-item.active{background:var(--primary-light);color:#9a3412;font-weight:800}
.wrap{flex:1;min-width:0;padding:32px 24px 40px;overflow-y:auto}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-content{animation:fadeInUp 0.3s ease-out forwards}
.connection-status{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;margin-bottom:20px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text-muted);font-size:14px;font-weight:600}
.connection-status.offline{border-color:#fca5a5;background:var(--danger-light);color:#991b1b}
.connection-status.warning{border-color:#fbbf24;background:#fffbeb;color:#92400e}
.connection-status-message{display:flex;align-items:center;gap:10px;min-width:0}
.connection-status button{flex:0 0 auto}
.connection-spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:connectionSpin .8s linear infinite}
@keyframes connectionSpin{to{transform:rotate(360deg)}}

/* HERO BANNER V18 */
.hero-banner {
    background-color:#0f172a;
    background-image:linear-gradient(90deg,rgba(15,23,42,.88) 0%,rgba(15,23,42,.66) 52%,rgba(15,23,42,.24) 100%),url('hero-bg.jpg');
    background-size:cover;background-position:center center;border-radius:var(--radius);
    padding:40px 32px;margin-bottom:24px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.16);
    display:flex;flex-direction:column;justify-content:center;min-height:260px;position:relative;overflow:hidden;
}
.hero-banner h2 { color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 32px; font-weight: 900; margin-bottom: 8px;}
.hero-banner p { color: #e2e8f0; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: 16px; max-width: 65%; font-weight: 500;}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero-actions .btn{width:auto;min-width:150px}
.hero-actions .btn-light{background:#fff;color:#172033}
.hero-actions .btn-light:hover{background:#f1f5f9}

.card{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{box-shadow:var(--shadow-md)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:800}
.card-sub{font-size:13px;color:var(--text-muted);margin-top:4px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease,border-color .2s ease;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--shadow-md);border-color:#fdba74}
.kpi.full{grid-column:span 2;background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);border-left:4px solid var(--primary)}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;z-index:1}
.kpi .val{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--text-main);z-index:1}
.kpi.full .val { color: var(--text-main); }
.kpi-icon { position:absolute; right:-10px; bottom:-10px; width:80px; height:80px; opacity:0.05; color:var(--primary); transform:rotate(-15deg); }

/* BOUTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;background:var(--primary);color:#fff;width:100%;text-transform:none;box-shadow:none}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:var(--surface);color:var(--text-main);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{border-color:#fdba74;background:#fff7ed;color:#9a3412}
.btn-sm{min-height:44px;padding:10px 16px;font-size:12px;width:auto;border-radius:8px}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fca5a5}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success-light);color:var(--success);border:1px solid #6ee7b7}
.btn-success:hover{background:var(--success);color:#fff}

/* FORMULAIRES */
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase}
.inp{width:100%;min-width:0;min-height:44px;padding:11px 13px;font-size:16px;background:var(--surface);border:1px solid #cbd5e1;border-radius:8px;outline:none;font-weight:500;transition:border-color .2s ease,box-shadow .2s ease}
.inp:focus{background:var(--surface);border-color:var(--primary);box-shadow:var(--shadow-glow)}
.row-2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* LISTES & LIGNES */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all 0.2s}
.list-item:hover{background:var(--surface-hover);border-color:var(--border)}
.list-item .title{font-weight:800;font-size:16px}
.list-item .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.list-item .amount{font-family:var(--font-mono);font-weight:800;color:var(--primary);font-size:16px}
.line-item{background:var(--surface-hover);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.catalogue-panel{margin:14px 0 18px;padding:16px;border:1px solid #fed7aa;border-radius:10px;background:#fff7ed}
.catalogue-panel .field{margin-bottom:10px}
.add-line-button{width:auto;margin:4px 0 18px}
.line-total-summary{background:#fff7ed;padding:20px;border-radius:10px;margin-top:20px;border:1px solid #fed7aa;line-height:1.9}
.line-total-summary .grand-total{font-size:20px;color:#9a3412}
.line-header{display:flex;justify-content:space-between;margin-bottom:12px}
.line-desc{font-weight:800;font-size:14px}
.line-total{font-family:var(--font-mono);color:#c2410c;font-weight:800}
.line-inputs{display:flex;gap:12px;align-items:center}
.pu-wrapper{display:flex;gap:8px;align-items:center;flex:2;}
.btn-reset{min-height:44px;background:var(--surface);color:var(--text-muted);padding:8px 12px;border-radius:8px;font-size:14px;border:1px solid var(--border)}

/* MODALES & TOASTS & PDF (Inchangé) */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);z-index:1000;background:var(--text-main);color:#fff;padding:14px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(15, 23, 42, 0.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:32px 24px;width:100%;border-top:4px solid var(--primary);transform:translateY(100%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;font-weight:800;margin-bottom:20px}
#pdf-template{display:none;width:210mm;padding:20mm;background:#fff;color:#000;font-family:Arial,sans-serif}
#pdf-template h1{font-size:28px;margin-bottom:24px;border-bottom:2px solid #000;padding-bottom:12px}
#pdf-template .header-info{display:flex;justify-content:space-between;margin-bottom:40px}
#pdf-template .box{width:45%;font-size:14px;line-height:1.6}
#pdf-template table{width:100%;border-collapse:collapse;margin-bottom:24px}
#pdf-template th{text-align:left;padding:12px;border-bottom:2px solid #000;font-size:14px}
#pdf-template td{padding:12px;border-bottom:1px solid #ccc;font-size:14px}
#pdf-template .totals{text-align:right;font-size:16px;line-height:1.8}
#pdf-template .legal{margin-top:60px;font-size:11px;color:#555;line-height:1.5}

@media (min-width:769px){
  body{padding-bottom:0}.bottom-nav,.fab{display:none}.hdr{display:none}.sidebar{display:flex}.wrap{padding:40px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}.kpi.full{grid-column:span 1}.row-2{grid-template-columns:1fr 1fr}
  .modal-overlay{align-items:center}.modal{border-radius:16px;max-width:500px;transform:translateY(20px) scale(0.95);border-top:none;border-left:4px solid var(--primary)}
}
@media (max-width:768px){
  .layout-wrapper,.wrap,.card,.field,.kpi-grid,.row-2{min-width:0}
  .kpi-grid,.row-2{grid-template-columns:minmax(0,1fr)}
  .kpi.full{grid-column:span 1}
  .bottom-nav a{flex:1;min-width:0;padding:8px 4px}
  .hero-banner{min-height:220px;padding:32px 24px}
  .hero-banner p{max-width:100%}
  .hero-actions{display:grid;grid-template-columns:1fr}
  .hero-actions .btn{width:100%}
  .kpi .val,.list-item>div:first-child{overflow-wrap:anywhere}
  .line-inputs{flex-wrap:wrap}
  .line-inputs>*{min-width:0}
  img,video,canvas{max-width:100%;height:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

    <div style="padding:0 24px 24px 24px; font-weight:900; font-size:22px; border-bottom:1px solid var(--border); margin-bottom:16px;">ArtisanApp</div>
    <div class="nav-item" onclick="go('accueil')" id="side-accueil">Tableau de bord</div>

    <div class="nav-item" onclick="go('clients')" id="side-clients">Mes Clients</div>
    <div class="nav-item" onclick="go('equipe')" id="side-equipe">Mon Équipe</div>

  </aside>

</div>

<a class="fab" id="fab-main" onclick="go('nouveau-devis')">+</a>

<nav class="bottom-nav">
  <a onclick="go('accueil')" id="nav-accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Accueil</a>
  <a onclick="go('clients')" id="nav-clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Clients</a>
  <a onclick="go('devis')" id="nav-devis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>Devis</a>
  <a onclick="go('parametres')" id="nav-param"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Paramètres</a>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONNEXION SUPABASE & CONFIG
// ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://rhxxtymmhrrwrnyeitur.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WVdgR-H391fV8UiTpu_ppw_fhamr5Ew';
let supabaseClient = null;

const SCHEMA_VERSION = 2;
const DEFAULT_SETTINGS = {
    nom_entreprise: "", siret: "", adresse: "", cp: "", ville: "",
    tel: "", email: "", iban: "", bic: "", assurance: "",
    marge: 15, aleas: 5
};

let SETTINGS = { ...DEFAULT_SETTINGS };
const EMAIL_CONFIG_STORAGE_KEY = 'artisanapp.emailjs.config.v1';
let EMAIL_CONFIG = { emailjs_service: '', emailjs_template: '', emailjs_public: '' };
try {
    const savedEmailConfig = JSON.parse(localStorage.getItem(EMAIL_CONFIG_STORAGE_KEY) || 'null');
    if (savedEmailConfig && typeof savedEmailConfig === 'object') {
        EMAIL_CONFIG = {
            emailjs_service: typeof savedEmailConfig.emailjs_service === 'string' ? savedEmailConfig.emailjs_service : '',
            emailjs_template: typeof savedEmailConfig.emailjs_template === 'string' ? savedEmailConfig.emailjs_template : '',
            emailjs_public: typeof savedEmailConfig.emailjs_public === 'string' ? savedEmailConfig.emailjs_public : ''
        };
    }
} catch (error) {
    console.error("Impossible de lire la configuration EmailJS locale", error);
}
let CACHE_DATA = { schemaVersion: SCHEMA_VERSION, clients: [], devis: [], cpt: { c: 0, d: 0, f: 0 } };
let connectionState = 'loading';
let connectionError = '';
let isInitializing = false;
let hasLocalDataChanges = false;
let hasLocalSettingsChanges = false;
let QUOTE_PROPOSAL = [];
let VISUAL_SOURCE_URL = '';

// ═══════════════════════════════════════════════════════════════════
// INITIALISATION (Le rendu ne dépend pas du réseau)
// ═══════════════════════════════════════════════════════════════════
async function initApp() {
    if (isInitializing) return;
    isInitializing = true;
    connectionState = 'loading';
    connectionError = '';
    updateConnectionStatus();

    try {
        if (!supabaseClient) {
            if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                throw new Error("La bibliothèque Supabase n'est pas disponible");
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
        if (!supabaseClient) throw new Error("Le client Supabase est indisponible");
        let timeoutId;
        const results = await Promise.race([
            Promise.all([
                supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle(),
                supabaseClient.from('clients').select('*'),
                supabaseClient.from('documents').select('*')
            ]),
            new Promise((_, reject) => {
                timeoutId = setTimeout(() => reject(new Error("Supabase ne répond pas")), 10000);
            })
        ]).finally(() => clearTimeout(timeoutId));
        const [settingsResult, clientsResult, documentsResult] = results;
        const queryError = [settingsResult, clientsResult, documentsResult].find(result => result.error);
        if (queryError) throw queryError.error;

        if (settingsResult.data && !hasLocalSettingsChanges) SETTINGS = { ...DEFAULT_SETTINGS, ...settingsResult.data };
        const cData = clientsResult.data;
        const clients = (cData || []).map(c => ({
            ...c, id: c.id, uuid: c.id
        }));

        const dData = documentsResult.data;
        const devis = (dData || []).map(d => ({
            id: d.numero, numero: d.numero, uuid: d.id, clientId: d.client_id, clientNom: d.client_nom,
            type: d.type, statut: d.statut, lignes: d.lignes,
            tauxTVA: d.taux_tva, coutMateriaux: d.cout_materiaux,
            aleas: d.aleas, totalHT: d.total_ht, totalTTC: d.total_ttc,
            date: d.created_at
        }));

        if (!hasLocalDataChanges) {
            CACHE_DATA = {
                schemaVersion: SCHEMA_VERSION,
                clients: clients,
                devis: devis,
                cpt: { c: clients.length, d: devis.filter(x=>x.type==='devis').length, f: devis.filter(x=>x.type==='facture').length }
            };
        } else {
            const mergeById = (remoteRows, localRows) => {
                const rows = new Map(remoteRows.map(row => [row.uuid || row.id, row]));
                localRows.forEach(row => rows.set(row.uuid || row.id, row));
                return [...rows.values()];
            };
            const mergedClients = mergeById(clients, CACHE_DATA.clients || []);
            const mergedDocuments = mergeById(devis, CACHE_DATA.devis || []);
            CACHE_DATA = {
                schemaVersion: SCHEMA_VERSION,
                clients: mergedClients,
                devis: mergedDocuments,
                cpt: {
                    c: mergedClients.length,
                    d: mergedDocuments.filter(x => x.type === 'devis').length,
                    f: mergedDocuments.filter(x => x.type === 'facture').length
                }
            };
        }
        connectionState = 'online';
        if (hasLocalDataChanges) await saveData(CACHE_DATA);
        if (hasLocalSettingsChanges) await saveParam(false);
    } catch (e) {
        console.error("Erreur d'init Supabase", e);
        connectionState = cloudStateForError(e);
        connectionError = explainCloudError(e);
    } finally {
        isInitializing = false;
        updateConnectionStatus();
        const currentPage = STACK.length ? STACK[STACK.length - 1].page : '';
        if (connectionState === 'online' && !['nouveau-client', 'nouveau-devis'].includes(currentPage)) render();
        if (connectionState === 'offline') toast("Mode hors-ligne : " + connectionError);
    }
}

function getData() { return CACHE_DATA; }
async function saveData(d) {
    CACHE_DATA = d;
    hasLocalDataChanges = true;
    if (!supabaseClient) {
        connectionState = 'offline';
        connectionError = "Client Supabase indisponible";
        updateConnectionStatus();
        toast("Modification conservée en mémoire; synchronisation Cloud indisponible");
        return false;
    }
    try {
        if (d.clients && d.clients.length) {
            const clientRows = d.clients.map(client => {
                const clientId = client.uuid || client.id || uuid();
                client.uuid = clientId;
                client.id = clientId;
                const row = {
                    id: clientId,
                    nom: client.nom,
                    ville: client.ville || null,
                    cp: client.cp || null,
                    email: client.email || null,
                    tel: client.tel || null
                };
                const createdAt = client.createdAt || client.created_at || client.date;
                const updatedAt = client.updatedAt || client.updated_at || createdAt;
                if (createdAt) row.created_at = createdAt;
                if (updatedAt) row.updated_at = updatedAt;
                return row;
            });
            const { error } = await supabaseClient.from('clients').upsert(clientRows, { onConflict: 'id' });
            if (error) throw error;
        }
        if (d.devis && d.devis.length) {
            const documentRows = d.devis.map(document => {
                const documentId = document.uuid || uuid();
                document.uuid = documentId;
                const matchingClient = d.clients && d.clients.find(client =>
                    client.uuid === document.clientId || client.id === document.clientId ||
                    (document.clientNom && client.nom === document.clientNom)
                );
                const row = {
                    id: documentId,
                    type: document.type,
                    numero: document.numero || document.id,
                    client_id: matchingClient ? matchingClient.uuid : document.clientId || null,
                    client_nom: document.clientNom || '',
                    statut: document.statut,
                    lignes: document.lignes || [],
                    taux_tva: document.tauxTVA ?? 0,
                    cout_materiaux: document.coutMateriaux ?? 0,
                    aleas: document.aleas ?? 0,
                    total_ht: document.totalHT ?? 0,
                    total_ttc: document.totalTTC ?? 0
                };
                const createdAt = document.createdAt || document.created_at || document.date;
                const updatedAt = document.updatedAt || document.updated_at || createdAt;
                if (createdAt) row.created_at = createdAt;
                if (updatedAt) row.updated_at = updatedAt;
                return row;
            });
            const { error } = await supabaseClient.from('documents').upsert(documentRows, { onConflict: 'id' });
            if (error) throw error;
        }
        connectionState = 'online';
        connectionError = '';
        hasLocalDataChanges = false;
        updateConnectionStatus();
        return true;
    } catch (error) {
        console.error("Erreur de synchronisation Supabase", error);
        connectionState = cloudStateForError(error);
        connectionError = explainCloudError(error);
        updateConnectionStatus();
        toast("Synchronisation Cloud échouée; modifications conservées dans cette session");
        return false;
    }
}

const QUOTE_PRICE_BOOK_KEY = 'artisanapp.quote-price-book.v1';

function getQuotePriceBook() {
    try {
        const saved = JSON.parse(localStorage.getItem(QUOTE_PRICE_BOOK_KEY) || '{}');
        if (!saved || Array.isArray(saved) || typeof saved !== 'object') return {};
        return Object.fromEntries(Object.entries(saved).filter(([code, price]) =>
            Object.prototype.hasOwnProperty.call(TARIFS, code) && Number.isFinite(price) && price >= 0
        ));
    } catch (error) {
        console.error("Impossible de lire le catalogue tarifaire local", error);
        return {};
    }
}

function saveQuotePriceBook(priceBook) {
    try {
        localStorage.setItem(QUOTE_PRICE_BOOK_KEY, JSON.stringify(priceBook));
        return true;
    } catch (error) {
        console.error("Impossible d'enregistrer le catalogue tarifaire local", error);
        toast("Le tarif reste dans cette ligne, mais le catalogue local n’a pas pu être mis à jour.");
        return false;
    }
}

function computeQuote(lignes, aleasPct, tvaPct) {
    let totalHTBrut = 0;
    lignes.forEach(l => totalHTBrut += (+l.q || 0) * (+l.pu || 0));
    totalHTBrut = Math.round(totalHTBrut * 100) / 100;
    const aleasMontant = Math.round(totalHTBrut * (aleasPct / 100) * 100) / 100;
    const totalHTNet = Math.round((totalHTBrut + aleasMontant) * 100) / 100;
    const montantTVA = Math.round(totalHTNet * (tvaPct / 100) * 100) / 100;
    const totalTTC = Math.round((totalHTNet + montantTVA) * 100) / 100;
    return { totalHTBrut, aleasMontant, totalHTNet, montantTVA, totalTTC };
}

function esc(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function eur(n) { return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function dateFr(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '-' : date.toLocaleDateString('fr-FR');
}
function uuid() { return crypto.randomUUID(); }

function explainCloudError(error) {
    const code = String(error && error.code || '');
    const message = String(error && error.message || '');
    const status = Number(error && (error.status || error.statusCode));
    if (code === '42501' || status === 403 || /row.level security|permission denied|not allowed/i.test(message)) {
        return "Accès refusé par les politiques RLS Supabase. Vérifiez la session et les autorisations.";
    }
    if (code === '42P01' || code === 'PGRST205' || /relation .* does not exist|table .* not found/i.test(message)) {
        return "Une table Supabase nécessaire est absente ou inaccessible.";
    }
    if (code === '42703' || code === 'PGRST204' || /column .* does not exist|could not find .* column/i.test(message)) {
        return "Le schéma Supabase ne correspond pas aux colonnes attendues.";
    }
    if (status === 401 || /invalid api key|jwt|unauthorized/i.test(message)) {
        return "La clé publique ou la session Supabase est invalide.";
    }
    if (error instanceof TypeError || /failed to fetch|network|name_not_resolved|load failed/i.test(message)) {
        return "Supabase est injoignable. Vérifiez la connexion Internet et l'URL du projet.";
    }
    return message || "Erreur Cloud Supabase inconnue.";
}

function cloudStateForError(error) {
    const status = Number(error && (error.status || error.statusCode));
    const message = String(error && error.message || '');
    if (status >= 100) return 'restricted';
    if (error instanceof TypeError || /failed to fetch|network|name_not_resolved|load failed|timed out|ne répond pas/i.test(message)) {
        return 'offline';
    }
    return 'error';
}

function connectionStatusMarkup() {
    if (connectionState === 'online') return '';
    if (connectionState === 'loading') {
        return `<div class="connection-status" role="status" aria-live="polite" aria-busy="true">
            <div class="connection-status-message"><span class="connection-spinner" aria-hidden="true"></span><span>Connexion au Cloud... L'application reste disponible.</span></div>
        </div>`;
    }
    const statusMessage = connectionState === 'restricted'
        ? "Cloud joignable, mais l'accès aux données a échoué."
        : connectionState === 'error' ? "Connexion Cloud non validée." : "Mode hors ligne.";
    const statusClass = connectionState === 'offline' ? 'offline' : 'warning';
    return `<div class="connection-status ${statusClass}" role="alert">
        <div class="connection-status-message"><span>${statusMessage} ${esc(connectionError || "Le Cloud est indisponible.")} Vos modifications restent disponibles dans cette session.</span></div>
        <button class="btn btn-sm btn-ghost" type="button" onclick="initApp()">Réessayer</button>
    </div>`;
}

function updateConnectionStatus() {
    const status = document.getElementById('connection-status');
    if (status) status.innerHTML = connectionStatusMarkup();
}

function render() {
    const cur = STACK[STACK.length - 1];
    if(!cur) return; 
    
    const root = document.getElementById('root');
    let html = '';

    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.sidebar .nav-item').forEach(a => a.classList.remove('active'));
    
    let activeNav = cur.page === 'accueil' ? 'accueil' : cur.page.includes('client') ? 'clients' : cur.page.includes('devis') ? 'devis' : cur.page === 'parametres' ? 'param' : 'equipe';
    const mNav = document.getElementById('nav-' + activeNav); if(mNav) mNav.classList.add('active');
    const dNav = document.getElementById('side-' + activeNav); if(dNav) dNav.classList.add('active');

    try {
        if (cur.page === 'accueil') html = viewAccueil();
        else if (cur.page === 'parametres') html = viewParametres();
        else if (cur.page === 'equipe') html = viewEquipe();
        else if (cur.page === 'clients') html = viewClients();
        else if (cur.page === 'nouveau-client') html = viewFormClient();
        else if (cur.page === 'fiche-client') html = viewFicheClient();
        else if (cur.page === 'devis') html = viewDevis();
        else if (cur.page === 'nouveau-devis') html = viewFormDevis();
        else if (cur.page === 'detail-devis') html = viewDetailDevis();
    } catch(e) { html = `<div class="card"><h3>Erreur</h3><p>${esc(e.message)}</p></div>`; }
    
    root.innerHTML = `<div id="connection-status"></div><div class="page-content">${html}</div>`;
    updateConnectionStatus();
    if (cur.page === 'nouveau-devis') setTimeout(() => { if(document.getElementById('lines-container')) renderLines(); }, 10);
    window.scrollTo(0,0);
}

    };
    for (const [setting, id] of Object.entries(fields)) {
        const input = document.getElementById(id);
        if (input) {
            if (setting === 'email' && !input.validity.valid) {
                toast("Saisissez une adresse email valide.");
                input.focus();
                return false;
            }
            SETTINGS[setting] = input.value.trim();
        }
    }
    const marginInput = document.getElementById('s-marge');
    const contingencyInput = document.getElementById('s-aleas');
    const margin = marginInput ? Number(marginInput.value) : Number(SETTINGS.marge);
    const contingency = contingencyInput ? Number(contingencyInput.value) : Number(SETTINGS.aleas);
    if (![margin, contingency].every(value => Number.isFinite(value) && value >= 0 && value <= 100)) {
        toast("La marge et les aléas doivent être compris entre 0 et 100 %.");
        return false;
    }
    SETTINGS.marge = margin;
    SETTINGS.aleas = contingency;
    const emailConfig = {
        emailjs_service: document.getElementById('s-ejs-service')?.value.trim() || '',
        emailjs_template: document.getElementById('s-ejs-template')?.value.trim() || '',
        emailjs_public: document.getElementById('s-ejs-public')?.value.trim() || ''
    };
    const hasEmailConfig = Object.values(emailConfig).some(Boolean);
    if (hasEmailConfig && Object.values(emailConfig).some(value => !value)) {
        toast("Renseignez les trois champs EmailJS ou laissez-les tous vides.");
        return false;
    }
    try {
        localStorage.setItem(EMAIL_CONFIG_STORAGE_KEY, JSON.stringify(emailConfig));
        EMAIL_CONFIG = emailConfig;
    } catch (error) {
        console.error("Erreur d'enregistrement de la configuration EmailJS locale", error);
        toast("La configuration EmailJS n’a pas pu être enregistrée dans ce navigateur.");
        return false;
    }
    hasLocalSettingsChanges = true;
    if (!supabaseClient) {
        connectionState = 'offline';
        connectionError = "Client Supabase indisponible";
        updateConnectionStatus();
        toast("Mode hors-ligne : paramètres conservés en mémoire");
        return false;
    }
    try {
        const { error } = await supabaseClient.from('settings').upsert({
            id: 1,
            nom_entreprise: SETTINGS.nom_entreprise,
            siret: SETTINGS.siret,
            adresse: SETTINGS.adresse,
            cp: SETTINGS.cp,
            ville: SETTINGS.ville,
            email: SETTINGS.email,
            tel: SETTINGS.tel,
            iban: SETTINGS.iban,
            bic: SETTINGS.bic,
            assurance: SETTINGS.assurance,
            marge: SETTINGS.marge,
            aleas: SETTINGS.aleas
        }, { onConflict: 'id' });
        if (error) throw error;
        hasLocalSettingsChanges = false;
        connectionState = 'online';
        connectionError = '';
        updateConnectionStatus();
        if (notify) toast("Paramètres enregistrés dans le Cloud");
        return true;
    } catch (error) {
        console.error("Erreur d'enregistrement des paramètres", error);
        connectionState = cloudStateForError(error);
        connectionError = explainCloudError(error);
        updateConnectionStatus();
        if (notify) toast("Échec de la sauvegarde Cloud; paramètres conservés en mémoire");
        return false;
    }
}

function exportData() {
    const backup = {
        schemaVersion: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        cloudSynced: connectionState === 'online' && !hasLocalDataChanges && !hasLocalSettingsChanges,
        data: {
            clients: CACHE_DATA.clients,
            documents: CACHE_DATA.devis
        },
        settings: SETTINGS,
        emailConfig: EMAIL_CONFIG
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `artisanapp-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(backup.cloudSynced ? "Sauvegarde téléchargée." : "Sauvegarde téléchargée; certaines modifications ne sont pas synchronisées.");
}

async function generateQuoteWithAI() {
    const textInput = document.getElementById('ia-text');
    const button = document.getElementById('btn-ai-quote');
    const text = textInput ? textInput.value.trim() : '';
    if (!text || !button || button.disabled) return;

    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Génération en cours...";
    try {
        const response = await fetch('/api/agnes/quote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ description: text })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Le service Agnès est indisponible");
        if (!Array.isArray(result.lines) || result.lines.some(line =>
            !line || typeof line.d !== 'string' || !Number.isFinite(Number(line.q)) ||
            !['m2', 'ml', 'u', 'forfait'].includes(line.u)
        )) throw new Error("La réponse DeepSeek ne contient pas de lignes valides");
        QUOTE_PROPOSAL = result.lines.map(line => ({
            code: 'custom', d: line.d, q: Number(line.q), u: line.u, pu: 0, puBase: 0
        }));
        renderQuoteProposal();
        toast("Proposition DeepSeek prête à vérifier");
    } catch (error) {
        console.error("Erreur de génération du devis", error);
        toast(error instanceof Error ? error.message : "Erreur pendant la génération du devis");
    } finally {
        button.disabled = false;
        button.textContent = originalLabel;
    }
}

function renderQuoteProposal() {
    const proposal = document.getElementById('quote-proposal');
    if (!proposal) return;
    if (!QUOTE_PROPOSAL.length) {
        proposal.replaceChildren();
        return;

    proposal.innerHTML = `
        <div class="line-item">
            <strong>Proposition à vérifier (aucun prix n'a été ajouté)</strong>
            ${QUOTE_PROPOSAL.map(line => `<div>${esc(line.d)} — ${esc(line.q)} ${esc(line.u)}</div>`).join('')}
            <button class="btn btn-sm" style="margin-top:12px;" onclick="acceptQuoteProposal()">Ajouter au devis</button>
        </div>`;
}

function acceptQuoteProposal() {
    if (!QUOTE_PROPOSAL.length) return;
    DEV_LIGNES = [...DEV_LIGNES, ...QUOTE_PROPOSAL];

    renderLines();
    renderQuoteProposal();
    toast("Lignes ajoutées; vérifiez les quantités et saisissez les prix");
}

function addQuoteLine() {

}

function addTariffLine() {
    const selector = document.getElementById('quote-tariff');
    const tariff = selector && TARIFS[selector.value];
    if (!tariff) {
        toast("Sélectionnez une prestation dans le catalogue.");
        return;
    }
    const priceBook = getQuotePriceBook();
    const price = Object.prototype.hasOwnProperty.call(priceBook, selector.value)
        ? priceBook[selector.value]
        : tariff.pu;
    DEV_LIGNES.push({
        code: selector.value,
        d: tariff.d,
        q: 1,
        u: tariff.u,
        pu: price,
        puBase: tariff.pu
    });
    selector.value = '';
    renderLines();
}

function resetQuotePrice(index) {
    const line = DEV_LIGNES[index];
    const tariff = line && TARIFS[line.code];
    if (!tariff) return;
    const priceBook = getQuotePriceBook();
    delete priceBook[line.code];
    saveQuotePriceBook(priceBook);
    line.pu = tariff.pu;
    line.puBase = tariff.pu;
    renderLines();
}

function updateQuoteLine(index, field, value) {
    if (!DEV_LIGNES[index]) return;
    DEV_LIGNES[index][field] = field === 'd' || field === 'u' ? value : Number(value);
    const line = DEV_LIGNES[index];
    if (field === 'pu' && TARIFS[line.code] && Number.isFinite(line.pu) && line.pu >= 0) {
        const priceBook = getQuotePriceBook();
        priceBook[line.code] = line.pu;
        saveQuotePriceBook(priceBook);
    }
    const lineTotal = document.getElementById(`line-total-${index}`);
    const resetButton = document.getElementById(`line-reset-price-${index}`);
    if (resetButton) resetButton.disabled = Number(line.pu) === Number(line.puBase);
    if (lineTotal) lineTotal.textContent = `Total ligne : ${eur((Number(line.q) || 0) * (Number(line.pu) || 0))}`;
    renderQuoteTotals();
}

function removeQuoteLine(index) {
    DEV_LIGNES.splice(index, 1);
    renderLines();
}

async function saveQuote() {
    const d = getData();
    const clientId = document.getElementById('quote-client').value;
    const client = d.clients.find(item => item.id === clientId || item.uuid === clientId);
    if (!client) {
        toast("Sélectionnez un client pour le devis.");
        return;
    }
    const lines = DEV_LIGNES.map(line => ({ ...line, d: String(line.d || '').trim() }));
    if (!lines.length || lines.some(line => !line.d || !Number.isFinite(line.q) || line.q <= 0 || !Number.isFinite(line.pu) || line.pu < 0)) {
        toast("Ajoutez au moins une ligne avec une description, une quantité et un prix valides.");
        return;
    }
    const tva = Number(document.getElementById('quote-tva').value);
    const aleas = Number(document.getElementById('quote-aleas').value);
    const materials = Number(document.getElementById('quote-materials').value);
    if (![tva, aleas, materials].every(Number.isFinite) || tva < 0 || tva > 100 || aleas < 0 || aleas > 100 || materials < 0) {
        toast("Vérifiez la TVA, les aléas et le coût des matériaux.");
        return;
    }
    const totals = computeQuote(lines, aleas, tva);
    const now = new Date().toISOString();
    let quoteDoc;
    if (CURRENT_MODE === 'edit') {
        quoteDoc = d.devis.find(item => item.uuid === CURRENT_ID || item.id === CURRENT_ID);
        if (!quoteDoc) {
            toast("Document introuvable.");
            return;
        }
        Object.assign(quoteDoc, {
            clientId: client.uuid || client.id,
            clientNom: client.nom,
            lignes: lines,
            tauxTVA: tva,
            coutMateriaux: materials,
            aleas: totals.aleasMontant,
            aleasPct: aleas,
            ...totals,
            totalHT: totals.totalHTNet,
            tva: totals.montantTVA,
            updatedAt: now
        });
    } else {
        const number = d.devis.filter(item => item.type === 'devis').length + 1;
        const id = uuid();
        const year = new Date().getFullYear();
        let sequence = number;
        let numero = `DEV-${year}-${String(sequence).padStart(4, '0')}`;
        while (d.devis.some(item => item.numero === numero || item.id === numero)) {
            sequence += 1;
            numero = `DEV-${year}-${String(sequence).padStart(4, '0')}`;
        }
        quoteDoc = {
            id: numero,
            uuid: id,
            numero,
            clientId: client.uuid || client.id,
            clientNom: client.nom,
            type: 'devis',
            statut: 'brouillon',
            lignes: lines,
            tauxTVA: tva,
            coutMateriaux: materials,
            aleas: totals.aleasMontant,
            aleasPct: aleas,
            ...totals,
            totalHT: totals.totalHTNet,
            tva: totals.montantTVA,
            date: now,
            createdAt: now,
            updatedAt: now
        };
        d.devis.push(quoteDoc);
        CURRENT_ID = id;
        CURRENT_MODE = 'edit';
        const currentPage = STACK[STACK.length - 1];
        if (currentPage) {
            currentPage.id = id;
            currentPage.mode = 'edit';
        }
    }
    const saved = await saveData(d);
    if (!saved) return;
    toast("Devis enregistré.");
    go('detail-devis', quoteDoc.uuid || quoteDoc.id, 'view');
}

function viewDetailDevis() {
    const document = getData().devis.find(item => item.uuid === CURRENT_ID || item.id === CURRENT_ID);
    if (!document) return '<div class="card">Devis introuvable.</div>';

    const aleasPct = Number.isFinite(Number(document.aleasPct))
        ? Number(document.aleasPct)
        : subtotal > 0 ? (Number(document.aleas) || 0) / subtotal * 100 : 0;
    const totals = computeQuote(document.lignes || [], aleasPct, Number(document.tauxTVA) || 0);
    return `
        <div class="card">
            <div class="card-head">
                <div><div class="card-title">${esc(document.numero || document.id)}</div>
                    <div class="card-sub">${esc(document.clientNom)} · ${dateFr(document.date)} · ${esc(document.statut)}</div></div>
                <button class="btn btn-sm btn-ghost" onclick="go('nouveau-devis', '${esc(document.uuid || document.id)}', 'edit')">Modifier</button>
            </div>
            <div class="card-sub">Client : ${esc(document.clientNom)}</div>
            ${(document.lignes || []).map(line => `
                <div class="list-item">
                    <div><div class="title">${esc(line.d)}</div><div class="sub">${esc(line.q)} ${esc(line.u)} × ${eur(line.pu)}</div></div>
                    <div class="amount">${eur((Number(line.q) || 0) * (Number(line.pu) || 0))}</div>
                </div>`).join('')}
            <div class="line-item">
                <div>Total HT : <strong>${eur(totals.totalHTNet)}</strong></div>
                <div>Aléas : <strong>${eur(totals.aleasMontant)}</strong></div>
                <div>TVA (${esc(document.tauxTVA)} %) : <strong>${eur(totals.montantTVA)}</strong></div>
                <div>Total TTC : <strong>${eur(totals.totalTTC)}</strong></div>
            </div>
            <div class="row-2" style="margin-top:16px;">
                ${document.type === 'devis' && document.statut !== 'accepte' ? `<button class="btn btn-success" type="button" onclick="acceptDevis('${esc(document.uuid || document.id)}')">Marquer comme accepté</button>` : ''}
                ${document.type === 'devis' && document.statut === 'accepte' ? `<button class="btn" type="button" onclick="exportToFacture('${esc(document.uuid || document.id)}')">Créer une facture</button>` : ''}
                <button class="btn btn-ghost" type="button" onclick="downloadDocumentPdf('${esc(document.uuid || document.id)}')">Télécharger le PDF</button>
                <button class="btn btn-ghost" type="button" onclick="sendMail('${esc(document.uuid || document.id)}')">Envoyer par email</button>
            </div>
            <button class="btn btn-danger" type="button" style="margin-top:12px;" onclick="deleteDocument('${esc(document.uuid || document.id)}')">Supprimer ce document</button>
            <button class="btn btn-ghost" type="button" onclick="back()">Retour</button>
        </div>`;
}

async function deleteDocument(id) {
    const doc = getData().devis.find(item => item.uuid === id || item.id === id);
    if (!doc) {
        toast("Document introuvable.");
        return;
    }
    if (connectionState !== 'online' || !supabaseClient) {
        toast("Suppression impossible hors ligne; le document est conservé.");
        return;
    }
    if (!window.confirm(`Supprimer le document ${doc.numero || doc.id} ? Cette action est irréversible.`)) return;
    try {
        const { data, error } = await supabaseClient.from('documents')
            .delete().eq('id', doc.uuid || doc.id).select('id');
        if (error) throw error;
        if (!data || data.length !== 1) {
            toast("Aucun document n’a été supprimé; vérifiez les droits Cloud.");
            return;
        }
        CACHE_DATA.devis = CACHE_DATA.devis.filter(item => item.uuid !== id && item.id !== id);
        connectionState = 'online';
        connectionError = '';
        updateConnectionStatus();
        toast("Document supprimé du Cloud.");
        back();
    } catch (error) {
        console.error("Erreur de suppression du document", error);
        connectionState = cloudStateForError(error);
        connectionError = explainCloudError(error);
        updateConnectionStatus();
        toast("Suppression refusée : " + connectionError);
    }
}

async function deleteClient(id) {
    const client = getData().clients.find(item => item.id === id || item.uuid === id);
    if (!client) {
        toast("Client introuvable.");
        return;
    }
    const linkedDocuments = getData().devis.filter(item =>
        item.clientId === client.id || item.clientId === client.uuid
    );
    if (linkedDocuments.length) {
        toast("Supprimez d’abord les documents liés au client.");
        return;
    }
    if (connectionState !== 'online' || !supabaseClient) {
        toast("Suppression impossible hors ligne; le client est conservé.");
        return;
    }
    if (!window.confirm(`Supprimer le client ${client.nom} ? Cette action est irréversible.`)) return;
    try {
        const { data, error } = await supabaseClient.from('clients')
            .delete().eq('id', client.uuid || client.id).select('id');
        if (error) throw error;
        if (!data || data.length !== 1) {
            toast("Aucun client n’a été supprimé; vérifiez les droits Cloud.");
            return;
        }
        CACHE_DATA.clients = CACHE_DATA.clients.filter(item => item.id !== id && item.uuid !== id);
        connectionState = 'online';
        connectionError = '';
        updateConnectionStatus();
        toast("Client supprimé du Cloud.");
        home();
    } catch (error) {
        console.error("Erreur de suppression du client", error);
        connectionState = cloudStateForError(error);
        connectionError = explainCloudError(error);
        updateConnectionStatus();
        toast("Suppression refusée : " + connectionError);
    }
}

async function acceptDevis(id) {
    const document = getData().devis.find(item => item.uuid === id || item.id === id);
    if (!document || document.type !== 'devis') {
        toast("Devis introuvable.");
        return;
    }
    document.statut = 'accepte';
    document.updatedAt = new Date().toISOString();
    const saved = await saveData(getData());
    render();
    if (saved) toast("Devis marqué comme accepté.");
}

async function exportToFacture(id) {
    const d = getData();
    const quote = d.devis.find(item => item.uuid === id || item.id === id);
    if (!quote || quote.type !== 'devis' || quote.statut !== 'accepte') {
        toast("Seul un devis accepté peut être facturé.");
        return;
    }
    const invoiceBaseNumber = `FAC-${quote.numero || quote.id}`;
    const existingInvoice = d.devis.find(item => item.type === 'facture' && (
        item.linkedDevisId === (quote.uuid || quote.id) ||
        item.numero === invoiceBaseNumber ||
        item.numero && item.numero.startsWith(`${invoiceBaseNumber}-`)
    ));
    if (existingInvoice) {
        go('detail-devis', existingInvoice.uuid || existingInvoice.id, 'view');
        return;
    }
    let sequence = 1;
    let numero = invoiceBaseNumber;
    while (d.devis.some(item => item.numero === numero || item.id === numero)) {
        sequence += 1;
        numero = `${invoiceBaseNumber}-${sequence}`;
    }
    const now = new Date().toISOString();
    const invoice = {
        ...quote,
        id: numero,
        numero,
        uuid: uuid(),
        type: 'facture',
        statut: 'emise',
        date: now,
        createdAt: now,
        updatedAt: now,
        linkedDevisId: quote.uuid || quote.id
    };
    d.devis.push(invoice);
    const saved = await saveData(d);
    if (saved) toast("Facture créée.");
    go('detail-devis', invoice.uuid, 'view');
}

function prepareDocumentPdf(doc) {
    const element = document.getElementById('pdf-template');
    if (!doc || !element || typeof window.html2pdf !== 'function') throw new Error("La génération PDF est indisponible.");
    const subtotal = (doc.lignes || []).reduce((sum, line) => sum + (Number(line.q) || 0) * (Number(line.pu) || 0), 0);
    const aleasPct = Number.isFinite(Number(doc.aleasPct))
        ? Number(doc.aleasPct)
        : subtotal > 0 ? (Number(doc.aleas) || 0) / subtotal * 100 : 0;
    const totals = computeQuote(doc.lignes || [], aleasPct, Number(doc.tauxTVA) || 0);
    const title = doc.type === 'facture' ? 'FACTURE' : 'DEVIS';
    element.innerHTML = `
        <h1>${title} N° ${esc(doc.numero || doc.id)}</h1>
        <div class="header-info">
            <div class="box"><strong>${esc(SETTINGS.nom_entreprise)}</strong><br>${esc(SETTINGS.adresse)}<br>${esc(SETTINGS.cp)} ${esc(SETTINGS.ville)}<br>SIRET : ${esc(SETTINGS.siret)}<br>Assurance : ${esc(SETTINGS.assurance)}</div>
            <div class="box" style="text-align:right;"><strong>Client :</strong><br>${esc(doc.clientNom)}<br>Date : ${dateFr(doc.date)}</div>
        </div>
        <table><thead><tr><th>Désignation</th><th>Qté</th><th>Prix unitaire HT</th><th>Total HT</th></tr></thead>
        <tbody>${(doc.lignes || []).map(line => `<tr><td>${esc(line.d)}</td><td>${esc(line.q)} ${esc(line.u)}</td><td>${eur(line.pu)}</td><td>${eur((Number(line.q) || 0) * (Number(line.pu) || 0))}</td></tr>`).join('')}</tbody></table>
        <div class="totals"><p>Aléas : ${eur(totals.aleasMontant)}</p><p>Total HT : ${eur(totals.totalHTNet)}</p><p>TVA (${esc(doc.tauxTVA)} %) : ${eur(totals.montantTVA)}</p><h3>TOTAL TTC : ${eur(totals.totalTTC)}</h3></div>
        <div class="legal"><p>IBAN : ${esc(SETTINGS.iban)} · BIC : ${esc(SETTINGS.bic)}</p></div>`;
    return {
        element,
        options: {
            margin: 0,
            filename: `${title}_${String(doc.numero || doc.id).replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }
    };
}

async function downloadDocumentPdf(id) {
    const doc = getData().devis.find(item => item.uuid === id || item.id === id);
    let pdf;
    try {
        pdf = prepareDocumentPdf(doc);
        pdf.element.style.display = 'block';
        await window.html2pdf().set(pdf.options).from(pdf.element).save();
    } catch (error) {
        console.error("Erreur de génération PDF", error);
        toast(error instanceof Error ? error.message : "Le PDF n’a pas pu être généré.");
    } finally {
        if (pdf) {
            pdf.element.style.display = 'none';
            pdf.element.replaceChildren();
        }
    }
}

function sendMail(id) {
    const doc = getData().devis.find(item => item.uuid === id || item.id === id);
    if (!doc) {
        toast("Document introuvable.");
        return;
    }
    const client = getData().clients.find(item => item.id === doc.clientId || item.uuid === doc.clientId);
    if (!client) {
        toast("Client associé introuvable.");
        return;
    }
    const overlay = document.getElementById('modal-overlay');
    overlay.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mail-modal-title">
            <h3 id="mail-modal-title">Envoyer ${doc.type === 'facture' ? 'la facture' : 'le devis'}</h3>
            <div class="field"><label for="m-to">Email du client</label><input class="inp" id="m-to" type="email" maxlength="254" required value="${esc(client.email)}"></div>
            <div class="field"><label for="m-msg">Message</label><textarea class="inp" rows="5" id="m-msg">Bonjour ${esc(client.nom)},

Veuillez trouver ci-joint ${doc.type === 'facture' ? 'la facture' : 'le devis'} ${esc(doc.numero || doc.id)} d’un montant de ${eur(doc.totalTTC)} TTC.

Cordialement,
${esc(SETTINGS.nom_entreprise)}</textarea></div>
            <button class="btn" id="btn-send-document" type="button" onclick="execMail('${esc(doc.uuid || doc.id)}')">Envoyer le document</button>
            <button class="btn btn-ghost" style="margin-top:12px;" type="button" onclick="closeMailModal()">Annuler</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('m-to').focus();
}

function closeMailModal() {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('show');
    overlay.replaceChildren();
}

async function execMail(id) {
    const doc = getData().devis.find(item => item.uuid === id || item.id === id);
    const toInput = document.getElementById('m-to');
    const messageInput = document.getElementById('m-msg');
    const button = document.getElementById('btn-send-document');
    if (!doc || !toInput || !messageInput || !button) return;
    if (!toInput.value.trim() || !toInput.validity.valid) {
        toast("Saisissez une adresse email valide.");
        toInput.focus();
        return;
    }
    if (button.disabled) return;
    if (!EMAIL_CONFIG.emailjs_service || !EMAIL_CONFIG.emailjs_template || !EMAIL_CONFIG.emailjs_public ||
        !window.emailjs || typeof window.emailjs.send !== 'function') {
        toast("Configurez EmailJS dans Paramètres avant l’envoi.");
        return;
    }
    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Génération du PDF et envoi...";
    try {
        window.emailjs.init(EMAIL_CONFIG.emailjs_public);
        const pdf = prepareDocumentPdf(doc);
        pdf.element.style.display = 'block';
        let pdfDataUri;
        try {
            pdfDataUri = await window.html2pdf().set(pdf.options).from(pdf.element).outputPdf('datauristring');
        } finally {
            pdf.element.style.display = 'none';
            pdf.element.replaceChildren();
        }
        if (typeof pdfDataUri !== 'string' || !pdfDataUri.startsWith('data:application/pdf')) {
            throw new Error("Le PDF n’a pas pu être préparé pour l’envoi.");
        }
        await window.emailjs.send(EMAIL_CONFIG.emailjs_service, EMAIL_CONFIG.emailjs_template, {
            to_email: toInput.value.trim(),
            message: messageInput.value,
            from_name: SETTINGS.nom_entreprise,
            document_pdf: pdfDataUri
        });

        if (doc.type === 'devis') {
            const previousStatus = doc.statut;
            doc.statut = 'envoye';
            doc.updatedAt = new Date().toISOString();
            if (!await saveData(getData())) {
                doc.statut = previousStatus;
                toast("Email envoyé avec PDF, mais le statut n’a pas été synchronisé.");
                closeMailModal();
                render();
                return;
            }
        }
        closeMailModal();
        render();
        toast("Email envoyé avec le PDF en pièce jointe.");
    } catch (error) {
        console.error("Erreur d'envoi du document par email", error);
        toast(error instanceof Error ? error.message : "L’envoi du document a échoué.");
    } finally {
        if (button.isConnected) {
            button.disabled = false;
            button.textContent = originalLabel;
        }
    }
}

function previewVisualPhoto() {
    const fileInput = document.getElementById('ia-image');
    const preview = document.getElementById('visual-source');
    const result = document.getElementById('visual-result');
    if (!fileInput || !preview || !result) return;
    if (VISUAL_SOURCE_URL) URL.revokeObjectURL(VISUAL_SOURCE_URL);
    VISUAL_SOURCE_URL = '';
    result.replaceChildren();
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
        preview.replaceChildren();
        return;
    }
    if (!['image/png', 'image/jpeg'].includes(file.type)) {
        fileInput.value = '';
        preview.textContent = "Formats acceptés : PNG et JPEG.";
        return;
    }
    VISUAL_SOURCE_URL = URL.createObjectURL(file);
    preview.innerHTML = `<img src="${VISUAL_SOURCE_URL}" alt="Aperçu de la photo à modifier" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px;">`;
}

async function generateVisualWithAI() {
    const fileInput = document.getElementById('ia-image');
    const button = document.getElementById('btn-ai-visual');
    if (!fileInput || !fileInput.files.length) { toast("Choisissez une photo"); return; }
    if (!button || button.disabled) return;
    const instructions = document.getElementById('ia-visual-instructions');
    const instructionText = instructions ? instructions.value.trim() : '';
    if (!instructionText) { toast("Décrivez la retouche souhaitée"); return; }

    const resDiv = document.getElementById('visual-result');
    const photo = fileInput.files[0];
    const sourceUrl = VISUAL_SOURCE_URL || URL.createObjectURL(photo);
    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Génération en cours...";
    resDiv.textContent = "Envoi sécurisé de la photo au service de retouche...";

    try {
        const formData = new FormData();
        formData.append('photo', photo);
        formData.append('instructions', instructionText);
        const response = await fetch('/api/photos/edit', { method: 'POST', body: formData });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Le service de retouche est indisponible");
        if (result.mimeType !== 'image/png' || typeof result.base64 !== 'string' || !result.base64) {
            throw new Error("Le service de retouche a renvoyé un résultat invalide");
        }
        const editedImage = `data:${result.mimeType};base64,${result.base64}`;
        resDiv.innerHTML = `
            <div class="row-2">
                <div><strong>Avant</strong><img src="${sourceUrl}" alt="Photo originale" style="width:100%;margin-top:8px;border-radius:12px;"></div>
                <div><strong>Après — retouche Agnès</strong><img src="${editedImage}" alt="Photo modifiée par le service d'édition" style="width:100%;margin-top:8px;border-radius:12px;"></div>
            </div>
            <a class="btn btn-ghost" style="margin-top:12px;" href="${editedImage}" download="artisanapp-retouche.png">Télécharger l'image</a>
        `;
        toast("Retouche photo terminée");
    } catch (error) {
        console.error("Erreur de génération du visuel", error);
        resDiv.textContent = error instanceof Error ? error.message : "La retouche photo a échoué. Réessayez.";
        toast("La retouche a échoué; la photo originale est conservée");
    } finally {
        button.disabled = false;
        button.textContent = originalLabel;
    }
}

function renderLines() {
    const cont = document.getElementById('lines-container');
    if (!cont) return;
    const tvaInput = document.getElementById('quote-tva');
    const aleasInput = document.getElementById('quote-aleas');
    const totals = computeQuote(DEV_LIGNES, Number(aleasInput && aleasInput.value) || 0, Number(tvaInput && tvaInput.value) || 0);
    const materialsInput = document.getElementById('quote-materials');
    const materials = Number(materialsInput && materialsInput.value) || 0;
    cont.innerHTML = `
        <div class="card-head"><div class="card-title">Lignes du devis</div></div>
        ${DEV_LIGNES.length ? DEV_LIGNES.map((line, index) => `
            <div class="line-item">
                <div class="field"><label for="line-description-${index}">Description</label>
                    <input class="inp" id="line-description-${index}" maxlength="500" value="${esc(line.d)}" onchange="updateQuoteLine(${index}, 'd', this.value)"></div>
                <div class="row-2">
                    <div class="field"><label for="line-quantity-${index}">Quantité</label>
                        <input class="inp" id="line-quantity-${index}" type="number" min="0.01" step="0.01" value="${esc(line.q)}" onchange="updateQuoteLine(${index}, 'q', this.value)"></div>
                    <div class="field"><label for="line-unit-${index}">Unité</label>
                        <select class="inp" id="line-unit-${index}" onchange="updateQuoteLine(${index}, 'u', this.value)">
                            ${['u', 'm2', 'ml', 'forfait'].map(unit => `<option value="${unit}" ${line.u === unit ? 'selected' : ''}>${unit}</option>`).join('')}
                        </select></div>
                </div>
                <div class="field"><label for="line-price-${index}">Prix unitaire HT (€)</label>
                    <input class="inp" id="line-price-${index}" type="number" min="0" step="0.01" value="${esc(line.pu)}" onchange="updateQuoteLine(${index}, 'pu', this.value)"></div>
                <div class="line-header"><span class="line-total" id="line-total-${index}">Total ligne : ${eur((Number(line.q) || 0) * (Number(line.pu) || 0))}</span>
                    ${TARIFS[line.code] ? `<button class="btn-reset" id="line-reset-price-${index}" type="button" ${Number(line.pu) === Number(line.puBase) ? 'disabled' : ''} onclick="resetQuotePrice(${index})">Tarif catalogue</button>` : ''}
                    <button class="btn-reset" type="button" aria-label="Supprimer cette ligne" onclick="removeQuoteLine(${index})">Retirer</button></div>
            </div>`).join('') : '<p class="card-sub">Aucune ligne. Ajoutez une ligne ou générez une proposition à vérifier.</p>'}
        <div class="line-total-summary">
            <div>Sous-total des prestations HT : <strong id="quote-subtotal">${eur(totals.totalHTBrut)}</strong></div>
            <div>Provision aléas : <strong id="quote-risk">${eur(totals.aleasMontant)}</strong></div>
            <div>Total HT : <strong id="quote-total-ht">${eur(totals.totalHTNet)}</strong></div>
            <div>TVA : <strong id="quote-total-tax">${eur(totals.montantTVA)}</strong></div>
            <div class="grand-total">Total TTC : <strong id="quote-total-ttc">${eur(totals.totalTTC)}</strong></div>
            <div>HT après matériaux estimé : <strong id="quote-after-materials">${eur(totals.totalHTNet - materials)}</strong></div>
            <div class="field-help">Estimation avant main-d’œuvre, frais généraux et cotisations. Les prix catalogue sont indicatifs.</div>
        </div>`;
}

function renderQuoteTotals() {
    const tvaInput = document.getElementById('quote-tva');
    const aleasInput = document.getElementById('quote-aleas');
    const totals = computeQuote(DEV_LIGNES, Number(aleasInput && aleasInput.value) || 0, Number(tvaInput && tvaInput.value) || 0);
    const totalHT = document.getElementById('quote-total-ht');
    const totalTax = document.getElementById('quote-total-tax');
    const totalTTC = document.getElementById('quote-total-ttc');
    const subtotal = document.getElementById('quote-subtotal');
    const risk = document.getElementById('quote-risk');
    const afterMaterials = document.getElementById('quote-after-materials');
    const materialsInput = document.getElementById('quote-materials');
    const materials = Number(materialsInput && materialsInput.value) || 0;
    if (totalHT) totalHT.textContent = eur(totals.totalHTNet);
    if (totalTax) totalTax.textContent = eur(totals.montantTVA);
    if (totalTTC) totalTTC.textContent = eur(totals.totalTTC);
    if (subtotal) subtotal.textContent = eur(totals.totalHTBrut);
    if (risk) risk.textContent = eur(totals.aleasMontant);
    if (afterMaterials) afterMaterials.textContent = eur(totals.totalHTNet - materials);
}

home();
initApp();
