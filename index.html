<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f1f5f9">
<title>ArtisanApp</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
:root{
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --border: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --success: #10b981;
  --success-light: #ecfdf5;
  --radius: 16px;
  --font-main: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05);
  --shadow-glow: 0 0 15px rgba(37, 99, 235, 0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-main);font-size:15px;line-height:1.5;padding-bottom:100px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}
a{text-decoration:none;cursor:pointer;color:inherit}

/* HEADER & NAV */
.hdr{background:var(--surface);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.hdr-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.hdr-text h1{font-size:20px;font-weight:800;margin-left:12px}
.hdr-text p{font-size:12px;color:var(--primary);font-weight:700;margin-left:12px;text-transform:uppercase}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0 24px 0;z-index:100;box-shadow:0 -4px 10px rgba(0,0,0,0.02)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text-muted);padding:8px 16px;text-transform:uppercase}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav svg{width:24px;height:24px;stroke-width:2.5;transition:transform 0.2s}
.bottom-nav a.active svg{transform:translateY(-2px)}
.fab{position:fixed;bottom:90px;right:24px;width:64px;height:64px;background:var(--primary);color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(37, 99, 235, 0.4);z-index:99}
.fab:hover{transform:scale(1.05) translateY(-2px)}
.fab:active{transform:scale(.95)}

/* LAYOUT & CARDS */
.layout-wrapper{display:flex;flex:1;max-width:1400px;margin:0 auto;width:100%}
.sidebar{display:none;width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-direction:column}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:14px 24px;margin:4px 16px;border-radius:12px;color:var(--text-muted);font-weight:600;cursor:pointer;transition:all 0.2s}
.sidebar .nav-item:hover{background:var(--surface-hover);color:var(--primary)}
.sidebar .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:800}
.wrap{flex:1;padding:32px 24px 40px;overflow-y:auto}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-content{animation:fadeInUp 0.3s ease-out forwards}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:24px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all 0.3s ease}
.card:hover{transform:scale(1.005) translateY(-2px);box-shadow:var(--shadow-lg)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:800}
.card-sub{font-size:13px;color:var(--text-muted);margin-top:4px}

/* KPI - Clicables */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);transition:all 0.3s ease;cursor:pointer}
.kpi:hover{transform:scale(1.02) translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.kpi.full{grid-column:span 2;background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);border-left:4px solid var(--primary)}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.kpi .val{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--primary)}
.kpi .sub{font-size:12px;color:var(--text-muted);margin-top:4px}

/* BOUTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:700;background:var(--primary);color:#fff;width:100%;text-transform:uppercase;box-shadow:var(--shadow-md)}
.btn:hover{background:var(--primary-hover);transform:translateY(-2px)}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:var(--surface);color:var(--text-main);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:10px 16px;font-size:12px;width:auto;border-radius:8px}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fca5a5}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success-light);color:var(--success);border:1px solid #6ee7b7}
.btn-success:hover{background:var(--success);color:#fff}

/* FORMULAIRES */
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase}
.inp{width:100%;padding:16px;font-size:16px;background:var(--bg);border:2px solid transparent;border-radius:12px;outline:none;font-weight:600;transition:all 0.2s}
.inp:focus{background:var(--surface);border-color:var(--primary);box-shadow:var(--shadow-glow)}
.row-2{display:grid;grid-template-columns:1fr;gap:16px}

/* LISTES */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all 0.2s}
.list-item:hover{background:var(--surface-hover);border-color:var(--border);transform:translateX(4px)}
.list-item .title{font-weight:800;font-size:16px}
.list-item .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.list-item .amount{font-family:var(--font-mono);font-weight:800;color:var(--primary);font-size:16px}

/* LIGNES DEVIS */
.line-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.line-header{display:flex;justify-content:space-between;margin-bottom:12px}
.line-desc{font-weight:800;font-size:14px}
.line-total{font-family:var(--font-mono);color:var(--primary);font-weight:800}
.line-inputs{display:flex;gap:12px}
.pu-wrapper{display:flex;gap:8px;align-items:center}
.btn-reset{background:var(--surface);color:var(--text-muted);padding:8px 12px;border-radius:8px;font-size:14px;border:1px solid var(--border)}

/* MODALES & TOASTS */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);z-index:1000;background:var(--text-main);color:#fff;padding:14px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(15, 23, 42, 0.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:32px 24px;width:100%;border-top:4px solid var(--primary);transform:translateY(100%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;font-weight:800;margin-bottom:20px}

/* PDF */
#pdf-template{display:none;width:210mm;padding:20mm;background:#fff;color:#000;font-family:Arial,sans-serif}
#pdf-template h1{font-size:28px;margin-bottom:24px;border-bottom:2px solid #000;padding-bottom:12px}
#pdf-template .header-info{display:flex;justify-content:space-between;margin-bottom:40px}
#pdf-template .box{width:45%;font-size:14px;line-height:1.6}
#pdf-template table{width:100%;border-collapse:collapse;margin-bottom:24px}
#pdf-template th{text-align:left;padding:12px;border-bottom:2px solid #000;font-size:14px}
#pdf-template td{padding:12px;border-bottom:1px solid #ccc;font-size:14px}
#pdf-template .totals{text-align:right;font-size:16px;line-height:1.8}
#pdf-template .legal{margin-top:60px;font-size:11px;color:#555;line-height:1.5}

@media (min-width:768px){
  body{padding-bottom:0}.bottom-nav,.fab{display:none}.hdr{display:none}.sidebar{display:flex}.wrap{padding:40px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}.kpi.full{grid-column:span 1}.row-2{grid-template-columns:1fr 1fr}
  .modal-overlay{align-items:center}.modal{border-radius:16px;max-width:500px;transform:translateY(20px) scale(0.95);border-top:none;border-left:4px solid var(--primary)}
}
</style>
</head>
<body>

<header class="hdr">
  <div style="display:flex;align-items:center;cursor:pointer" onclick="go('accueil')">
    <div class="hdr-mark">A</div>
    <div><h1>ArtisanApp</h1><p>Copilote</p></div>
  </div>
</header>

<div class="layout-wrapper">
  <aside class="sidebar" id="desktop-sidebar">
    <div style="padding:0 24px 24px 24px; font-weight:900; font-size:22px; border-bottom:1px solid var(--border); margin-bottom:16px;">ArtisanApp</div>
    <div class="nav-item" onclick="go('accueil')" id="side-accueil">Tableau de bord</div>
    <div class="nav-item" onclick="go('devis')" id="side-devis">Mes Devis</div>
    <div class="nav-item" onclick="go('clients')" id="side-clients">Mes Clients</div>
    <div class="nav-item" onclick="go('equipe')" id="side-equipe">Mon Équipe</div>
    <div class="nav-item" onclick="go('parametres')" id="side-param">Paramètres</div>
  </aside>
  <main class="wrap" id="root"></main>
</div>

<a class="fab" id="fab-main" onclick="go('nouveau-devis')">+</a>

<nav class="bottom-nav">
  <a onclick="go('accueil')" id="nav-accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Accueil</a>
  <a onclick="go('clients')" id="nav-clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>Clients</a>
  <a onclick="go('devis')" id="nav-devis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>Devis</a>
  <a onclick="go('parametres')" id="nav-param"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Paramètres</a>
</nav>

<div id="toast"></div>
<div class="modal-overlay" id="modal-overlay"></div>
<div id="pdf-template"></div>

<script>
const DEFAULT_SETTINGS = {
    nom_entreprise: "", siret: "", adresse: "", cp: "", ville: "",
    tel: "", email: "", iban: "", bic: "", assurance: "",
    marge: 15, aleas: 5, emailjs_service: "", emailjs_template: "", emailjs_public: ""
};

function getS() { try { return {...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('app_settings') || '{}')}; } catch(e) { return DEFAULT_SETTINGS; } }
function saveS(s) { localStorage.setItem('app_settings', JSON.stringify(s)); }
let SETTINGS = getS();

function getUsers() { try { return JSON.parse(localStorage.getItem('app_users')) || [{id:1, nom:'Patron', role:'admin'}]; } catch(e) { return [{id:1, nom:'Patron', role:'admin'}]; } }
function saveUsers(u) { localStorage.setItem('app_users', JSON.stringify(u)); }

function getData() { try { return JSON.parse(localStorage.getItem('app_data')) || { clients: [], devis: [], cpt: { c: 0, d: 0 } }; } catch(e) { return { clients: [], devis: [], cpt: { c: 0, d: 0 } }; } }
function saveData(d) { localStorage.setItem('app_data', JSON.stringify(d)); }

function getCatalogue() { try { return JSON.parse(localStorage.getItem('app_cat')) || {}; } catch(e) { return {}; } }
function saveCatalogue(c) { localStorage.setItem('app_cat', JSON.stringify(c)); }

const TARIFS = {
    'carr.sol.std':{d:'Pose carrelage standard',u:'m2',pu:55,partF:0.35},
    'carr.sol.grand':{d:'Pose carrelage grand format',u:'m2',pu:80,partF:0.45},
    'carr.sol.mosaique':{d:'Pose mosaïque',u:'m2',pu:110,partF:0.50},
    'peint.mur.mat':{d:'Peinture murs (Mat)',u:'m2',pu:18,partF:0.25},
    'peint.mur.satin':{d:'Peinture murs (Satin)',u:'m2',pu:20,partF:0.25},
    'peint.plafond':{d:'Peinture plafond',u:'m2',pu:22,partF:0.25},
    'sdb.renov':{d:'Forfait rénovation SDB',u:'forfait',pu:4500,partF:0.30},
    'plomb.wc':{d:'Remplacement WC',u:'u',pu:650,partF:0.55},
    'elec.tableau':{d:'Tableau électrique',u:'forfait',pu:1100,partF:0.55},
    'mac.mur':{d:'Élévation mur parpaing',u:'m2',pu:75,partF:0.40}
};

function esc(s) { if (!s) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function eur(n) { if (n === null || n === undefined) return '-'; return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function dateFr(iso) { try { return new Date(iso).toLocaleDateString('fr-FR'); } catch(e) { return '-'; } }
function init(nom) { if (!nom) return '?'; let p = nom.split(/\s+/); if (p.length === 1) return p[0].substring(0,2).toUpperCase(); return (p[0][0] + p[1][0]).toUpperCase(); }

let toastTimer;
function toast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

let STACK = []; let CURRENT_ID = null; let CURRENT_MODE = 'new'; let DEV_LIGNES = [];

function go(page, id, mode) {
    CURRENT_ID = id || null;
    CURRENT_MODE = mode || 'new';
    STACK.push({ page, id, mode });
    render();
}
function back() { if (STACK.length > 1) { STACK.pop(); const p = STACK[STACK.length-1]; CURRENT_ID = p.id; CURRENT_MODE = p.mode; render(); } else { go('accueil'); } }
function home() { STACK = [{ page: 'accueil', id: null, mode: 'new' }]; CURRENT_ID = null; CURRENT_MODE = 'new'; render(); }

function render() {
    const cur = STACK[STACK.length - 1];
    if(!cur) return; 
    
    const root = document.getElementById('root');
    let html = '';

    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.sidebar .nav-item').forEach(a => a.classList.remove('active'));
    
    let activeNav = '';
    if (cur.page === 'accueil') activeNav = 'accueil';
    else if (cur.page.includes('client')) activeNav = 'clients';
    else if (cur.page.includes('devis')) activeNav = 'devis';
    else if (cur.page === 'parametres') activeNav = 'param';
    else if (cur.page === 'equipe') activeNav = 'equipe';

    const mNav = document.getElementById('nav-' + activeNav); if(mNav) mNav.classList.add('active');
    const dNav = document.getElementById('side-' + activeNav); if(dNav) dNav.classList.add('active');

    const fab = document.getElementById('fab-main');
    if (cur.page === 'accueil') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-devis')"); }
    else if (cur.page === 'clients') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-client')"); }
    else if (cur.page === 'devis') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-devis')"); }
    else { fab.style.display = 'none'; }

    try {
        switch (cur.page) {
            case 'accueil': html = viewAccueil(); break;
            case 'parametres': html = viewParametres(); break;
            case 'equipe': html = viewEquipe(); break;
            case 'clients': html = viewClients(); break;
            case 'nouveau-client': html = viewFormClient(); break;
            case 'fiche-client': html = viewFicheClient(); break;
            case 'devis': html = viewDevis(); break;
            case 'nouveau-devis': html = viewFormDevis(); break;
            case 'detail-devis': html = viewDetailDevis(); break;
        }
    } catch(e) { html = `<div class="card"><h3>Erreur</h3><p>${e.message}</p></div>`; }
    root.innerHTML = `<div class="page-content">${html}</div>`;
    
    if (cur.page === 'nouveau-devis') {
        setTimeout(() => { if(document.getElementById('lines-container')) renderLines(); }, 10);
    }
    
    window.scrollTo(0,0);
}

// ---------------- VUES ----------------

function viewAccueil() {
    const d = getData();
    const nbDevisEnCours = d.devis.filter(x => x.statut === 'brouillon').length;
    let ca = 0; d.devis.forEach(x => { if (x.statut === 'accepte') ca += x.totalTTC; });

    return `
        <div class="kpi-grid">
            <div class="kpi full" onclick="go('devis')">
                <div class="lbl">Chiffre d'Affaires Validé</div>
                <div class="val">${eur(ca)}</div>
            </div>
            <div class="kpi" onclick="go('devis')">
                <div class="lbl">Devis en cours</div>
                <div class="val">${nbDevisEnCours}</div>
            </div>
            <div class="kpi" onclick="go('clients')">
                <div class="lbl">Clients</div>
                <div class="val">${d.clients.length}</div>
            </div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title">Actions rapides</div></div>
            <div class="row-2">
                <button class="btn btn-ghost" onclick="go('nouveau-devis')">+ Devis</button>
                <button class="btn btn-ghost" onclick="go('nouveau-client')">+ Client</button>
            </div>
        </div>
        <div class="card">
            <div class="card-head"><div class="card-title">Derniers devis</div><button class="btn btn-sm" onclick="go('devis')">Tout voir</button></div>
            ${d.devis.length === 0 ? '<p style="color:var(--text-muted); padding:16px;">Aucun devis.</p>' : ''}
            ${d.devis.slice(-3).reverse().map(x => `
                <div class="list-item" onclick="go('detail-devis', '${x.id}')">
                    <div><div class="title">${x.clientNom}</div><div class="sub">${x.id} - ${x.statut.toUpperCase()}</div></div>
                    <div class="amount">${eur(x.totalTTC)}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function viewParametres() {
    const s = SETTINGS;
    return `
        <div class="card">
            <div class="card-head"><div class="card-title">Mon Entreprise</div></div>
            <div class="field"><label>Nom / Raison sociale</label><input class="inp" id="s-nom" value="${esc(s.nom_entreprise)}"></div>
            <div class="row-2">
                <div class="field"><label>SIRET</label><input class="inp" id="s-siret" value="${esc(s.siret)}"></div>
                <div class="field"><label>Assurance Décennale</label><input class="inp" id="s-assurance" value="${esc(s.assurance)}"></div>

    };

function exportData() {
    const data = getData(); const settings = getS();
    const backup = { data, settings, exportDate: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `artisanapp_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("Sauvegarde téléchargée !");
}
function importData() { document.getElementById('file-import').click(); }
function processImport(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const backup = JSON.parse(e.target.result);
            if (backup.data && backup.settings) {
                if(confirm("Cela remplacera vos données actuelles. Continuer ?")) {
                    saveData(backup.data); saveS(backup.settings); SETTINGS = backup.settings;
                    toast("Import réussi !"); home();
                }
            } else { toast("Fichier invalide"); }
        } catch(err) { toast("Erreur de lecture"); }
    };
    reader.readAsText(file); event.target.value = '';
}

function parseIA() {
    const t = document.getElementById('ia-text').value.toLowerCase();
    if (!t) return;
    DEV_LIGNES = [];
    if (t.includes('carrelage')) {
        let code = t.includes('grand') || t.includes('60x60') ? 'carr.sol.grand' : 'carr.sol.std';
        let q = 1; const m = t.match(/(\d+)\s*m/); if (m) q = parseFloat(m[1]);
        addLine(code, q);
    } else if (t.includes('peinture')) {
        let code = t.includes('satin') ? 'peint.mur.satin' : 'peint.mur.mat';
        let q = 1; const m = t.match(/(\d+)\s*m/); if (m) q = parseFloat(m[1]);
        addLine(code, q);
    } else {
        DEV_LIGNES.push({ code: 'custom', d: t, q: 1, u: 'forfait', pu: 0, puBase: 0 });
    }
    renderLines();
}

function addLine(code, q) {
    const base = TARIFS[code]; const cat = getCatalogue();
    const pu = cat[code] !== undefined ? cat[code] : base.pu;
    DEV_LIGNES.push({ code, d: base.d, q, u: base.u, pu, puBase: base.pu });
    renderLines();
}

function renderLines() {
    const cont = document.getElementById('lines-container');
    if (!cont) return;
    let totalHT = 0; let html = '';
    
    DEV_LIGNES.forEach((l, i) => {
        totalHT += l.q * l.pu;
        html += `
            <div class="line-item">
                <div class="line-header"><div class="line-desc">${l.d}</div><div class="line-total">${eur(l.q * l.pu)}</div></div>
                <div class="line-inputs">
                    <input class="inp" type="number" value="${l.q}" onchange="updateLine(${i}, 'q', this.value)" style="flex:1;">
                    <div class="pu-wrapper" style="flex:2;">
                        <input class="inp" type="number" value="${l.pu}" onchange="updateLine(${i}, 'pu', this.value)" style="flex:1;">
                        ${l.pu !== l.puBase ? `<button class="btn-reset" onclick="resetLine(${i})">↺</button>` : ''}
                    </div>
                </div>
            </div>
        `;
    });

    const aleas = totalHT * (SETTINGS.aleas / 100);
    const totalHTFinal = totalHT + aleas;
    const tva = totalHTFinal * 0.10;
    const totalTTC = totalHTFinal + tva;

    html += `
        <div style="background:var(--bg);padding:24px;border-radius:12px;margin-top:24px;border:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>Sous-total HT</span><span>${eur(totalHT)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>Aléas (${SETTINGS.aleas}%)</span><span>${eur(aleas)}</span></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>TVA (10%)</span><span>${eur(tva)}</span></div>
            <div style="display:flex;justify-content:space-between;border-top:2px solid var(--border);padding-top:16px;margin-top:12px;font-weight:800;font-size:24px;color:var(--primary);"><span>TOTAL TTC</span><span>${eur(totalTTC)}</span></div>
        </div>
        <button class="btn" style="margin-top:24px;" onclick="saveDevis()">Enregistrer</button>
    `;
    cont.innerHTML = html;
}

function updateLine(i, f, v) {
    if (f === 'q') DEV_LIGNES[i].q = parseFloat(v) || 0;
    if (f === 'pu') {
        DEV_LIGNES[i].pu = parseFloat(v) || 0;
        if (DEV_LIGNES[i].code !== 'custom') { let c = getCatalogue(); c[DEV_LIGNES[i].code] = DEV_LIGNES[i].pu; saveCatalogue(c); }
    }
    renderLines();
}

function resetLine(i) {
    DEV_LIGNES[i].pu = DEV_LIGNES[i].puBase;
    let c = getCatalogue(); delete c[DEV_LIGNES[i].code]; saveCatalogue(c);
    renderLines();
}

function saveDevis() {
    let cid;
    const d = getData();
    
    if (CURRENT_MODE === 'edit') {
        cid = d.devis.find(x => x.id === CURRENT_ID).clientId;
    } else {
        cid = document.getElementById('d-client').value;
    }
    if (!cid) { toast("Sélectionnez un client"); return; }
    
    let totalHT = 0; DEV_LIGNES.forEach(l => totalHT += l.q * l.pu);
    const aleas = totalHT * (SETTINGS.aleas / 100); const totalHTF = totalHT + aleas;
    const tva = totalHTF * 0.10; const ttc = totalHTF + tva;
    const c = d.clients.find(x => x.id === cid);
    
    if (CURRENT_MODE === 'edit') {
        const idx = d.devis.findIndex(x => x.id === CURRENT_ID);
        if (idx > -1) {
            d.devis[idx].lignes = DEV_LIGNES.map(l => ({ code: l.code, d: l.d, q: l.q, u: l.u, pu: l.pu }));
            d.devis[idx].aleas = aleas; d.devis[idx].totalHT = totalHTF; d.devis[idx].tva = tva; d.devis[idx].totalTTC = ttc;
        }
        saveData(d); toast("Devis mis à jour"); 
        go('detail-devis', CURRENT_ID, 'view');
    } else {
        d.cpt.d++; const id = 'DEV-' + new Date().getFullYear() + '-' + String(d.cpt.d).padStart(4, '0');
        d.devis.push({
            id, clientId: cid, clientNom: c.nom, date: new Date().toISOString(), statut: 'brouillon',
            lignes: DEV_LIGNES.map(l => ({ code: l.code, d: l.d, q: l.q, u: l.u, pu: l.pu })),
            aleas, totalHT: totalHTF, tva, totalTTC: ttc

        saveData(d); toast("Devis enregistré"); 
        go('detail-devis', id, 'view');
    }
}

        <div class="legal"><p>Conditions : 30% à la commande, solde à la livraison.</p><p>IBAN: ${s.iban} - BIC: ${s.bic}</p></div>
    `;
    const el = document.getElementById('pdf-template'); el.innerHTML = html; el.style.display = 'block';
    html2pdf().set({ margin: 0, filename: `Devis_${dev.id}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(el).save().then(() => { el.style.display = 'none'; });
}

function sendMail(id) {
    const d = getData(); const dev = d.devis.find(x => x.id === id); const c = d.clients.find(x => x.id === dev.clientId); const s = SETTINGS;
    if (s.emailjs_public && s.emailjs_service) emailjs.init(s.emailjs_public);
    const ov = document.getElementById('modal-overlay');
    ov.innerHTML = `
        <div class="modal">
            <h3>Envoyer par Email</h3>
            <div class="field"><label>Email du client</label><input class="inp" id="m-to" value="${c.email || ''}"></div>
            <div class="field"><label>Message</label><textarea class="inp" rows="4" id="m-msg">Bonjour ${c.nom},\n\nVeuillez trouver ci-joint le devis ${dev.id} d'un montant de ${eur(dev.totalTTC)} TTC.\n\nCordialement,\n${s.nom_entreprise}</textarea></div>
            <button class="btn" onclick="execMail('${id}')">Envoyer</button>
            <button class="btn btn-ghost" style="margin-top:12px;" onclick="document.getElementById('modal-overlay').classList.remove('show')">Annuler</button>
        </div>
    `;
    ov.classList.add('show');
}

function execMail(id) {
    const to = document.getElementById('m-to').value; const msg = document.getElementById('m-msg').value; const s = SETTINGS;
    if (!to) { toast("Email obligatoire"); return; }
    if (s.emailjs_service && s.emailjs_template && s.emailjs_public) {
        toast("Envoi...");
        emailjs.send(s.emailjs_service, s.emailjs_template, { to_email: to, message: msg, from_name: s.nom_entreprise })
            .then(() => {
                toast("Email envoyé !"); document.getElementById('modal-overlay').classList.remove('show');
                let d = getData(); let dev = d.devis.find(x => x.id === id); dev.statut = 'envoye'; saveData(d); render();
            }, (e) => { toast("Erreur : " + e.text); });
    } else {
        const sub = encodeURIComponent(`Devis ${id} - ${s.nom_entreprise}`); const bod = encodeURIComponent(msg);
        window.location.href = `mailto:${to}?subject=${sub}&body=${bod}`;
        document.getElementById('modal-overlay').classList.remove('show');
        let d = getData(); let dev = d.devis.find(x => x.id === id); dev.statut = 'envoye'; saveData(d); render();
    }
}

// Init
home();
</script>
</body>
</html>
