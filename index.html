<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f1f5f9">
<title>ArtisanApp V18</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
:root{
    --bg-app:#F8FAFC; --bg-surface:#FFFFFF; --bg-subtle:#F1F5F9;
    --text-strong:#172033; --text-muted:#64748B; --border:#E7ECF2;
    --accent:#F97316; --accent-soft:#FFF1E7; --success:#059669; --warning:#D97706; --danger:#DC2626;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04); --shadow-md:0 4px 12px rgba(15,23,42,.06); --shadow-lg:0 12px 32px rgba(15,23,42,.08);
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
    --ease:cubic-bezier(.2,.7,.2,1); --dur-fast:150ms; --dur-base:200ms; --dur-slow:250ms;
    --focus-ring:2px solid rgba(249,115,22,.65); --focus-offset:2px;
    --bg:var(--bg-app); --surface:var(--bg-surface); --surface-hover:var(--bg-subtle);
    --text-main:var(--text-strong); --primary:var(--accent); --primary-hover:#EA580C;
    --primary-light:var(--accent-soft); --danger-light:#FEF2F2; --success-light:#ECFDF5;
    --warning-light:#FFFBEB; --radius:var(--radius-lg);
    --font-main:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --shadow-glow:0 0 0 3px rgba(249,115,22,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-main);background:var(--bg);color:var(--text-main);font-size:15px;line-height:1.5;padding-bottom:100px;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}
a{text-decoration:none;cursor:pointer;color:inherit}

/* HEADER & NAV */
.hdr{background:var(--surface);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.hdr-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.hdr-text h1{font-size:20px;font-weight:800;margin-left:12px}
.hdr-text p{font-size:12px;color:var(--primary);font-weight:700;margin-left:12px;text-transform:uppercase}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0 24px 0;z-index:100;box-shadow:0 -4px 10px rgba(0,0,0,0.02)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text-muted);padding:8px 16px;text-transform:uppercase}
.bottom-nav a.active{color:var(--primary)}
.bottom-nav svg{width:24px;height:24px;stroke-width:2.5;transition:transform 0.2s}
.bottom-nav a.active svg{transform:translateY(-2px)}
.fab{position:fixed;bottom:90px;right:24px;width:64px;height:64px;background:var(--primary);color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(249,115,22, 0.4);z-index:99}
.fab:hover{transform:scale(1.05) translateY(-2px)}
.fab:active{transform:scale(.95)}

/* LAYOUT & CARDS */
.layout-wrapper{display:flex;flex:1;max-width:1400px;margin:0 auto;width:100%}
.sidebar{display:none;width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-direction:column}
.sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:14px 24px;margin:4px 16px;border-radius:12px;color:var(--text-muted);font-weight:600;cursor:pointer;transition:all 0.2s}
.sidebar .nav-item:hover{background:var(--surface-hover);color:var(--primary)}
.sidebar .nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:800}
.wrap{flex:1;padding:32px 24px 40px;overflow-y:auto}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-content{animation:fadeInUp 0.3s ease-out forwards}

/* HERO BANNER V18 */
.hero-banner {
    background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.6) 50%, rgba(15, 23, 42, 0.1) 100%), url('hero-bg.jpg');
    background-size: cover;
    background-position: center center; 
    border-radius: var(--radius);
    padding: 40px 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 240px;
    position: relative;
    overflow: hidden;
}
.hero-banner h2 { color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 32px; font-weight: 900; margin-bottom: 8px;}
.hero-banner p { color: #e2e8f0; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: 16px; max-width: 65%; font-weight: 500;}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:24px;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all 0.3s ease}
.card:hover{transform:scale(1.005) translateY(-2px);box-shadow:var(--shadow-lg)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:800}
.card-sub{font-size:13px;color:var(--text-muted);margin-top:4px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);transition:all 0.3s ease;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.kpi:hover{transform:scale(1.02) translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.kpi.full{grid-column:span 2;background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);border-left:4px solid var(--primary)}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;z-index:1}
.kpi .val{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--text-main);z-index:1}
.kpi.full .val { color: var(--primary); }
.kpi-icon { position:absolute; right:-10px; bottom:-10px; width:80px; height:80px; opacity:0.05; color:var(--primary); transform:rotate(-15deg); }

/* BOUTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:700;background:var(--primary);color:#fff;width:100%;text-transform:uppercase;box-shadow:var(--shadow-md)}
.btn:hover{background:var(--primary-hover);transform:translateY(-2px)}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:var(--surface);color:var(--text-main);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:10px 16px;font-size:12px;width:auto;border-radius:8px}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fca5a5}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success-light);color:var(--success);border:1px solid #6ee7b7}
.btn-success:hover{background:var(--success);color:#fff}

/* FORMULAIRES */
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase}
.inp{width:100%;padding:16px;font-size:16px;background:var(--bg);border:2px solid transparent;border-radius:12px;outline:none;font-weight:600;transition:all 0.2s}
.inp:focus{background:var(--surface);border-color:var(--primary);box-shadow:var(--shadow-glow)}
.row-2{display:grid;grid-template-columns:1fr;gap:16px}

/* LISTES */
.list-item{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all 0.2s}
.list-item:hover{background:var(--surface-hover);border-color:var(--border);transform:translateX(4px)}
.list-item .title{font-weight:800;font-size:16px}
.list-item .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.list-item .amount{font-family:var(--font-mono);font-weight:800;color:var(--primary);font-size:16px}

/* LIGNES DEVIS */
.line-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.line-header{display:flex;justify-content:space-between;margin-bottom:12px}
.line-desc{font-weight:800;font-size:14px}
.line-total{font-family:var(--font-mono);color:var(--primary);font-weight:800}
.line-inputs{display:flex;gap:12px;align-items:center}
.pu-wrapper{display:flex;gap:8px;align-items:center;flex:2;}
.btn-reset{background:var(--surface);color:var(--text-muted);padding:8px 12px;border-radius:8px;font-size:14px;border:1px solid var(--border)}

/* MODALES & TOASTS */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);z-index:1000;background:var(--text-main);color:#fff;padding:14px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(15, 23, 42, 0.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:32px 24px;width:100%;border-top:4px solid var(--primary);transform:translateY(100%);transition:transform .3s;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;font-weight:800;margin-bottom:20px}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* Premium interface system */
body{background:var(--bg-app);color:var(--text-strong);font-family:var(--font-main)}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:var(--focus-ring);outline-offset:var(--focus-offset)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.hdr{display:flex;min-height:72px;padding:12px 28px;background:var(--bg-surface);box-shadow:none}
.hdr-mark{background:var(--accent);border-radius:var(--radius-md)}
.hdr-text p{color:var(--text-muted)}
.layout-wrapper{max-width:1600px}
.sidebar{position:sticky;top:72px;height:calc(100vh - 72px);width:248px;flex:0 0 248px;border-color:var(--border);padding:20px 0}
.hdr-context{margin-left:auto;color:var(--text-muted);font-size:14px;font-weight:650}
.sidebar .nav-item{width:calc(100% - 24px);min-height:48px;margin:3px 12px;padding:12px 16px;border:0;border-radius:var(--radius-md);background:transparent;text-align:left;font-size:14px}
.sidebar .nav-item:hover{background:var(--bg-subtle);color:var(--text-strong)}
.sidebar .nav-item.active{background:var(--accent-soft);color:#9A3412}
.wrap{min-width:0;max-width:1220px;padding:32px clamp(18px,3vw,40px) 48px;overflow:visible}
.card,.kpi{border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);transition:box-shadow var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease)}
.card{padding:24px;margin-bottom:18px}
.card:hover{transform:none;box-shadow:var(--shadow-sm)}
.card-title{font-size:18px;color:var(--text-strong)}
.kpi{padding:20px;cursor:default}
button.kpi{width:100%;text-align:left;color:inherit;background:var(--bg-surface)}
.kpi[role="button"]{cursor:pointer}
.kpi:hover{transform:none;box-shadow:var(--shadow-md);border-color:#FDBA74}
.kpi .val{font-size:28px;color:var(--text-strong)}
.kpi.full{background:var(--bg-surface);border-left:1px solid var(--border)}
.kpi.full .val{color:var(--text-strong)}
.kpi-icon{color:var(--accent)}
.btn{min-height:44px;padding:12px 18px;border-radius:var(--radius-md);background:var(--accent);box-shadow:none;text-transform:none;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.btn:hover{background:var(--primary-hover);transform:none}
.btn:active{transform:none}
.btn-ghost{background:var(--bg-surface);color:var(--text-strong);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg-subtle);border-color:#CBD5E1;color:var(--text-strong)}
.btn-danger{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.btn-danger:hover{background:#DC2626;color:#fff}
.btn-success{background:#ECFDF5;color:#047857;border-color:#A7F3D0}
.btn-success:hover{background:#059669;color:#fff}
.inp{min-height:44px;padding:11px 13px;border:1px solid #CBD5E1;border-radius:var(--radius-sm);background:var(--bg-surface);font-weight:500}
.inp:focus{border-color:var(--accent);box-shadow:var(--shadow-glow);outline:none}
.field label{color:#475569;text-transform:none;font-size:13px}
.list-item{min-height:64px;border-radius:var(--radius-sm);margin-bottom:4px}
.list-item[role="button"]:hover{background:var(--bg-subtle);border-color:var(--border);transform:none}
.list-item .amount,.line-total{color:#C2410C}
.bottom-nav{padding:6px 0 max(8px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.bottom-nav a{min-width:64px;min-height:56px;justify-content:center;padding:6px 10px;color:#475569}
.bottom-nav a.active{color:#C2410C}
.fab{width:56px;height:56px;bottom:84px;right:18px;border-radius:var(--radius-md);background:var(--accent);box-shadow:var(--shadow-md)}
.modal-overlay{padding:16px}
.modal{max-height:min(90vh,760px);overflow:auto;border-radius:var(--radius-lg);border:1px solid var(--border);border-top:3px solid var(--accent);box-shadow:var(--shadow-lg)}
#toast{max-width:min(92vw,480px);border-radius:var(--radius-md);background:#172033;box-shadow:var(--shadow-md)}
.hero-banner{background:var(--bg-surface);min-height:0;padding:28px;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.hero-banner h2,.hero-banner p{color:var(--text-strong);text-shadow:none;max-width:none}
.hero-banner h2{font-size:28px}
.hero-banner p{color:var(--text-muted)}
.line-item{border-radius:var(--radius-md);background:var(--bg-subtle)}
.line-header{align-items:flex-start}
.line-desc{flex:1;min-width:0}
.line-desc .inp{font-weight:650}
.line-unit{flex:none;width:112px}
.line-note{margin-top:8px;color:var(--text-muted);font-size:11px}
.add-line-button{width:auto;margin:4px 0 18px}
.btn-reset{min-width:44px;min-height:44px;border-radius:var(--radius-sm)}
#pdf-template{font-family:Arial,sans-serif}
.dashboard-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.dashboard-top h2{font-size:28px;line-height:1.2;font-weight:750}
.dashboard-top p{margin-top:6px;color:var(--text-muted)}
.dashboard-top .btn{width:auto;white-space:nowrap}
.dashboard-kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.dashboard-kpis .kpi{min-height:116px;justify-content:center;gap:8px}
.dashboard-kpis .lbl{font-size:12px;line-height:1.4}
.dashboard-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.dashboard-actions .btn{width:auto}
.dashboard-main-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px;align-items:start}
.dashboard-main-grid .card{height:100%;margin-bottom:0}
.document-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.document-row:last-child{border-bottom:0}
.document-row:hover .document-title{color:#C2410C}
.document-title{font-size:14px;font-weight:700;color:var(--text-strong)}
.document-meta{font-size:12px;color:var(--text-muted);margin-top:3px}
.document-amount{flex:none;font-family:var(--font-mono);font-weight:700;color:#C2410C}
.status-note{padding:12px 14px;border:1px solid #FED7AA;border-radius:var(--radius-sm);background:#FFF7ED;color:#9A3412;font-size:12px;line-height:1.5}
.assistant-panel{display:flex;flex-direction:column;gap:14px}
.assistant-label{display:inline-flex;align-self:flex-start;padding:4px 9px;border-radius:var(--radius-pill);background:var(--accent-soft);color:#9A3412;font-size:11px;font-weight:700;text-transform:uppercase}
.empty-state{padding:28px 12px;text-align:center;color:var(--text-muted)}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-heading h2{font-size:24px;line-height:1.25}
.page-heading p{margin-top:4px;color:var(--text-muted);font-size:13px}

@media (min-width:768px){
    body{padding-bottom:0}.hdr{display:flex}.sidebar{display:flex}.bottom-nav,.fab{display:none}
    .wrap{padding-top:28px}.row-2{grid-template-columns:1fr 1fr}
    .modal{border:1px solid var(--border);border-top:3px solid var(--accent);transform:translateY(8px)}
    .modal-overlay.show .modal{transform:translateY(0)}
}
@media (max-width:767px){
    body{padding-bottom:84px}.hdr{padding:10px 16px;min-height:64px}.wrap{padding:20px 14px 32px}
    .card{padding:18px;margin-bottom:14px}.kpi-grid{gap:10px}.kpi{padding:16px}.kpi .val{font-size:23px}
    .row-2{grid-template-columns:1fr}.modal-overlay{align-items:flex-end;padding:0}.modal{width:100%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:24px 18px max(24px,env(safe-area-inset-bottom))}
    .line-inputs{flex-wrap:wrap}.pu-wrapper{min-width:100%}
    .dashboard-top{align-items:stretch;flex-direction:column;gap:14px}.dashboard-top .btn{width:100%}
    .dashboard-top h2{font-size:24px}.dashboard-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dashboard-kpis .kpi:last-child{grid-column:1 / -1}.dashboard-actions{display:grid;grid-template-columns:1fr 1fr}
    .dashboard-actions .btn{width:100%;padding:11px 10px}.dashboard-main-grid{grid-template-columns:1fr;gap:14px}
    .page-heading{align-items:flex-start;flex-direction:column}.document-row{gap:10px}
    .hdr-context{display:none}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* PDF */
#pdf-template{display:none;width:210mm;padding:20mm;background:#fff;color:#000;font-family:Arial,sans-serif}
#pdf-template h1{font-size:28px;margin-bottom:24px;border-bottom:2px solid #000;padding-bottom:12px}
#pdf-template .header-info{display:flex;justify-content:space-between;margin-bottom:40px}
#pdf-template .box{width:45%;font-size:14px;line-height:1.6}
#pdf-template table{width:100%;border-collapse:collapse;margin-bottom:24px}
#pdf-template th{text-align:left;padding:12px;border-bottom:2px solid #000;font-size:14px}
#pdf-template td{padding:12px;border-bottom:1px solid #ccc;font-size:14px}
#pdf-template .totals{text-align:right;font-size:16px;line-height:1.8}
#pdf-template .legal{margin-top:60px;font-size:11px;color:#555;line-height:1.5}
</style>
</head>
<body>

<header class="hdr">
    <div style="display:flex;align-items:center;cursor:pointer" role="button" tabindex="0" onclick="go('accueil')" aria-label="Retour au tableau de bord">
    <div class="hdr-mark">A</div>
    <div><h1>ArtisanApp</h1><p>Copilote V18</p></div>
  </div>
    <div class="hdr-context" id="header-page-title">Tableau de bord</div>
</header>

<div class="layout-wrapper">
  <aside class="sidebar" id="desktop-sidebar">
    <div style="padding:0 24px 24px 24px; font-weight:900; font-size:22px; border-bottom:1px solid var(--border); margin-bottom:16px;">ArtisanApp</div>
    <button type="button" class="nav-item" onclick="go('accueil')" id="side-accueil">Tableau de bord</button>
    <button type="button" class="nav-item" onclick="go('devis')" id="side-devis">Mes Devis</button>
    <button type="button" class="nav-item" onclick="go('clients')" id="side-clients">Mes Clients</button>
    <button type="button" class="nav-item" onclick="go('equipe')" id="side-equipe">Mon Équipe</button>
    <button type="button" class="nav-item" onclick="go('parametres')" id="side-param">Paramètres</button>
  </aside>

<script>
/* ═══════════════════════════════════════════════════════════════════
   MOTEUR V18 — AI, SEARCH & INVOICING
   ═══════════════════════════════════════════════════════════════════ */

// ─── 1. STORAGE LAYER ───
const SCHEMA_VERSION = 2;
const STORAGE_KEYS = { settings: 'app_settings', data: 'app_data', catalogue: 'app_cat', users: 'app_users' };
const DEFAULT_SETTINGS = {
    nom_entreprise: "", siret: "", adresse: "", cp: "", ville: "",
    tel: "", email: "", iban: "", bic: "", assurance: "",
    marge: 15, aleas: 5, emailjs_service: "", emailjs_template: "", emailjs_public: "",
    openai_key: "" 
};

function uuid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error('[Storage] write failed:', e); try { toast('⚠️ Sauvegarde impossible'); } catch(_) {} return false; }
}
function safeGetItem(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

function getS() {
  try {
    const raw = JSON.parse(safeGetItem(STORAGE_KEYS.settings) || '{}');
    return { ...DEFAULT_SETTINGS, ...raw };
  } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveS(s) { return safeSetItem(STORAGE_KEYS.settings, JSON.stringify(s)); }
let SETTINGS = getS();

function getUsers() { try { return JSON.parse(safeGetItem(STORAGE_KEYS.users)) || [{id:1, nom:'Patron', role:'admin'}]; } catch(e) { return [{id:1, nom:'Patron', role:'admin'}]; } }
function saveUsers(u) { return safeSetItem(STORAGE_KEYS.users, JSON.stringify(u)); }

const EMPTY_DATA = () => ({ schemaVersion: SCHEMA_VERSION, clients: [], devis: [], cpt: { c: 0, d: 0, f: 0 } });

function migrateData(data) {
  if (!data || typeof data !== 'object') return EMPTY_DATA();
  if (!Array.isArray(data.clients)) data.clients = [];
  if (!Array.isArray(data.devis)) data.devis = [];
  if (!data.cpt || typeof data.cpt !== 'object') data.cpt = { c: 0, d: 0, f: 0 };
  data.cpt.c = Number.isFinite(+data.cpt.c) ? +data.cpt.c : 0;
  data.cpt.d = Number.isFinite(+data.cpt.d) ? +data.cpt.d : 0;
  data.cpt.f = Number.isFinite(+data.cpt.f) ? +data.cpt.f : 0;

  const now = new Date().toISOString();
  data.clients.forEach(c => {
    if (!c.uuid) c.uuid = uuid();
    if (!c.createdAt) c.createdAt = c.date || now;
    if (!c.updatedAt) c.updatedAt = c.createdAt;
  });
  data.devis.forEach(dv => {
    if (!dv.uuid) dv.uuid = uuid();
    if (!dv.createdAt) dv.createdAt = dv.date || now;
    if (!dv.updatedAt) dv.updatedAt = dv.createdAt;
    if (!dv.type) dv.type = 'devis';
    if (dv.coutMateriaux === undefined) dv.coutMateriaux = 0;
    if (dv.tauxTVA === undefined) dv.tauxTVA = 10; 
  });

  if (data.schemaVersion === undefined) data.schemaVersion = SCHEMA_VERSION;
  return data;
}

function getData() {
  try {
    const raw = safeGetItem(STORAGE_KEYS.data);
    if (!raw) return EMPTY_DATA();
    return migrateData(JSON.parse(raw));
  } catch (e) { return EMPTY_DATA(); }
}
function saveData(d) {
  if (d && typeof d === 'object') d.schemaVersion = SCHEMA_VERSION;
  return safeSetItem(STORAGE_KEYS.data, JSON.stringify(d));
}

function getCatalogue() { try { return JSON.parse(safeGetItem(STORAGE_KEYS.catalogue)) || {}; } catch (e) { return {}; } }
function saveCatalogue(c) { return safeSetItem(STORAGE_KEYS.catalogue, JSON.stringify(c)); }

// ─── 2. MOTEUR DE CALCUL PUR ───
const TARIFS = {
    'carr.sol.std':{d:'Pose carrelage standard',u:'m2',pu:55,partF:0.35},
    'carr.sol.grand':{d:'Pose carrelage grand format',u:'m2',pu:80,partF:0.45},
    'carr.sol.mosaique':{d:'Pose mosaïque',u:'m2',pu:110,partF:0.50},
    'peint.mur.mat':{d:'Peinture murs (Mat)',u:'m2',pu:18,partF:0.25},
    'peint.mur.satin':{d:'Peinture murs (Satin)',u:'m2',pu:20,partF:0.25},
    'peint.plafond':{d:'Peinture plafond',u:'m2',pu:22,partF:0.25},
    'sdb.renov':{d:'Forfait rénovation SDB',u:'forfait',pu:4500,partF:0.30},
    'plomb.wc':{d:'Remplacement WC',u:'u',pu:650,partF:0.55},
    'elec.tableau':{d:'Tableau électrique',u:'forfait',pu:1100,partF:0.55},
    'mac.mur':{d:'Élévation mur parpaing',u:'m2',pu:75,partF:0.40}
};

function computeQuote(lignes, aleasPct, tvaPct) {
    let totalHTBrut = 0;
    lignes.forEach(l => {
        const q = Number.isFinite(+l.q) ? +l.q : 0;
        const pu = Number.isFinite(+l.pu) ? +l.pu : 0;
        totalHTBrut += q * pu;
    });
    
    totalHTBrut = Math.round(totalHTBrut * 100) / 100;
    const aleasMontant = Math.round(totalHTBrut * (aleasPct / 100) * 100) / 100;
    const totalHTNet = Math.round((totalHTBrut + aleasMontant) * 100) / 100;
    const montantTVA = Math.round(totalHTNet * (tvaPct / 100) * 100) / 100;
    const totalTTC = Math.round((totalHTNet + montantTVA) * 100) / 100;

    return { totalHTBrut, aleasMontant, totalHTNet, montantTVA, totalTTC };
}

// ─── 3. HELPERS UI ───
function esc(s) { if (!s) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function eur(n) { if (n === null || n === undefined) return '-'; return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function dateFr(iso) { try { return new Date(iso).toLocaleDateString('fr-FR'); } catch(e) { return '-'; } }
function init(nom) { if (!nom) return '?'; let p = nom.split(/\s+/); if (p.length === 1) return p[0].substring(0,2).toUpperCase(); return (p[0][0] + p[1][0]).toUpperCase(); }

let toastTimer;
let pendingDialogResolve = null;
let dialogReturnFocus = null;
function toast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function finishDialog(value) {
    if (!pendingDialogResolve) return;
    const resolve = pendingDialogResolve;
    pendingDialogResolve = null;
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('show');
    overlay.innerHTML = '';
    resolve(value);
    if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
}

function closeActiveModal() {
    if (pendingDialogResolve) { finishDialog(null); return; }
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('show');
    overlay.innerHTML = '';
    if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
}

function confirmDialog(message, confirmLabel = 'Confirmer') {
    const overlay = document.getElementById('modal-overlay');
    dialogReturnFocus = document.activeElement;
    overlay.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <h3 id="confirm-title">Confirmation</h3><p id="confirm-message">${esc(message)}</p>
        <div class="dialog-actions"><button type="button" class="btn btn-ghost" onclick="finishDialog(false)">Annuler</button><button type="button" class="btn btn-danger" onclick="finishDialog(true)">${esc(confirmLabel)}</button></div>
    </div>`;
    overlay.classList.add('show');
    overlay.querySelector('.btn-danger').focus();
    return new Promise(resolve => { pendingDialogResolve = resolve; });
}

function promptDialog(message) {
    const overlay = document.getElementById('modal-overlay');
    dialogReturnFocus = document.activeElement;
    overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
        <h3 id="prompt-title">${esc(message)}</h3><div class="field"><label for="app-prompt-input">Nom</label><input class="inp" id="app-prompt-input" autocomplete="name"></div>
        <div class="dialog-actions"><button type="button" class="btn btn-ghost" onclick="finishDialog(null)">Annuler</button><button type="button" class="btn" onclick="finishDialog(document.getElementById('app-prompt-input').value.trim())">Continuer</button></div>
    </div>`;
    overlay.classList.add('show');
    overlay.querySelector('#app-prompt-input').focus();
    return new Promise(resolve => { pendingDialogResolve = resolve; });
}

// ─── 4. NAVIGATION ───
let STACK = []; let CURRENT_ID = null; let CURRENT_MODE = 'new'; let DEV_LIGNES = [];

function go(page, id, mode) {
    CURRENT_ID = id || null;
    CURRENT_MODE = mode || 'new';
    STACK.push({ page, id, mode });
    render();
}
function back() { if (STACK.length > 1) { STACK.pop(); const p = STACK[STACK.length-1]; CURRENT_ID = p.id; CURRENT_MODE = p.mode; render(); } else { go('accueil'); } }
function home() { STACK = [{ page: 'accueil', id: null, mode: 'new' }]; CURRENT_ID = null; CURRENT_MODE = 'new'; render(); }

function render() {
    const cur = STACK[STACK.length - 1];
    if(!cur) return; 
    
    const root = document.getElementById('root');
    let html = '';
    const pageTitles = { accueil: 'Tableau de bord', parametres: 'Paramètres', equipe: 'Mon Équipe', clients: 'Mes Clients', 'nouveau-client': 'Nouveau client', 'fiche-client': 'Fiche client', devis: 'Mes Documents', 'nouveau-devis': 'Nouveau devis', 'detail-devis': 'Détail du document' };
    document.getElementById('header-page-title').textContent = pageTitles[cur.page] || 'ArtisanApp';

    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.sidebar .nav-item').forEach(a => a.classList.remove('active'));
    
    let activeNav = '';
    if (cur.page === 'accueil') activeNav = 'accueil';
    else if (cur.page.includes('client')) activeNav = 'clients';
    else if (cur.page.includes('devis')) activeNav = 'devis';
    else if (cur.page === 'parametres') activeNav = 'param';
    else if (cur.page === 'equipe') activeNav = 'equipe';

    const mNav = document.getElementById('nav-' + activeNav); if(mNav) mNav.classList.add('active');
    const dNav = document.getElementById('side-' + activeNav); if(dNav) dNav.classList.add('active');
    document.querySelectorAll('.bottom-nav a, .sidebar .nav-item').forEach(a => a.removeAttribute('aria-current'));
    if (mNav) mNav.setAttribute('aria-current', 'page');
    if (dNav) dNav.setAttribute('aria-current', 'page');

    const fab = document.getElementById('fab-main');
    if (cur.page === 'accueil') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-devis')"); }
    else if (cur.page === 'clients') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-client')"); }
    else if (cur.page === 'devis') { fab.style.display = 'flex'; fab.setAttribute('onclick', "go('nouveau-devis')"); }
    else { fab.style.display = 'none'; }

    try {
        switch (cur.page) {
            case 'accueil': html = viewAccueil(); break;
            case 'parametres': html = viewParametres(); break;
            case 'equipe': html = viewEquipe(); break;
            case 'clients': html = viewClients(); break;
            case 'nouveau-client': html = viewFormClient(); break;
            case 'fiche-client': html = viewFicheClient(); break;
            case 'devis': html = viewDevis(); break;
            case 'nouveau-devis': html = viewFormDevis(); break;
            case 'detail-devis': html = viewDetailDevis(); break;
        }
    } catch(e) { html = `<div class="card"><h3>Erreur</h3><p>${esc(e.message)}</p></div>`; }
    root.innerHTML = `<div class="page-content">${html}</div>`;
    associateFieldLabels(root);
    
    if (cur.page === 'nouveau-devis') {
        setTimeout(() => { if(document.getElementById('lines-container')) renderLines(); }, 10);
    }
    
    window.scrollTo(0,0);
}

function associateFieldLabels(container) {
    container.querySelectorAll('.field label').forEach(label => {
        const control = Array.from(label.parentElement.children).find(el => /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName));
        if (control && control.id && !label.htmlFor) label.htmlFor = control.id;
    });
}

        <div class="dashboard-actions" aria-label="Accès rapides">
            <button class="btn btn-ghost" onclick="go('nouveau-client')">Nouveau client</button>
            <button class="btn btn-ghost" onclick="go('clients')">Voir les clients</button>
            <button class="btn btn-ghost" onclick="go('devis')">Voir les documents</button>

        <div class="dashboard-main-grid">

                <div class="card-head"><div class="card-title" id="recent-documents-title">Documents récents</div><button class="btn btn-sm btn-ghost" onclick="go('devis')">Tout voir</button></div>
                ${recent.length === 0 ? '<div class="empty-state">Aucun document pour le moment.</div>' : recent.map(x => `
                    <div class="document-row" role="button" tabindex="0" onclick="go('detail-devis', '${esc(x.id)}')" aria-label="Ouvrir ${esc(x.type)} ${esc(x.id)} pour ${esc(x.clientNom)}">
                        <div><div class="document-title">${esc(x.clientNom)}</div><div class="document-meta">${esc(x.id)} · ${esc(x.type).toUpperCase()} · ${esc(x.statut).toUpperCase()}</div></div>

                <button class="btn btn-ghost" onclick="go('nouveau-devis')">Ouvrir le formulaire</button>
                <div class="status-note">L’IA appelle actuellement OpenAI depuis le navigateur. La clé API enregistrée dans le navigateur n’est pas protégée; cette intégration n’est pas sécurisée pour la production.</div>
            </section>
        </div>
    `;
}

document.addEventListener('keydown', event => {
    const overlay = document.getElementById('modal-overlay');
    const modalOpen = overlay.classList.contains('show');
    if (modalOpen && event.key === 'Escape') { event.preventDefault(); closeActiveModal(); return; }
    if (pendingDialogResolve && event.key === 'Enter' && event.target.id === 'app-prompt-input') {
        event.preventDefault(); finishDialog(event.target.value.trim()); return;
    }
    if (modalOpen && event.key === 'Tab') {
        const focusable = Array.from(document.querySelectorAll('#modal-overlay button, #modal-overlay input, #modal-overlay textarea, #modal-overlay select')).filter(el => !el.disabled);
        const first = focusable[0]; const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        return;
    }
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const target = event.target;
    if (!target.matches('[role="button"][onclick]')) return;
    event.preventDefault();
    target.click();
});

function processImport(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const backup = JSON.parse(e.target.result);
            if (backup.data && backup.settings) {
                if (await confirmDialog("Cela remplacera vos données actuelles. Continuer ?", "Remplacer les données")) {
                    const previousData = safeGetItem(STORAGE_KEYS.data);
                    const previousSettings = safeGetItem(STORAGE_KEYS.settings);
                    const dataSaved = saveData(migrateData(backup.data));
                    const settingsSaved = dataSaved && saveS({...DEFAULT_SETTINGS, ...backup.settings});
                    if (!dataSaved || !settingsSaved) {
                        try {
                            if (previousData === null) localStorage.removeItem(STORAGE_KEYS.data);
                            else localStorage.setItem(STORAGE_KEYS.data, previousData);
                            if (previousSettings === null) localStorage.removeItem(STORAGE_KEYS.settings);
                            else localStorage.setItem(STORAGE_KEYS.settings, previousSettings);
                        } catch (rollbackError) { console.error('[Import] rollback failed:', rollbackError); }
                        toast("Import échoué; les données précédentes ont été restaurées si le stockage l'a permis.");
                        return;
                    }
                    SETTINGS = getS();
                    toast("Import réussi !"); home();
                }
            } else { toast("Fichier invalide"); }
        } catch(err) { toast("Erreur de lecture"); }
    };
    reader.readAsText(file); event.target.value = '';
}

async function parseIA() {
    const btn = document.getElementById('btn-ia');
    const text = document.getElementById('ia-text').value.trim();
    if (!text) { toast("Décrivez les travaux."); return; }

    btn.textContent = "Analyse en cours…";
    btn.disabled = true;

    try {
        const result = await generateQuoteWithAI(text);
        // On garde les lignes existantes (hors ligne vide par défaut) et on ajoute les nouvelles
        const lignesExistantes = DEV_LIGNES.filter(l => l.d.trim() !== '' || l.pu > 0);
        DEV_LIGNES = lignesExistantes.concat(result);
        renderLines();
        toast("Lignes générées par l'IA !");
    } catch (e) {
        toast("Erreur IA : " + e.message);
        if (!e.message.startsWith('Assistant indisponible :')) console.error(e);
    } finally {
        btn.textContent = "Générer avec l’assistant";
        btn.disabled = false;
    }
}

async function generateQuoteWithAI(texte) {
    const apiKey = SETTINGS.openai_key;
    
    if (!apiKey) {
        throw new Error("Assistant indisponible : aucune configuration locale n'est enregistrée.");
    }

    const prompt = `Tu es un expert en bâtiment. Transforme cette description en lignes de devis.
    Description: "${texte}"
    Renvoie UNIQUEMENT un tableau JSON valide (aucun texte autour) avec les clés exactes suivantes : 
    "designation" (texte), "quantite" (nombre), "unite" (texte : m2, u, forfait, ml).
    Exemple: [{"designation":"Pose carrelage","quantite":20,"unite":"m2"}]`;

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
            model: "gpt-4o",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.1
        })
    });

    if (!response.ok) throw new Error("Erreur API OpenAI");
    
    const data = await response.json();
    const content = data.choices[0].message.content;
    const jsonStr = content.replace(/```json/g, '').replace(/```/g, '').trim();
    const parsed = JSON.parse(jsonStr);

    return parsed.map(item => ({
        code: 'custom',
        d: item.designation,
        q: item.quantite,
        u: item.unite,
        pu: 0,
        puBase: 0
    }));
}

function addLine(code, q) {
    if (code === 'custom') {
        DEV_LIGNES.push({ code: 'custom', d: '', q: Number.isFinite(+q) ? +q : 1, u: 'forfait', pu: 0, puBase: 0 });
        renderLines();
        return;
    }
    const base = TARIFS[code];
    if (!base) return;
    const cat = getCatalogue();
    const pu = cat[code] !== undefined ? cat[code] : base.pu;
    DEV_LIGNES.push({ code, d: base.d, q, u: base.u, pu, puBase: base.pu });
    renderLines();
}

function removeLine(index) {
    DEV_LIGNES.splice(index, 1);
    renderLines();
}

                    <div class="pu-wrapper">

                        <button type="button" class="btn-reset btn-danger" onclick="removeLine(${i})" aria-label="Supprimer la ligne ${i + 1}">Suppr.</button>
                    </div>
                </div>
            </div>
        `;
    });

    html += '<button type="button" class="btn btn-ghost add-line-button" onclick="addLine(\'custom\', 1)">+ Ajouter une ligne vierge</button>';

    const tot = computeQuote(DEV_LIGNES, SETTINGS.aleas, tauxTVA);
    const coutMat = parseFloat(document.getElementById('d-cout-materiaux')?.value) || 0;
    const marge = tot.totalHTNet - coutMat;

            <div style="display:flex;align-items:center;gap:16px;margin:16px 0;padding:16px 0;border-top:1px solid var(--border);">
                <label style="font-size:13px;font-weight:700;color:var(--text-muted);">Taux de TVA</label>
                <select class="inp" style="flex:1;padding:12px;" onchange="document.getElementById('lines-container').dataset.tva=this.value; renderLines();">

            </div>

function updateLine(i, f, v) {
    if (f === 'q') DEV_LIGNES[i].q = parseFloat(v) || 0;
    if (f === 'd') DEV_LIGNES[i].d = v.trim();
    if (f === 'u') DEV_LIGNES[i].u = v;
    if (f === 'pu') {
        DEV_LIGNES[i].pu = parseFloat(v) || 0;
        if (DEV_LIGNES[i].code !== 'custom') { let c = getCatalogue(); c[DEV_LIGNES[i].code] = DEV_LIGNES[i].pu; saveCatalogue(c); }
    }
    renderLines();
}

function resetLine(i) {
    if (DEV_LIGNES[i].code === 'custom') return;
    DEV_LIGNES[i].pu = DEV_LIGNES[i].puBase;
    let c = getCatalogue(); delete c[DEV_LIGNES[i].code]; saveCatalogue(c);
    renderLines();
}

function saveDevis() {
    let cid;
    const d = getData();
    const cont = document.getElementById('lines-container');
    const parsedTVA = parseFloat(cont.dataset.tva);
    const tauxTVA = Number.isFinite(parsedTVA) ? parsedTVA : 10;
    const coutMateriaux = parseFloat(document.getElementById('d-cout-materiaux').value) || 0;
    
    if (CURRENT_MODE === 'edit') {
        cid = d.devis.find(x => x.id === CURRENT_ID).clientId;
    } else {
        cid = document.getElementById('d-client').value;
    }
    if (!cid) { toast("Sélectionnez un client"); return; }

    // Filtrer les lignes complètement vides pour éviter de sauvegarder du vent
    const lignesValides = DEV_LIGNES.filter(l => l.d.trim() !== '' || l.pu > 0);
    if (lignesValides.length === 0) { toast("Ajoutez au moins une prestation."); return; }
    
    const tot = computeQuote(lignesValides, SETTINGS.aleas, tauxTVA);
    const c = d.clients.find(x => x.id === cid);
    
    if (CURRENT_MODE === 'edit') {
        const idx = d.devis.findIndex(x => x.id === CURRENT_ID);
        if (idx > -1) {
            d.devis[idx].lignes = lignesValides.map(l => ({ code: l.code, d: l.d, q: l.q, u: l.u, pu: l.pu }));
            d.devis[idx].tauxTVA = tauxTVA;
            d.devis[idx].coutMateriaux = coutMateriaux;
            d.devis[idx].aleas = tot.aleasMontant;
            d.devis[idx].totalHT = tot.totalHTNet;
            d.devis[idx].tva = tot.montantTVA;
            d.devis[idx].totalTTC = tot.totalTTC;
            d.devis[idx].updatedAt = new Date().toISOString();
        }
        if (!saveData(d)) { toast("Devis non enregistré. Vérifiez l'espace disponible."); return; }
        toast("Devis mis à jour"); 
        go('detail-devis', CURRENT_ID, 'view');
    } else {
        d.cpt.d++; const id = 'DEV-' + new Date().getFullYear() + '-' + String(d.cpt.d).padStart(4, '0');
        const now = new Date().toISOString();
        d.devis.push({
            id, uuid: uuid(), type: 'devis', clientId: cid, clientUuid: c.uuid, clientNom: c.nom,
            date: now, createdAt: now, updatedAt: now,
            statut: 'brouillon',
            lignes: lignesValides.map(l => ({ code: l.code, d: l.d, q: l.q, u: l.u, pu: l.pu })),
            tauxTVA: tauxTVA,
            coutMateriaux: coutMateriaux,
            aleas: tot.aleasMontant,
            totalHT: tot.totalHTNet,
            tva: tot.montantTVA,
            totalTTC: tot.totalTTC
        });
        if (!saveData(d)) { toast("Devis non enregistré. Vérifiez l'espace disponible."); return; }
        toast("Devis enregistré"); 
        go('detail-devis', id, 'view');
    }
}

function viewDetailDevis() {
    const d = getData(); const dev = d.devis.find(x => x.id === CURRENT_ID);
    if(!dev) return '<div class="card">Document introuvable</div>';
    const tauxTVA = dev.tauxTVA !== undefined ? dev.tauxTVA : 10;
    const coutMat = dev.coutMateriaux || 0;
    const marge = dev.totalHT - coutMat;
    
    return `
        <div class="card">
            <div class="card-head">
                <div class="card-title">${esc(dev.id)}</div>
                <span style="background:var(--primary-light);color:var(--primary);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;">${esc(dev.type).toUpperCase()} - ${esc(dev.statut).toUpperCase()}</span>
            </div>
            <div style="color:var(--text-muted);margin-bottom:24px;font-weight:500;">Client : <strong style="color:var(--text-main);">${esc(dev.clientNom)}</strong></div>
            
            ${dev.lignes.map(l => `
                <div style="display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);">
                    <div><div style="font-weight:800;">${esc(l.d)}</div><div style="font-size:13px;color:var(--text-muted);">${l.q} ${esc(l.u)} x ${eur(l.pu)}</div></div>
                    <div style="font-family:var(--font-mono);font-weight:800;">${eur(l.q * l.pu)}</div>
                </div>
            `).join('')}

            <div style="background:var(--bg);padding:24px;border-radius:12px;margin-top:24px;border:1px solid var(--border);">
                <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>Aléas</span><span>${eur(dev.aleas)}</span></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>Total HT Net</span><span>${eur(dev.totalHT)}</span></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:var(--text-muted);font-weight:600;"><span>TVA (${tauxTVA}%)</span><span>${eur(dev.tva)}</span></div>
                <div style="display:flex;justify-content:space-between;border-top:2px solid var(--border);padding-top:16px;margin-top:12px;font-weight:800;font-size:24px;color:var(--primary);"><span>TOTAL TTC</span><span>${eur(dev.totalTTC)}</span></div>
                
                <div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);font-weight:700;color:var(--success);">
                    <span>Marge (HT Net - ${eur(coutMat)} de matériaux)</span><span>${eur(marge)}</span>
                </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:12px;margin-top:32px;">
                <button class="btn" onclick="genPDF('${esc(dev.id)}')">Générer le PDF</button>
                <button class="btn btn-ghost" onclick="sendMail('${esc(dev.id)}')">Envoyer par Email</button>
                
                ${dev.type === 'devis' && dev.statut !== 'accepte' ? `<button class="btn btn-success" onclick="acceptDevis('${esc(dev.id)}')">Marquer comme Accepté</button>` : ''}
                ${dev.type === 'devis' && dev.statut === 'accepte' ? `<button class="btn" style="background:var(--success);" onclick="exportToFacture('${esc(dev.id)}')">Générer la Facture</button>` : ''}
                
                <div class="row-2" style="margin-top:12px;">
                    <button class="btn btn-ghost" onclick="go('nouveau-devis', '${esc(dev.id)}', 'edit')">Modifier</button>
                    <button class="btn btn-ghost btn-danger" onclick="delDevis('${esc(dev.id)}')">Supprimer</button>
                </div>
            </div>
        </div>
    `;
}

function acceptDevis(id) {
    let d = getData(); let dev = d.devis.find(x => x.id === id); 
    if(dev) { dev.statut = 'accepte'; dev.updatedAt = new Date().toISOString(); if (!saveData(d)) { toast("Statut non enregistré. Vérifiez l'espace disponible."); return; } render(); toast("Devis accepté !"); }
}

function exportToFacture(id) {
    let d = getData();
    const dev = d.devis.find(x => x.id === id);
    if (!dev || dev.type === 'facture') return;

    d.cpt.f++;
    const facId = 'FAC-' + new Date().getFullYear() + '-' + String(d.cpt.f).padStart(4, '0');
    const now = new Date().toISOString();

    const facture = {
        ...dev,
        id: facId,
        uuid: uuid(),
        type: 'facture',
        statut: 'emise',
        date: now,
        createdAt: now,
        updatedAt: now,
        linkedDevisId: dev.id 
    };

    d.devis.push(facture);
    if (!saveData(d)) { toast("Facture non enregistrée. Vérifiez l'espace disponible."); return; }
    toast("Facture générée avec succès !");
    go('detail-devis', facId, 'view');
}

async function delDevis(id) {
    if (!await confirmDialog("Supprimer ce document ? Cette action est irréversible.", "Supprimer")) return;
    let d = getData(); d.devis = d.devis.filter(x => x.id !== id);
    if (!saveData(d)) { toast("Suppression non enregistrée. Vérifiez l'espace disponible."); return; }
    home();
}

function genPDF(id) {
    const d = getData(); const dev = d.devis.find(x => x.id === id); const s = SETTINGS;
    if(!dev) return;
    const tauxTVA = dev.tauxTVA !== undefined ? dev.tauxTVA : 10;
    const docType = dev.type === 'facture' ? 'FACTURE' : 'DEVIS';
    
    const html = `
        <h1>${docType} N° ${esc(dev.id)}</h1>
        <div class="header-info">
            <div class="box"><strong>${esc(s.nom_entreprise)}</strong><br>${esc(s.adresse)}<br>${esc(s.cp)} ${esc(s.ville)}<br>Siret: ${esc(s.siret)}<br>Décennale: ${esc(s.assurance)}</div>
            <div class="box" style="text-align:right;"><strong>Client :</strong><br>${esc(dev.clientNom)}<br>Date: ${dateFr(dev.date)}<br>Validité: 30 jours</div>
        </div>
        <table>
            <thead><tr><th>Désignation</th><th>Qté</th><th>P.U. HT</th><th>Total HT</th></tr></thead>
            <tbody>${dev.lignes.map(l => `<tr><td>${esc(l.d)}</td><td>${l.q} ${esc(l.u)}</td><td>${eur(l.pu)}</td><td>${eur(l.q * l.pu)}</td></tr>`).join('')}</tbody>
        </table>
        <div class="totals">
            <p>Aléas: ${eur(dev.aleas)}</p><p><strong>Total HT Net: ${eur(dev.totalHT)}</strong></p><p>TVA (${tauxTVA}%): ${eur(dev.tva)}</p><h3>TOTAL TTC: ${eur(dev.totalTTC)}</h3>
        </div>
        <div class="legal">
            <p>Conditions : ${dev.type === 'devis' ? '30% à la commande, solde à la livraison.' : 'Paiement à réception de facture.'}</p>
            <p>IBAN: ${esc(s.iban)} - BIC: ${esc(s.bic)}</p>
        </div>
    `;
    const el = document.getElementById('pdf-template'); el.innerHTML = html; el.style.display = 'block';
    html2pdf().set({ margin: 0, filename: `${docType}_${dev.id}.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(el).save().then(() => { el.style.display = 'none'; });
}

function sendMail(id) {
    const d = getData(); const dev = d.devis.find(x => x.id === id); const s = SETTINGS;
    if (!dev) return;
    const c = d.clients.find(x => x.id === dev.clientId);
    if (!c) return;
    if (s.emailjs_public && s.emailjs_service && window.emailjs) emailjs.init(s.emailjs_public);
    const ov = document.getElementById('modal-overlay');
    dialogReturnFocus = document.activeElement;
    ov.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mail-modal-title">
            <h3 id="mail-modal-title">Envoyer par email</h3>
            <div class="field"><label for="m-to">Email du client</label><input class="inp" id="m-to" type="email" value="${esc(c.email) || ''}"></div>
            <div class="field"><label for="m-msg">Message</label><textarea class="inp" rows="4" id="m-msg">Bonjour ${esc(c.nom)},\n\nJe vous transmets les informations relatives à votre ${dev.type} ${esc(dev.id)}, d'un montant de ${eur(dev.totalTTC)} TTC.\n\nCordialement,\n${esc(s.nom_entreprise)}</textarea></div>
            <button class="btn" onclick="execMail('${esc(id)}')">Envoyer</button>
            <button class="btn btn-ghost" style="margin-top:12px;" onclick="closeActiveModal()">Annuler</button>
        </div>
    `;
    ov.classList.add('show');
    document.getElementById('m-to').focus();
}

function execMail(id) {
    const to = document.getElementById('m-to').value; const msg = document.getElementById('m-msg').value; const s = SETTINGS;
    if (!to) { toast("Email obligatoire"); return; }
    if (s.emailjs_service && s.emailjs_template && s.emailjs_public && window.emailjs) {
        toast("Envoi...");
        emailjs.send(s.emailjs_service, s.emailjs_template, { to_email: to, message: msg, from_name: s.nom_entreprise })
            .then(() => {
                let message = "Email envoyé !";
                let d = getData(); let dev = d.devis.find(x => x.id === id);
                if(dev && dev.type === 'devis') {
                    dev.statut = 'envoye'; dev.updatedAt = new Date().toISOString();
                    if (!saveData(d)) message = "Email envoyé, mais statut non enregistré. Vérifiez l'espace disponible.";
                    else render();
                }
                closeActiveModal();
                toast(message);
            }, (e) => { toast("Erreur d'envoi : " + (e?.text || "service indisponible")); });
    } else {
        const sub = encodeURIComponent(`${id} - ${s.nom_entreprise}`); const bod = encodeURIComponent(msg);
        window.location.href = `mailto:${to}?subject=${sub}&body=${bod}`;
        closeActiveModal();
        toast("Application email ouverte. Envoi non confirmé; statut inchangé.");
    }
}

// Init
home();
</script>
</body>
</html>
