<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ArtisanApp</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface-2:#fbfbfc;
  --border:#e4e7ec;--border-2:#d0d5dd;
  --text:#101828;--muted:#667085;--muted-2:#98a2b3;
  --primary:#155eef;--primary-h:#004eeb;--primary-bg:#eff4ff;
  --green:#067647;--green-bg:#ecfdf3;--green-b:#abefc6;
  --amber:#b54708;--amber-bg:#fffaeb;--amber-b:#fedf89;
  --red:#b42318;--red-bg:#fef3f2;--red-b:#fecdca;
  --gray-bg:#f2f4f7;
  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-md:0 4px 8px -2px rgba(16,24,40,.1);
  --sh-lg:0 12px 24px -6px rgba(16,24,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none;cursor:pointer}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.hdr-mark{width:36px;height:36px;background:var(--primary);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.hdr-text h1{font-size:15px;font-weight:700}
.hdr-text p{font-size:11.5px;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:16px}
.hdr-nav{display:flex;gap:8px}
.hdr-nav a{font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:6px}
.hdr-nav a:hover{background:var(--gray-bg);color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:var(--sh-xs)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted)}
.hero-actions{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:20px}
.btn-hero{display:flex;align-items:center;gap:16px;background:var(--primary);color:#fff;padding:24px 26px;border-radius:12px;font-weight:600;text-align:left;min-height:88px;transition:all .15s}
.btn-hero:hover{background:var(--primary-h);transform:translateY(-1px)}
.btn-hero .hi{width:48px;height:48px;background:rgba(255,255,255,.18);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.btn-hero h3{font-size:17px;font-weight:700;margin-bottom:2px}
.btn-hero p{font-size:12.5px;opacity:.85;font-weight:400}
.btn-hero-2{display:flex;align-items:center;gap:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:24px;border-radius:12px;text-align:left;min-height:88px;transition:all .15s}
.btn-hero-2:hover{border-color:var(--primary);background:var(--primary-bg)}
.btn-hero-2 .hi{width:44px;height:44px;background:var(--primary-bg);color:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.btn-hero-2 h3{font-size:14.5px;font-weight:700}
.btn-hero-2 p{font-size:11.5px;color:var(--muted)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.kpi{padding:16px 20px;border-right:1px solid var(--border);cursor:pointer}
.kpi:last-child{border-right:none}
.kpi:hover{background:var(--surface-2)}
.kpi .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .val.pos{color:var(--green)}
.kpi .val.warn{color:var(--amber)}
.kpi .sub{font-size:11px;color:var(--muted-2);margin-top:2px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field .req{color:var(--red);margin-left:2px}
.inp{width:100%;padding:10px 12px;font-size:14px;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;transition:all .12s;outline:none}
.inp:hover{border-color:#98a2b3}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,94,239,.12)}
textarea.inp{resize:vertical;min-height:80px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;background:var(--primary);color:#fff;transition:all .12s}
.btn:hover{background:var(--primary-h)}
.btn:disabled{background:var(--gray-bg);color:var(--muted-2);cursor:not-allowed}
.btn-block{width:100%;padding:14px 20px;font-size:14px}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}
.btn-ghost:hover{background:var(--gray-bg)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--red)}
.btn-danger:hover{background:#912018}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:16px;padding:6px 10px;border-radius:6px}
.back-btn:hover{background:var(--gray-bg);color:var(--text)}
.list-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--surface-2)}
.list-avatar{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#155eef,#004eeb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.list-body{flex:1;min-width:0}
.list-title{font-size:13.5px;font-weight:600;margin-bottom:1px}
.list-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-right{font-size:13px;font-weight:600;text-align:right;flex-shrink:0}
.list-right .sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;padding:9px 14px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border)}
.tbl th.num{text-align:right}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.num{text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.tbl td.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:600}
.bdg.ok,.bdg.accepted{background:var(--green-bg);color:var(--green)}
.bdg.warn,.bdg.sent{background:var(--amber-bg);color:var(--amber)}
.bdg.draft{background:var(--gray-bg);color:var(--muted)}
.bdg.refused{background:var(--red-bg);color:var(--red)}
.ai-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.ai-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ai-icon{width:40px;height:40px;background:linear-gradient(135deg,#155eef,#004eeb);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ai-head-txt h2{font-size:15px;font-weight:700;margin-bottom:2px}
.ai-head-txt p{font-size:12.5px;color:var(--muted)}
.ai-input-row{display:flex;gap:10px}
.ai-input-row .inp{flex:1}
.analyse-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:14px}
.q-box{background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.q-box h3{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:12px}
.q-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.q-item .q-txt{font-size:13px;font-weight:500;margin-bottom:8px}
.q-item .q-opts{display:flex;flex-wrap:wrap;gap:6px}
.q-opt{padding:6px 12px;border:1px solid var(--border-2);border-radius:20px;background:var(--surface);font-size:12.5px;font-weight:500}
.q-opt:hover{border-color:var(--primary);color:var(--primary)}
.q-opt.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.section-label{font-size:13px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.section-label .bdg-pill{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.section-label.demande .bdg-pill{background:var(--green-bg);color:var(--green)}
.section-label.aConfirmer .bdg-pill{background:var(--amber-bg);color:var(--amber)}
.lines-table{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:4px}
.lines-table table{width:100%;border-collapse:collapse}
.lines-table th{text-align:left;padding:10px 12px;font-size:10.5px;font-weight:600;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border)}
.lines-table th.num{text-align:right}
.lines-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
.lines-table tr:last-child td{border-bottom:none}
.lines-table input{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px;font-size:13px}
.lines-table input:hover{border-color:var(--border)}
.lines-table input:focus{outline:none;border-color:var(--primary);background:#fff}
.lines-table td.num{text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.totaux{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-top:16px}
.totaux .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.totaux .tr .v{font-family:ui-monospace,Consolas,monospace;font-weight:500}
.totaux .tr.sub{color:var(--muted);font-size:13px}
.totaux .tr.total{font-weight:700;font-size:20px;border-top:1px solid var(--border);padding-top:12px;margin-top:8px;color:var(--primary)}
.banner{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;border:1px solid;display:flex;gap:10px}
.banner.warn{background:var(--amber-bg);border-color:var(--amber-b);color:var(--amber)}
.banner.err{background:var(--red-bg);border-color:var(--red-b);color:var(--red)}
.banner.ok{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.empty{padding:40px 20px;text-align:center;color:var(--muted-2);font-style:italic;font-size:13px}
#toast{position:fixed;top:20px;right:20px;z-index:1000;background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-lg);opacity:0;transform:translateY(-10px);transition:all .2s;pointer-events:none;max-width:340px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .15s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:var(--sh-lg)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* --- ZONE D'IMPRESSION PDF --- */
@media print {
  body { background: #fff; font-size: 12px; }
  .hdr, .back-btn, .btn, .no-print, .toast { display: none !important; }
  .wrap { padding: 0; margin: 0; max-width: 100%; }
  .card { border: none; box-shadow: none; padding: 0; }
  .print-header { display: flex !important; justify-content: space-between; margin-bottom: 30px; }
  .print-logo { max-height: 80px; max-width: 200px; object-fit: contain; }
  .lines-table { border: 1px solid #000; }
  .lines-table th { background: #eee !important; color: #000; -webkit-print-color-adjust: exact; }
  .lines-table td, .lines-table th { border-bottom: 1px solid #ccc; }
  .totaux { border: 2px solid #000; margin-top: 20px; page-break-inside: avoid; }
  .print-signature { display: flex !important; justify-content: space-between; margin-top: 50px; }
  .print-signature .box { width: 45%; border: 1px solid #000; height: 100px; padding: 10px; }
}

@media (max-width:720px){
  .hdr{padding:12px 16px}
  .hdr-nav{display:none}
  .wrap{padding:16px 14px 60px}
  .hero-actions{grid-template-columns:1fr}
  .row-2,.row-3{grid-template-columns:1fr}
  .card{padding:18px 16px}
  .ai-input-row{flex-direction:column}
  .lines-table th,.lines-table td{padding:8px 6px;font-size:12px}
}
</style>
</head>
<body>

<header class="hdr no-print">
  <div class="hdr-brand" onclick="retourAccueil()">
    <div class="hdr-mark">A</div>
    <div class="hdr-text">
      <h1>ArtisanApp</h1>
      <p>Le copilote des artisans</p>
    </div>
  </div>
  <div class="hdr-right">
    <nav class="hdr-nav">
      <a onclick="retourAccueil()">Tableau de bord</a>
      <a onclick="naviguer('liste-clients')">Clients</a>
      <a onclick="naviguer('liste-devis')">Devis</a>
      <a onclick="naviguer('parametres')">Paramètres</a>
    </nav>
  </div>
</header>

<div id="toast" class="no-print"></div>
<div class="modal-overlay no-print" id="modal-overlay"></div>
<div class="wrap" id="root"></div>

<input type="file" id="import-file" accept=".json" style="display:none" onchange="importerDonnees(event)">

<script>
// Configuration par défaut
var DEFAULT_CONFIG = { 
  tauxHoraireInterne: 25, 
  fraisGenerauxPct: 15, 
  zone: 'province',
  entreprise: { nom: "Mon Entreprise", siret: "", adresse: "", tel: "", email: "", logo: "" }
};
var ZONES = {
  paris: { label:'Paris (75)', coeff:1.25 }, idf: { label:'Ile-de-France', coeff:1.15 },
  grande_ville: { label:'Grande ville', coeff:1.08 }, province: { label:'Province', coeff:1.00 },
  rural: { label:'Rural', coeff:0.95 }
};
function chargerConfig() {
  try {
    var raw = localStorage.getItem('artisanapp_config');
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    var c = JSON.parse(raw);
    for (var k in DEFAULT_CONFIG) if (c[k] === undefined) c[k] = DEFAULT_CONFIG[k];
    return c;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function sauverConfig(c) { try { localStorage.setItem('artisanapp_config', JSON.stringify(c)); } catch(e) {} }
var CONFIG = chargerConfig();

// Base tarifaire (simplifiée pour l'exemple)
var TARIFS = { postes: {
  'elec.prise':{d:'Pose prise 16A',u:'u',pu:85,partF:0.15,tempsH:0.6,src:'interne'},
  'elec.tableau':{d:'Tableau electrique complet',u:'forfait',pu:1100,partF:0.55,tempsH:6,src:'interne'},
  'plomb.fuite':{d:'Reparation fuite',u:'forfait',pu:280,partF:0.15,tempsH:2,src:'interne'},
  'plomb.wc':{d:'Pose WC complet',u:'u',pu:650,partF:0.55,tempsH:2.5,src:'interne'},
  'peint.mur':{d:'Peinture murs 2 couches',u:'m2',pu:18,partF:0.25,tempsH:0.15,src:'interne'},
  'peint.plafond':{d:'Peinture plafond',u:'m2',pu:22,partF:0.25,tempsH:0.18,src:'interne'},
  'mac.mur':{d:'Elevation mur parpaing',u:'m2',pu:75,partF:0.40,tempsH:0.5,src:'interne'},
  'mac.dalle':{d:'Dalle beton',u:'m2',pu:85,partF:0.45,tempsH:0.6,src:'interne'},
  'carr.sol':{d:'Pose carrelage sol',u:'m2',pu:55,partF:0.35,tempsH:0.5,src:'interne'}
}};
var METIERS_MOTS = {
  electricite: ['electricite','prise','tableau'], plomberie: ['plomberie','fuite','wc'],
  peinture: ['peinture','mur','plafond'], maconnerie: ['maconnerie','mur','dalle','parpaing'],
  carrelage: ['carrelage','sol']
};

function normaliser(s) { return !s ? '' : String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

function parserDescription(texte) {
  var t = ' ' + normaliser(texte).replace(/,/g, '.') + ' ';
  var r = { brut:texte, metier:null, longueur:null, hauteur:null, surface:null, quantiteEquipement:null };
  var m;
  var reL = /(\d+(?:\.\d+)?)\s*(?:metres?|m|ml)/gi;
  while ((m = reL.exec(t)) !== null) { if(!/a\s*$/.test(t.substring(m.index-5, m.index))) { var v=parseFloat(m[1]); if(v>0&&v<500) r.longueur = r.longueur ? Math.max(r.longueur,v) : v; } }
  var reH = /(?:hauteur|haut)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:m|metres?)\s*(?:de\s*)?haut/gi;
  while ((m = reH.exec(t)) !== null) { var vh=parseFloat(m[1]||m[2]); if(vh>0&&vh<15) r.hauteur=vh; }
  var reS = /(\d+(?:\.\d+)?)\s*m\s*[²2]/gi; m = reS.exec(t); if(m) r.surface = parseFloat(m[1]);
  var reQ = /(\d+)\s+(prises?|interrupteurs?)/gi; m = reQ.exec(t); if(m) r.quantiteEquipement = { val:parseInt(m[1]), type:m[2] };
  var scores = {};
  for (var k in METIERS_MOTS) { var sc=0; for(var i=0;i<METIERS_MOTS[k].length;i++) if(t.indexOf(METIERS_MOTS[k][i])!==-1) sc+=METIERS_MOTS[k][i].length; if(sc>0) scores[k]=sc; }
  var best=null, bsc=0; for(var kk in scores) if(scores[kk]>bsc){bsc=scores[kk];best=kk;} r.metier=best;
  return r;
}

function construireLignes(parsed, metier) {
  var l = []; var surf = parsed.surface || (parsed.longueur && parsed.hauteur ? parsed.longueur*parsed.hauteur : null);
  function add(code, qte, cat) { var p=TARIFS.postes[code]; if(p) l.push({code:code,designation:p.d,quantite:qte,unite:p.u,pu:p.pu,partF:p.partF||0,tempsH:p.tempsH||0,categorie:cat,confiance:'confirme',inclus:true}); }
  if (metier==='peinture' && surf) { add('peint.mur', surf, 'demande'); }
  if (metier==='maconnerie' && surf) { add('mac.mur', surf, 'demande'); }
  if (metier==='carrelage' && surf) { add('carr.sol', surf, 'demande'); }
  if (metier==='electricite' && parsed.quantiteEquipement) { add('elec.prise', parsed.quantiteEquipement.val, 'demande'); }
  return l;
}

function calculerTotaux(lignes, tvaPct, zone) {
  var zc = ZONES[zone] ? ZONES[zone].coeff : 1;
  var totalHT = 0, coutF = 0, coutMO = 0, lInc=0, lCout=0;
  for (var i=0; i<lignes.length; i++) {
    var l = lignes[i]; if(!l.inclus || l.quantite===null) continue;
    lInc++; var tot = l.quantite * l.pu * zc; totalHT += tot;
    if(l.partF>0) coutF += tot*l.partF;
    if(l.tempsH>0) coutMO += l.quantite*l.tempsH*CONFIG.tauxHoraireInterne;
    if(l.partF>0||l.tempsH>0) lCout++;
  }
  var fg = coutMO * (CONFIG.fraisGenerauxPct/100); var cRev = coutF+coutMO+fg; var mCalc = lInc>0 && lCout===lInc;
  totalHT = Math.round(totalHT*100)/100; var mtva = Math.round(totalHT*tvaPct/100*100)/100; var ttc = totalHT+mtva;
  return { totalHT:totalHT, montantTVA:mtva, totalTTC:ttc, coutFournitures:Math.round(coutF*100)/100, coutMOInterne:Math.round(coutMO*100)/100, coutRevient:Math.round(cRev*100)/100, margeBrute: mCalc ? Math.round((totalHT-cRev)*100)/100 : null, margeCalculable:mCalc };
}

function charger() { try { var r=localStorage.getItem('artisanapp'); if(!r) return {clients:[],devis:[],compteurs:{clients:0,devis:0}}; return JSON.parse(r); } catch(e) { return {clients:[],devis:[],compteurs:{clients:0,devis:0}}; } }
function sauver(d) { try { localStorage.setItem('artisanapp', JSON.stringify(d)); } catch(e) { toast('Erreur sauvegarde','err'); } }
function esc(s) { return !s ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function eur(n) { return n===null?'-':(parseFloat(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2})+' EUR'; }
function dateFr(iso) { try{return new Date(iso).toLocaleDateString('fr-FR');}catch(e){return '-';} }
function initiales(nom) { if(!nom)return'?'; var p=nom.split(/\s+/).filter(x=>x.length); if(!p.length)return'?'; if(p.length===1)return p[0].substring(0,2).toUpperCase(); return (p[0][0]+p[1][0]).toUpperCase(); }
var toastTimer; function toast(m,t) { var el=document.getElementById('toast'); el.textContent=m; el.className='show '+(t||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='',3000); }
var MODAL_CB; function confirmer(t,m,cb,lo) { MODAL_CB=cb; document.getElementById('modal-overlay').innerHTML='<div class="modal"><h3>'+esc(t)+'</h3><p>'+esc(m)+'</p><div class="modal-actions"><button class="btn btn-ghost" onclick="document.getElementById(\'modal-overlay\').classList.remove(\'show\')">Annuler</button><button class="btn btn-danger" onclick="MODAL_CB();document.getElementById(\'modal-overlay\').classList.remove(\'show\')">'+(lo||'Confirmer')+'</button></div></div>'; document.getElementById('modal-overlay').classList.add('show'); }

var NAV=[], LOCK=false;
function naviguer(e,p,r) { if(r&&NAV.length)NAV[NAV.length-1]={e:e,p:p||{}}; else NAV.push({e:e,p:p||{}}); try{history.pushState({},'', '#'+e);}catch(x){} rendre(); }
function retour() { if(NAV.length>1){NAV.pop();rendre();} else retourAccueil(); }
function retourAccueil() { NAV=[{e:'accueil',p:{}}]; try{history.replaceState({},'', '#accueil');}catch(x){} rendre(); }
window.addEventListener('popstate',()=>{if(NAV.length>1){NAV.pop();rendre();}});

function rendre() {
  var cur=NAV[NAV.length-1]||{e:'accueil'}; var r=document.getElementById('root'); var h='';
  try {
    if(cur.e==='accueil') h=uiAccueil();
    else if(cur.e==='nouveau-client') h=uiNouveauClient();
    else if(cur.e==='fiche-client') h=uiFicheClient(cur.p.clientId);
    else if(cur.e==='liste-clients') h=uiListeClients();
    else if(cur.e==='liste-devis') h=uiListeDevis();
    else if(cur.e==='devis-detail') h=uiDevisDetail(cur.p.devisId);
    else if(cur.e==='nouveau-devis') h=uiNouveauDevis(cur.p.clientId);
    else if(cur.e==='parametres') h=uiParametres();
  } catch(e) { h='<div class="banner err">Erreur : '+esc(e.message)+'</div>'; console.error(e); }
  r.innerHTML=h; window.scrollTo(0,0);
}

function uiAccueil() {
  var data=charger(); var nbClients=data.clients.length; var nbDevis=data.devis.length;
  var caAccepte = data.devis.filter(d=>d.statut==='accepte').reduce((s,d)=>s+(d.totalTTC||0),0);
  var h = '<div class="hero-actions"><button class="btn-hero" onclick="naviguer(\'nouveau-client\')"><div class="hi">+</div><div><h3>Nouveau client</h3><p>Fiche rapide</p></div></button><button class="btn-hero-2" onclick="naviguer(\'nouveau-devis\')"><div class="hi">D</div><div><h3>Nouveau devis</h3><p>Chiffrer</p></div></button></div>';
  h += '<div class="kpi-strip"><div class="kpi" onclick="naviguer(\'liste-clients\')"><div class="lbl">Clients</div><div class="val">'+nbClients+'</div></div><div class="kpi" onclick="naviguer(\'liste-devis\')"><div class="lbl">Devis</div><div class="val">'+nbDevis+'</div></div><div class="kpi"><div class="lbl">CA Accepté</div><div class="val pos">'+eur(caAccepte)+'</div></div></div>';
  h += '<div class="card"><div class="card-head"><div class="card-title">Derniers clients</div></div>';
  if(!nbClients) h+='<div class="empty">Aucun client.</div>'; else {
    h+='<div style="margin:-24px;margin-top:0">'; data.clients.slice(-3).reverse().forEach(c=>{ h+='<div class="list-row" onclick="naviguer(\'fiche-client\',{clientId:\''+c.id+'\'})"><div class="list-avatar">'+initiales(c.nom)+'</div><div class="list-body"><div class="list-title">'+esc(c.nom)+'</div><div class="list-sub">'+esc(c.ville)+'</div></div></div>'; }); h+='</div>';
  }
  h += '</div>';
  h += '<div class="card"><div class="card-head"><div class="card-title">Sauvegarde (Sécurité)</div><div class="card-sub">Exportez vos données pour les transférer sur un autre appareil</div></div>';
  h += '<div style="display:flex; gap:10px; flex-wrap:wrap;"><button class="btn btn-ghost" onclick="exporterDonnees()">📥 Exporter mes données (JSON)</button><button class="btn btn-ghost" onclick="document.getElementById(\'import-file\').click()">📤 Importer un fichier</button></div></div>';
  return h;
}

function uiNouveauClient() {
  return '<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-head"><div class="card-title">Nouveau client</div></div><div class="field"><label>Nom <span class="req">*</span></label><input class="inp" id="c-nom"></div><div class="row-2"><div class="field"><label>Ville <span class="req">*</span></label><input class="inp" id="c-ville"></div><div class="field"><label>Téléphone</label><input class="inp" id="c-tel"></div></div><button class="btn btn-block" onclick="saveClient()">Enregistrer</button></div>';
}
function saveClient() {
  if(LOCK) return; LOCK=true;
  var nom=document.getElementById('c-nom').value.trim(), ville=document.getElementById('c-ville').value.trim(), tel=document.getElementById('c-tel').value.trim();
  if(!nom||!ville){toast('Nom et ville requis','err');LOCK=false;return;}
  var data=charger(); data.compteurs.clients=(data.compteurs.clients||0)+1; var annee=new Date().getFullYear(); var id='C-'+annee+'-'+String(data.compteurs.clients).padStart(4,'0');
  data.clients.push({id:id,nom:nom,ville:ville,tel:tel,dateCreation:new Date().toISOString()}); sauver(data);
  toast('Client créé','ok'); naviguer('fiche-client',{clientId:id},true); LOCK=false;
}

function uiFicheClient(id) {
  var data=charger(); var c=data.clients.find(x=>x.id===id); if(!c)return '<div class="empty">Introuvable</div>';
  var dv=data.devis.filter(d=>d.clientId===id);
  var h='<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-title">'+esc(c.nom)+'</div><div class="card-sub">'+esc(c.ville)+' - '+esc(c.tel)+'</div></div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">Devis</div><button class="btn btn-sm" onclick="naviguer(\'nouveau-devis\',{clientId:\''+c.id+'\'})">+ Devis</button></div>';
  if(!dv.length) h+='<div class="empty">Aucun devis.</div>'; else {
    h+='<table class="tbl"><tbody>'; dv.forEach(d=>{ h+='<tr onclick="naviguer(\'devis-detail\',{devisId:\''+d.id+'\'})"><td class="mono">'+d.id+'</td><td>'+dateFr(d.dateCreation)+'</td><td class="num">'+eur(d.totalTTC)+'</td></tr>'; }); h+='</tbody></table>';
  }
  h+='</div>'; return h;
}

function uiListeClients() {
  var data=charger(); var h='<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-title">Clients ('+data.clients.length+')</div>';
  data.clients.forEach(c=>{ h+='<div class="list-row" onclick="naviguer(\'fiche-client\',{clientId:\''+c.id+'\'})"><div class="list-avatar">'+initiales(c.nom)+'</div><div class="list-body"><div class="list-title">'+esc(c.nom)+'</div><div class="list-sub">'+esc(c.ville)+'</div></div></div>'; });
  h+='</div>'; return h;
}

var DEV={parsed:null,lignes:[],tva:20,clientId:null};
function uiNouveauDevis(clientId) {
  DEV={parsed:null,lignes:[],tva:20,clientId:clientId||null};
  var data=charger(); var h='<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-title">Nouveau devis</div>';
  h+='<div class="field"><select class="inp" id="d-client">'; data.clients.forEach(c=>{ h+='<option value="'+c.id+'" '+(clientId===c.id?'selected':'')+'>'+esc(c.nom)+'</option>'; }); h+='</select></div>';
  h+='<div class="ai-section"><input class="inp" id="ia-texte" placeholder="Ex: peinture 45 m2"><button class="btn" onclick="analyser()">Analyser</button></div><div id="dev-suite"></div></div>';
  setTimeout(()=>renderDevSuite(),0); return h;
}

function analyser() {
  var txt=document.getElementById('ia-texte').value; var p=parserDescription(txt);
  if(!p.metier){toast('Métier non reconnu','err');return;}
  DEV.parsed=p; DEV.lignes=construireLignes(p,p.metier); renderDevSuite();
}

function renderDevSuite() {
  var s=document.getElementById('dev-suite'); if(!s) return;
  var h='';
  if(DEV.lignes.length) {
    h+='<div class="lines-table"><table><thead><tr><th>Désignation</th><th class="num">Qté</th><th>Unité</th><th class="num">PU</th><th class="num">Total</th></tr></thead><tbody>';
    DEV.lignes.forEach((l,i)=>{ h+='<tr><td>'+l.designation+'</td><td class="num">'+l.quantite+'</td><td>'+l.unite+'</td><td class="num">'+eur(l.pu)+'</td><td class="num">'+eur(l.quantite*l.pu)+'</td></tr>'; });
    h+='</tbody></table></div>';
    var tot=calculerTotaux(DEV.lignes,DEV.tva,CONFIG.zone);
    h+='<div class="totaux"><div class="tr"><span>Total HT</span><span class="v">'+eur(tot.totalHT)+'</span></div><div class="tr"><span>TVA</span><span class="v">'+eur(tot.montantTVA)+'</span></div><div class="tr total"><span>TTC</span><span class="v">'+eur(tot.totalTTC)+'</span></div></div>';
    h+='<button class="btn btn-block" onclick="saveDevis()">Enregistrer</button>';
  }
  s.innerHTML=h;
}

function saveDevis() {
  var cid=document.getElementById('d-client').value; if(!cid){toast('Client requis','err');return;}
  var data=charger(); data.compteurs.devis=(data.compteurs.devis||0)+1; var annee=new Date().getFullYear(); var id='DEV-'+annee+'-'+String(data.compteurs.devis).padStart(4,'0');
  var tot=calculerTotaux(DEV.lignes,DEV.tva,CONFIG.zone);
  data.devis.push({id:id,clientId:cid,clientNom:data.clients.find(c=>c.id===cid).nom,lignes:DEV.lignes,totalHT:tot.totalHT,tauxTVA:DEV.tva,montantTVA:tot.montantTVA,totalTTC:tot.totalTTC,statut:'brouillon',dateCreation:new Date().toISOString()});
  sauver(data); toast('Devis créé','ok'); naviguer('devis-detail',{devisId:id},true);
}

function uiDevisDetail(id) {
  var data=charger(); var d=data.devis.find(x=>x.id===id); if(!d) return '<div class="empty">Introuvable</div>';
  var ent=CONFIG.entreprise;
  var h='<div class="no-print"><button class="back-btn" onclick="retour()">← Retour</button><div style="margin-bottom:20px;display:flex;gap:10px"><button class="btn btn-ghost" onclick="window.print()">🖨️ Imprimer / PDF</button><button class="btn btn-ghost" onclick="changerStatut(\''+d.id+'\')">Changer statut</button></div></div>';
  
  h+='<div class="card" style="padding:40px">';
  // En-tête impression
  h+='<div class="print-header" style="display:none; border-bottom:2px solid #000; padding-bottom:20px;">';
  if(ent.logo) h+='<img src="'+ent.logo+'" class="print-logo">';
  h+='<div><h2>'+esc(ent.nom)+'</h2><p>'+esc(ent.adresse)+'<br>'+esc(ent.tel)+'<br>Siret: '+esc(ent.siret)+'</p></div></div>';
  
  h+='<div style="margin-bottom:30px;"><h1 style="font-size:24px;color:var(--primary)">DEVIS '+d.id+'</h1><p>Date: '+dateFr(d.dateCreation)+'</p><p><strong>Client:</strong> '+esc(d.clientNom)+'</p></div>';
  
  h+='<table class="tbl"><thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">PU HT</th><th class="num">Total HT</th></tr></thead><tbody>';
  d.lignes.forEach(l=>{ h+='<tr><td>'+esc(l.designation)+'</td><td class="num">'+l.quantite+' '+l.unite+'</td><td class="num">'+eur(l.pu)+'</td><td class="num">'+eur(l.quantite*l.pu)+'</td></tr>'; });
  h+='</tbody></table>';
  
  h+='<div class="totaux"><div class="tr"><span>Total HT</span><span class="v">'+eur(d.totalHT)+'</span></div><div class="tr"><span>TVA '+d.tauxTVA+'%</span><span class="v">'+eur(d.montantTVA)+'</span></div><div class="tr total"><span>Total TTC</span><span class="v">'+eur(d.totalTTC)+'</span></div></div>';
  
  // Signature
  h+='<div class="print-signature" style="display:none;"><div class="box">Date et signature du client<br><br><em>Bon pour accord</em></div></div>';
  h+='</div>';
  return h;
}

function changerStatut(id) {
  var data=charger(); var d=data.devis.find(x=>x.id===id); if(!d)return;
  var st=['brouillon','envoye','accepte','refuse']; var idx=st.indexOf(d.statut||'brouillon');
  d.statut=st[(idx+1)%st.length]; sauver(data); toast('Statut: '+d.statut,'ok'); rendre();
}

function uiListeDevis() {
  var data=charger(); var h='<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-title">Devis ('+data.devis.length+')</div>';
  data.devis.forEach(d=>{ h+='<div class="list-row" onclick="naviguer(\'devis-detail\',{devisId:\''+d.id+'\'})"><div class="list-body"><div class="list-title">'+d.id+' - '+esc(d.clientNom)+'</div><div class="list-sub">'+dateFr(d.dateCreation)+'</div></div><div class="list-right">'+eur(d.totalTTC)+'</div></div>'; });
  h+='</div>'; return h;
}

function uiParametres() {
  var ent=CONFIG.entreprise;
  var h='<button class="back-btn" onclick="retour()">← Retour</button><div class="card"><div class="card-title">Paramètres de l\'entreprise</div>';
  h+='<div class="row-2"><div class="field"><label>Nom</label><input class="inp" id="p-nom" value="'+esc(ent.nom)+'"></div><div class="field"><label>Siret</label><input class="inp" id="p-siret" value="'+esc(ent.siret)+'"></div></div>';
  h+='<div class="field"><label>Adresse</label><input class="inp" id="p-adresse" value="'+esc(ent.adresse)+'"></div>';
  h+='<div class="row-2"><div class="field"><label>Téléphone</label><input class="inp" id="p-tel" value="'+esc(ent.tel)+'"></div><div class="field"><label>Logo (Image)</label><input type="file" id="p-logo" accept="image/*" class="inp"></div></div>';
  h+='<button class="btn btn-block" onclick="saveParam()">Enregistrer</button></div>';
  h+='<div class="card"><div class="card-title">Calcul de rentabilité</div><div class="field"><label>Taux Horaire (€/h)</label><input class="inp" type="number" id="p-taux" value="'+CONFIG.tauxHoraireInterne+'"></div><button class="btn btn-block" onclick="saveTaux()">Mettre à jour</button></div>';
  return h;
}

function saveParam() {
  var ent=CONFIG.entreprise;
  ent.nom=document.getElementById('p-nom').value; ent.siret=document.getElementById('p-siret').value;
  ent.adresse=document.getElementById('p-adresse').value; ent.tel=document.getElementById('p-tel').value;
  var file=document.getElementById('p-logo').files[0];
  if(file){ var r=new FileReader(); r.onload=function(e){ ent.logo=e.target.result; sauverConfig(CONFIG); toast('Paramètres & Logo sauvegardés','ok'); rendre(); }; r.readAsDataURL(file); }
  else { sauverConfig(CONFIG); toast('Paramètres sauvegardés','ok'); rendre(); }
}
function saveTaux() { CONFIG.tauxHoraireInterne=parseFloat(document.getElementById('p-taux').value)||25; sauverConfig(CONFIG); toast('Taux mis à jour','ok'); rendre(); }

// SAUVEGARDE / RESTAURATION JSON
function exporterDonnees() {
  var data=charger(); var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='artisanapp-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importerDonnees(e) {
  var file=e.target.files[0]; if(!file)return; var r=new FileReader();
  r.onload=function(ev){ try{ var d=JSON.parse(ev.target.result); if(d.clients&&d.devis){ confirmer('Importer les données ?', 'Cela remplacera vos données actuelles.', function(){ sauver(d); toast('Données importées !','ok'); rendre(); }); } else alert('Fichier invalide.'); }catch(err){ alert('Erreur de lecture.'); } };
  r.readAsText(file); e.target.value='';
}
