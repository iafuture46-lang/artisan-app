<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#155eef">
<title>ArtisanApp</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface-2:#fbfbfc;
  --border:#e4e7ec;--border-2:#d0d5dd;
  --text:#101828;--muted:#667085;--muted-2:#98a2b3;
  --primary:#155eef;--primary-h:#004eeb;--primary-bg:#eff4ff;
  --green:#067647;--green-bg:#ecfdf3;--green-b:#abefc6;
  --amber:#b54708;--amber-bg:#fffaeb;--amber-b:#fedf89;
  --red:#b42318;--red-bg:#fef3f2;--red-b:#fecdca;
  --gray-bg:#f2f4f7;
  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-md:0 4px 12px rgba(16,24,40,.08);
  --sh-lg:0 12px 24px -6px rgba(16,24,40,.14);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:80px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none;cursor:pointer}

/* HEADER MOBILE */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.hdr-mark{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;box-shadow:0 4px 10px rgba(21,94,239,.3)}
.hdr-text h1{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr-text p{font-size:12px;color:var(--muted);margin-top:1px}
.hdr-meta{font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-bg);padding:6px 12px;border-radius:20px}
.hdr-nav{display:none} /* Caché sur mobile, remplacé par la barre du bas */

/* BOTTOM NAVIGATION */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 20px 0;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.05)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:12px;transition:all .2s}
.bottom-nav a.active{color:var(--primary);background:var(--primary-bg)}
.bottom-nav svg{width:22px;height:22px}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}

/* CARTES & UI */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--sh-xs)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.card-title{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px}
.card-sub{font-size:13px;color:var(--muted)}

/* HERO ACTIONS (GROS BOUTONS) */
.hero-actions{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
.btn-hero{display:flex;align-items:center;gap:16px;background:var(--primary);color:#fff;padding:20px;border-radius:var(--radius);font-weight:700;text-align:left;min-height:90px;box-shadow:0 8px 20px rgba(21,94,239,.25);transition:transform .1s}
.btn-hero:active{transform:scale(.98)}
.btn-hero .hi{width:48px;height:48px;background:rgba(255,255,255,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.btn-hero h3{font-size:18px;margin-bottom:2px}
.btn-hero p{font-size:13px;opacity:.9;font-weight:500}
.btn-hero-2{display:flex;align-items:center;gap:16px;background:var(--surface);color:var(--text);border:2px solid var(--border-2);padding:20px;border-radius:var(--radius);text-align:left;min-height:90px;transition:all .2s}
.btn-hero-2:active{background:var(--gray-bg)}
.btn-hero-2 .hi{width:48px;height:48px;background:var(--primary-bg);color:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.btn-hero-2 h3{font-size:18px;margin-bottom:2px}
.btn-hero-2 p{font-size:13px;color:var(--muted);font-weight:500}

/* KPI CARDS MOBILE */
.kpi-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--sh-xs)}
.kpi.full-width{grid-column:span 2}
.kpi .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .val.pos{color:var(--green)}
.kpi .val.warn{color:var(--amber)}
.kpi .sub{font-size:12px;color:var(--muted-2);margin-top:2px;font-weight:500}

/* FORMULAIRES */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.field .req{color:var(--red);margin-left:2px}
.inp{width:100%;padding:14px 16px;font-size:16px;background:var(--gray-bg);border:1px solid transparent;border-radius:12px;transition:all .12s;outline:none}
.inp:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-bg)}
textarea.inp{resize:vertical;min-height:100px}
.row-2,.row-3{display:grid;grid-template-columns:1fr;gap:12px} /* Tout en 1 colonne sur mobile */

/* BOUTONS GLOBAUX */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:12px;font-size:16px;font-weight:700;background:var(--primary);color:#fff;transition:all .12s;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--gray-bg);color:var(--muted-2);transform:none}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn-danger{background:var(--red)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:16px;padding:8px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

/* LISTES CLIENTS / DEVIS */
.list-row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row:active{background:var(--gray-bg)}
.list-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#155eef,#004eeb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(21,94,239,.2)}
.list-body{flex:1;min-width:0}
.list-title{font-size:15px;font-weight:700;margin-bottom:2px}
.list-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.list-right{font-size:15px;font-weight:800;text-align:right;flex-shrink:0}
.list-right .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

/* TABLEAUX */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:12px 8px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.tbl th.num{text-align:right}
.tbl td{padding:16px 8px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num{text-align:right;font-family:ui-monospace,monospace;font-weight:700}
.tbl td.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bdg.ok,.bdg.accepted{background:var(--green-bg);color:var(--green)}
.bdg.warn,.bdg.sent{background:var(--amber-bg);color:var(--amber)}
.bdg.draft{background:var(--gray-bg);color:var(--muted)}
.bdg.refused{background:var(--red-bg);color:var(--red)}

/* SECTION IA & QUESTIONS */
.ai-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.ai-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.ai-icon{width:44px;height:44px;background:linear-gradient(135deg,#155eef,#004eeb);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 4px 12px rgba(21,94,239,.3)}
.ai-head-txt h2{font-size:16px;font-weight:800;margin-bottom:2px}
.ai-head-txt p{font-size:13px;color:var(--muted);font-weight:500}
.ai-input-row{display:flex;flex-direction:column;gap:12px} /* Bouton en dessous du champ sur mobile */
.analyse-box{background:var(--gray-bg);border-radius:12px;padding:16px;margin-top:16px}
.analyse-section{margin-bottom:12px}
.analyse-section:last-child{margin-bottom:0}
.analyse-section h4{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.analyse-fact{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:14px}
.analyse-fact .v{font-weight:700}

.q-box{background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.q-box h3{font-size:14px;font-weight:800;color:var(--amber);margin-bottom:12px}
.q-item{background:var(--surface);border-radius:12px;padding:16px;margin-bottom:8px;box-shadow:var(--sh-xs)}
.q-item .q-txt{font-size:14px;font-weight:700;margin-bottom:12px}
.q-item .q-opts{display:flex;flex-wrap:wrap;gap:8px}
.q-opt{padding:10px 16px;border:1px solid var(--border-2);border-radius:20px;background:var(--surface);font-size:14px;font-weight:600;transition:all .1s}
.q-opt.selected{background:var(--primary);border-color:var(--primary);color:#fff}
.q-opt.skip{color:var(--muted);border-style:dashed}

/* DEVIS LIGNES */
.section-label{font-size:14px;font-weight:800;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.section-label .bdg-pill{padding:2px 10px;border-radius:12px;font-size:12px}
.section-label.demande .bdg-pill{background:var(--green-bg);color:var(--green)}
.section-label.aConfirmer .bdg-pill{background:var(--amber-bg);color:var(--amber)}
.section-label.option .bdg-pill{background:var(--primary-bg);color:var(--primary)}

.lines-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lines-table table{width:100%;border-collapse:collapse}
.lines-table th{text-align:left;padding:12px 8px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);background:var(--gray-bg)}
.lines-table td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
.lines-table input{width:100%;border:1px solid transparent;background:transparent;padding:6px;border-radius:8px;font-size:14px;font-weight:600}
.lines-table input:focus{border-color:var(--primary);background:#fff}
.lines-table td.num{text-align:right;font-family:ui-monospace,monospace}
.lines-table td.motif{font-size:11px;color:var(--muted);font-style:italic;padding-top:4px}

.totaux{background:var(--gray-bg);border-radius:var(--radius);padding:20px;margin-top:20px}
.totaux .tr{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;font-weight:600}
.totaux .tr.sub{color:var(--muted)}
.totaux .tr.total{font-weight:800;font-size:22px;border-top:2px solid var(--border-2);padding-top:16px;margin-top:8px;color:var(--primary)}

.banner{padding:16px;border-radius:12px;margin-bottom:16px;font-size:14px;font-weight:600;border:1px solid;display:flex;gap:12px;align-items:center}
.banner.warn{background:var(--amber-bg);border-color:var(--amber-b);color:var(--amber)}
.banner.err{background:var(--red-bg);border-color:var(--red-b);color:var(--red)}
.banner.ok{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}

/* MODALES ET TOASTS */
#toast{position:fixed;top:20px;left:20px;right:20px;z-index:1000;background:var(--text);color:#fff;padding:16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--sh-lg);opacity:0;transform:translateY(-20px);transition:all .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}

.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px;width:100%;box-shadow:var(--sh-lg);transform:translateY(100%);transition:transform .3s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:20px;font-weight:800;margin-bottom:12px}
.modal p{color:var(--muted);font-size:15px;margin-bottom:24px;font-weight:500}
.modal-actions{display:flex;flex-direction:column;gap:12px}

.success-wrap{max-width:640px;margin:20px auto;text-align:center}
.success-check{width:80px;height:80px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:40px;font-weight:800}
.success-wrap h1{font-size:24px;font-weight:800;margin-bottom:8px}
.success-wrap p{color:var(--muted);margin-bottom:32px;font-size:15px;font-weight:500}
.empty{padding:32px 16px;text-align:center;color:var(--muted-2);font-style:italic;font-size:14px;font-weight:500}

@media (min-width:768px){
  /* Reset pour écran large */
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .hdr-nav{display:flex;gap:8px}
  .hdr-nav a{font-size:13px;font-weight:700;color:var(--muted);padding:8px 12px;border-radius:8px}
  .hdr-nav a:hover{background:var(--gray-bg);color:var(--text)}
  .hero-actions{grid-template-columns:2fr 1fr}
  .kpi-strip{grid-template-columns:repeat(4, 1fr)}
  .kpi.full-width{grid-column:span 1}
  .row-2{grid-template-columns:1fr 1fr}
  .row-3{grid-template-columns:1fr 1fr 1fr}
  .ai-input-row{flex-direction:row}
  .modal-overlay{align-items:center}
  .modal{border-radius:16px;max-width:440px;transform:translateY(20px)}
  .modal-actions{flex-direction:row;justify-content:flex-end}
  .btn{width:auto}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand" onclick="retourAccueil()">
    <div class="hdr-mark">A</div>
    <div class="hdr-text">
      <h1>ArtisanApp</h1>
      <p>Le copilote des artisans</p>
    </div>
  </div>
  <div class="hdr-right">
    <nav class="hdr-nav" id="top-nav">
      <a onclick="retourAccueil()">Tableau de bord</a>
      <a onclick="naviguer('liste-clients')">Clients</a>
      <a onclick="naviguer('liste-devis')">Devis</a>
    </nav>
    <div class="hdr-meta" id="hdr-date"></div>
  </div>
</header>

<!-- BARRE DE NAVIGATION MOBILE (BAS DE L'ECRAN) -->
<nav class="bottom-nav">
  <a onclick="retourAccueil()" id="nav-accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Accueil
  </a>
  <a onclick="naviguer('liste-clients')" id="nav-clients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    Clients
  </a>
  <a onclick="naviguer('liste-devis')" id="nav-devis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    Devis
  </a>
</nav>

<div id="toast"></div>
<div id="error-banner" onclick="this.style.display='none'"></div>
<div class="modal-overlay" id="modal-overlay"></div>
<div class="wrap" id="root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ARTISANAPP V4 — Design Mobile Premium
   ═══════════════════════════════════════════════════════════════════ */

window.addEventListener('error', function(e){
  var el = document.getElementById('error-banner');
  if (el) {
    el.textContent = 'Erreur : ' + (e.message || 'inconnue');
    el.style.display = 'block';
  }
  console.error(e);
});

/* ─── Configuration ─── */
var DEFAULT_CONFIG = { tauxHoraireInterne: 25, fraisGenerauxPct: 15, zone: 'province' };
var ZONES = {
  paris:        { label:'Paris (75)',      coeff:1.25 },
  idf:          { label:'Ile-de-France',   coeff:1.15 },
  grande_ville: { label:'Grande ville',    coeff:1.08 },
  province:     { label:'Province',        coeff:1.00 },
  rural:        { label:'Rural',           coeff:0.95 }
};
function chargerConfig() {
  try {
    var raw = localStorage.getItem('artisanapp_config');
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    var c = JSON.parse(raw);
    for (var k in DEFAULT_CONFIG) if (c[k] === undefined) c[k] = DEFAULT_CONFIG[k];
    return c;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function sauverConfig(c) { try { localStorage.setItem('artisanapp_config', JSON.stringify(c)); } catch(e) {} }
var CONFIG = chargerConfig();

/* ─── Base tarifaire ─── */
var TARIFS = { postes: {
  'elec.prise.neuve':{d:'Pose prise 16A neuve',u:'u',pu:85,partF:0.15,tempsH:0.6},

  'elec.interrupteur':{d:'Pose interrupteur / va-et-vient',u:'u',pu:75,partF:0.18,tempsH:0.5},
  'elec.cable.ml':{d:'Cable sous gaine ICTA',u:'ml',pu:14,partF:0.50,tempsH:0.08},
  'elec.disj.16A':{d:'Disjoncteur 16A fourni et pose',u:'u',pu:65,partF:0.40,tempsH:0.3},
  'elec.tableau.depose':{d:'Depose ancien tableau electrique',u:'forfait',pu:180,partF:0,tempsH:2},
  'elec.tableau.neuf':{d:'Fourniture et pose tableau electrique',u:'forfait',pu:1100,partF:0.55,tempsH:6},
  'elec.consuel':{d:'Essais et attestation Consuel',u:'forfait',pu:280,partF:0,tempsH:2},
  'elec.diagnostic':{d:'Diagnostic tableau existant',u:'forfait',pu:120,partF:0,tempsH:1.5},
  'plomb.fuite':{d:'Recherche et reparation de fuite',u:'forfait',pu:280,partF:0.15,tempsH:2},
  'plomb.robinet':{d:'Remplacement robinet',u:'u',pu:135,partF:0.35,tempsH:1},
  'plomb.chauffeEau':{d:'Fourniture et pose chauffe-eau 200L',u:'u',pu:1450,partF:0.55,tempsH:3},
  'plomb.wc':{d:'Fourniture et pose WC complet',u:'u',pu:650,partF:0.55,tempsH:2.5},
  'peint.mur.2c':{d:'Peinture murs 2 couches',u:'m2',pu:18,partF:0.25,tempsH:0.15},
  'peint.plafond.2c':{d:'Peinture plafond 2 couches',u:'m2',pu:22,partF:0.25,tempsH:0.18},
  'peint.prep.simple':{d:'Preparation simple',u:'m2',pu:6,partF:0.10,tempsH:0.08},
  'peint.prep.lourde':{d:'Preparation lourde',u:'m2',pu:18,partF:0.15,tempsH:0.25},
  'peint.protection':{d:'Protection sols et mobilier',u:'forfait',pu:80,partF:0.30,tempsH:1},

/* ─── Normalisation ─── */
function normaliser(s) {
  if (!s) return '';
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

/* ─── Métiers ─── */
var METIERS_MOTS = {
  electricite: ['electricite','prise','interrupteur','disjoncteur','tableau','cable','terre','consuel','coffret'],
  plomberie: ['plomberie','plombier','fuite','chauffe-eau','robinet','wc','toilette','evier','douche','baignoire'],
  peinture: ['peinture','peindre','repeindre','peint','plafond','enduit','sous-couche','lessivage'],
  maconnerie: ['maconnerie','mur','parpaing','agglo','brique','pierre','dalle','fondation','terrassement','chape','chainage','cloture','muret'],
  carrelage: ['carrelage','faience','plinthe','ragreage'],
  plaquiste: ['placo','plaquiste','ba13','cloison','doublage','faux plafond'],
  menuiserie: ['menuiserie','porte','fenetre','volet','placard'],
  toiture: ['toiture','toit','tuile','ardoise','couverture','charpente','gouttiere'],
  sdb: ['salle de bain','sdb','salle d eau','vasque','sanitaire'],
  cuisine: ['cuisine','plan de travail','meuble','hotte'],
  isolation: ['isolation','isolant','laine de verre'],
  terrasse: ['terrasse','lame','composite','lambourde']
};

function parserDescription(texte) {
  var raw = texte;
  var t = ' ' + normaliser(texte).replace(/,/g, '.') + ' ';
  var r = { brut:raw, metier:null, longueur:null, hauteur:null, surface:null, distanceEquipement:null, quantiteEquipement:null, materiau:null, exclusions:[], motsInclus:[], nouvelles:false, remplacement:false };
  var m;

  var reLong = /(\d+(?:\.\d+)?)\s*(?:metres?|m(?![\w])|ml|lineaire)\s*(?:de\s+long)?/gi;
  while ((m = reLong.exec(t)) !== null) {
    var v = parseFloat(m[1]);
    if (v > 0 && v < 500) {
      if (/a\s*$/.test(t.substring(Math.max(0, m.index - 8), m.index))) continue;
      if (r.longueur === null || v > r.longueur) r.longueur = v;
    }
  }

  var reH = /(?:hauteur\s*(?:de\s*)?(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:metres?|m)?\s*(?:de\s+)?(?:haut(?:eur)?))/gi;
  while ((m = reH.exec(t)) !== null) {
    var vh = parseFloat(m[1] || m[2]);
    if (vh > 0 && vh < 15) { r.hauteur = vh; break; }
  }

  var reS = /(\d+(?:\.\d+)?)\s*m\s*[²2]/gi;
  while ((m = reS.exec(t)) !== null) {
    var vs = parseFloat(m[1]);
    if (vs > 0) { r.surface = vs; break; }
  }

  var reD = /a\s*(\d+(?:\.\d+)?)\s*(metres?|m|cm)\s*(?:du|de\s+la|de\s+l|des|de)\s+(\w+)/i;
  m = reD.exec(t);
  if (m) {
    var dv = parseFloat(m[1]);
    if (m[2] === 'cm') dv /= 100;
    r.distanceEquipement = { val:dv, cible:m[3] };
  }

  var reQ = /(\d+)\s+(prises?|interrupteurs?|disjoncteurs?|spots?|radiateurs?|fenetres?|portes?|volets?|wc|toilettes?|eviers?|robinets?|luminaires?)/gi;
  m = reQ.exec(t);
  if (m) r.quantiteEquipement = { val:parseInt(m[1]), type:m[2].toLowerCase() };

  if (/\bparpaings?\b|\bagglos?\b/.test(t)) r.materiau = 'parpaing';
  else if (/\bbriques?\b/.test(t)) r.materiau = 'brique';
  else if (/\bpierres?\b/.test(t)) r.materiau = 'pierre';

  if (/\bfourni(e?s?)?\s*(et\s*)?pose/.test(t) || /\bfourniture\s+et\s+pose\b/.test(t)) r.motsInclus.push('fourniture_et_pose');
  if (/\bpose\s+seule?\b/.test(t)) r.motsInclus.push('pose_seule');

  if (/\bremplacement\b/.test(t) || /\bremplacer\b/.test(t)) r.remplacement = true;
  if (/\bneuf(ve)?s?\b/.test(t) || /\bcreation\b/.test(t)) r.nouvelles = true;

  var reEx = /\b(?:sans|hors|exclu(?:re|ant)?|pas\s+de|ne\s+pas)\s+([^.,;!?]+)/gi;
  while ((m = reEx.exec(t)) !== null) r.exclusions.push(m[1].trim());

  var scores = {};
  for (var k in METIERS_MOTS) {
    var sc = 0;
    for (var i = 0; i < METIERS_MOTS[k].length; i++) if (t.indexOf(METIERS_MOTS[k][i]) !== -1) sc += METIERS_MOTS[k][i].length;
    if (sc > 0) scores[k] = sc;
  }
  var best = null, bestSc = 0;
  for (var kk in scores) if (scores[kk] > bestSc) { bestSc = scores[kk]; best = kk; }
  r.metier = best;
  return r;
}

function genererQuestions(parsed, metier) {
  var qs = [];
  var t = normaliser(parsed.brut);

  if (!parsed.motsInclus.length) {
    qs.push({ id:'fourniture', texte:'Qui fournit les materiaux principaux ?',
      options:[{v:'fourniture_et_pose',label:'Fourniture + pose'},{v:'pose_seule',label:'Pose seule'}] });

        options:[{v:'neuf',label:'Neuves'},{v:'remplacement',label:'Remplacement'}] });

    if (parsed.quantiteEquipement || /disjoncteur|circuit/.test(t)) {

  if (metier === 'maconnerie' && /cloture|muret|mur/.test(t)) {
    qs.push({ id:'mac.fondation', texte:'Des fondations sont-elles necessaires ?',
      options:[{v:'oui',label:'Oui, a creer'},{v:'existante',label:'Existent deja'},{v:'inconnu',label:'A verifier'}] });
    qs.push({ id:'mac.finition', texte:'Finition du mur :',

    qs.push({ id:'mac.evacuation', texte:'Evacuation des gravats ?',

    qs.push({ id:'sdb.sanitaires', texte:'Les sanitaires sont :',
      options:[{v:'conserves',label:'Conserves'},{v:'remplaces',label:'Remplaces'}] });
  }
  if (metier === 'carrelage' && !/depose|existant/.test(t)) {
    qs.push({ id:'carr.depose', texte:'Deposer l ancien carrelage ?',
      options:[{v:'oui',label:'Oui'},{v:'non',label:'Non'}] });
  }
  return qs;
}

function nouvelleLigne(code, qte, motif, categorie, confiance) {
  var p = TARIFS.postes[code];
  if (!p) return null;
  var valide = (qte !== null && qte !== undefined && !isNaN(qte) && qte > 0);
  return {
    code: code, designation: p.d, quantite: valide ? Math.round(qte * 100) / 100 : null,
    unite: p.u, pu: p.pu, partF: p.partF || 0, tempsH: p.tempsH || 0,
    motif: motif, categorie: categorie,
    confiance: confiance || (valide ? 'confirme' : 'a_renseigner'),
    inclus: valide && categorie === 'demande',
    src: 'interne', dateRef: '2025-10', _manual: false
  };
}

function construireLignes(parsed, metier, reponses, lignesExistantes) {
  var manuelles = [];
  if (lignesExistantes && lignesExistantes.length) {
    lignesExistantes.forEach(function(l){ if (l._manual) manuelles.push(l); });
  }
  var lignes = [];
  var t = normaliser(parsed.brut);
  var surf = parsed.surface || (parsed.longueur && parsed.hauteur ? parsed.longueur * parsed.hauteur : null);
  var L = parsed.longueur, H = parsed.hauteur;
  var poseSeule = reponses.fourniture === 'pose_seule' || parsed.motsInclus.indexOf('pose_seule') !== -1;

  function ajouter(code, qte, motif, categorie, conf) {
    for (var i = 0; i < manuelles.length; i++) if (manuelles[i].code === code) return;
    var l = nouvelleLigne(code, qte, motif, categorie, conf);
    if (!l) return;
    if (poseSeule && l.partF > 0) {
      l.pu = Math.round((l.pu * (1 - l.partF * 0.7)) * 100) / 100;
      l.partF = 0;
    }
    lignes.push(l);
  }

  if (metier === 'electricite') {
    var qe = parsed.quantiteEquipement;
    var typeE = reponses['elec.type'] || (parsed.remplacement ? 'remplacement' : (parsed.nouvelles ? 'neuf' : null));
    if (qe && /prise/.test(qe.type)) {
      var codeP = typeE === 'remplacement' ? 'elec.prise.rempl' : 'elec.prise.neuve';
      ajouter(codeP, qe.val, 'Quantite : ' + qe.val, 'demande', 'confirme');
    } else if (/prise/.test(t) && !qe) {
      ajouter('elec.prise.neuve', null, 'Prises sans quantite', 'demande', 'a_renseigner');
    }
    if (qe && /interrupteur/.test(qe.type)) ajouter('elec.interrupteur', qe.val, 'Quantite explicite', 'demande', 'confirme');
    if (qe && /disjoncteur/.test(qe.type)) ajouter('elec.disj.16A', qe.val, 'Disjoncteurs demandes', 'demande', 'confirme');
    if (parsed.distanceEquipement) {
      var ch = reponses['elec.cheminement'];
      if (ch === 'direct' || ch === 'detour') {
        var coeff = ch === 'direct' ? 1 : 1.6;
        var ml = parsed.distanceEquipement.val * coeff * (qe ? qe.val : 1);
        ajouter('elec.cable.ml', ml, 'Distance ' + parsed.distanceEquipement.val + 'm', 'demande', 'hypothese');
      } else {
        ajouter('elec.cable.ml', null, 'Cheminement a preciser', 'a_confirmer', 'a_renseigner');
      }
    }
    var tab = reponses['elec.tableau'];
    if (tab === 'non') {
      ajouter('elec.tableau.depose', 1, 'Tableau remplace', 'demande', 'confirme');
      ajouter('elec.tableau.neuf', 1, 'Tableau remplace', 'demande', 'confirme');
      ajouter('elec.consuel', 1, 'Obligatoire', 'demande', 'confirme');
    } else if (tab === 'inconnu') {
      ajouter('elec.diagnostic', 1, 'Diagnostic necessaire', 'a_confirmer', 'hypothese');
    }
  }
  if (metier === 'plomberie') {
    if (/\bfuite/.test(t)) {
      var tf = reponses['plomb.fuite.type'];
      if (tf === 'apparente' || tf === 'encastree') ajouter('plomb.fuite', 1, 'Fuite ' + tf, 'demande', 'confirme');
      else ajouter('plomb.fuite', 1, 'Fuite a preciser', 'a_confirmer', 'a_renseigner');
    }
    if (/\brobinet/.test(t)) {
      var qr = parsed.quantiteEquipement;
      if (qr && /robinet/.test(qr.type)) ajouter('plomb.robinet', qr.val, 'Quantite explicite', 'demande', 'confirme');
      else ajouter('plomb.robinet', null, 'Nombre a preciser', 'demande', 'a_renseigner');
    }
    if (/\bwc\b|\btoilette/.test(t)) ajouter('plomb.wc', null, 'Type a preciser', 'a_confirmer', 'a_renseigner');
    if (/\bchauffe[- ]?eau/.test(t)) ajouter('plomb.chauffeEau', 1, 'Remplacement', 'demande', 'confirme');
  }
  if (metier === 'peinture') {
    if (surf === null || surf <= 0) {
      ajouter('peint.mur.2c', null, 'Surface a renseigner', 'demande', 'a_renseigner');
    } else {
      var etat = reponses['peint.etat'];
      var occupe = reponses['peint.occupation'] === 'occupe';
      if (occupe) ajouter('peint.protection', 1, 'Logement occupe', 'demande', 'confirme');
      if (etat === 'mauvais') ajouter('peint.prep.lourde', surf, 'Etat mauvais', 'demande', 'confirme');
      else if (etat === 'moyen') ajouter('peint.prep.simple', surf, 'Etat moyen', 'demande', 'confirme');
      else ajouter('peint.prep.simple', surf, 'Etat non precise', 'a_confirmer', 'hypothese');
      var cibleP = /\bplafond/.test(t);
      var cibleM = /\bmurs?\b/.test(t);
      if (cibleP) ajouter('peint.plafond.2c', surf, 'Plafond', 'demande', 'confirme');
      if (cibleM && !cibleP) ajouter('peint.mur.2c', surf, 'Murs', 'demande', 'confirme');
      if (!cibleP && !cibleM) ajouter('peint.mur.2c', surf, 'Hypothese murs', 'demande', 'hypothese');
    }
  }
  if (metier === 'maconnerie') {
    if (/cloture|muret|\bmur\b/.test(t)) {
      if (L !== null && H !== null) {
        var S = L * H;
        var codeM = 'mac.mur.parpaing.20';
        if (parsed.materiau === 'brique') codeM = 'mac.mur.brique';
        else if (parsed.materiau === 'pierre') codeM = 'mac.mur.pierre';
        ajouter(codeM, S, 'Surface = ' + L + ' x ' + H + ' = ' + S.toFixed(2) + ' m2', 'demande', 'confirme');
      } else {
        ajouter('mac.mur.parpaing.20', null, 'Dimensions a preciser', 'demande', 'a_renseigner');
      }
      var fond = reponses['mac.fondation'];
      if (fond === 'oui') ajouter('mac.fondation', L, 'Fondations', 'demande', 'confirme');
      else if (fond !== 'existante') ajouter('mac.fondation', L, 'Fondations a confirmer', 'a_confirmer', 'hypothese');
      ajouter('mac.chainage', L, 'Chainage recommande', 'option', 'hypothese');
      var fin = reponses['mac.finition'];
      if (fin === 'enduit_1' && surf) ajouter('mac.enduit.1face', surf, 'Enduit 1 face', 'demande', 'confirme');
      else if (fin === 'enduit_2' && surf) ajouter('mac.enduit.2faces', surf, 'Enduit 2 faces', 'demande', 'confirme');
      else if (!fin && surf) ajouter('mac.enduit.2faces', surf, 'Finition non precisee', 'a_confirmer', 'hypothese');
      ajouter('mac.couronnement', L, 'Couronnement recommande', 'option', 'hypothese');
      var evac = reponses['mac.evacuation'];
      if (evac === 'oui') ajouter('mac.evacuation', 1, 'Evacuation confirmee', 'demande', 'confirme');
      else if (evac !== 'non') ajouter('mac.evacuation', 1, 'Evacuation a confirmer', 'a_confirmer', 'hypothese');
    }
    if (/\bdalle\b/.test(t) && surf) ajouter('mac.dalle.beton', surf, 'Surface dalle', 'demande', 'confirme');
  }
  if (metier === 'sdb') {
    var ampl = reponses['sdb.ampleur'];
    var sanit = reponses['sdb.sanitaires'];
    var ss = parsed.surface;
    if (ss === null || ss <= 0) {
      ajouter('sdb.carrelage.sol', null, 'Surface SDB a preciser', 'demande', 'a_renseigner');
    } else {
      if (ampl === 'complete') {
        ajouter('sdb.depose.sanitaires', 1, 'Renovation complete', 'demande', 'confirme');
        ajouter('sdb.plomberie', 1, 'Renovation complete', 'demande', 'confirme');
      }
      if (ampl === 'complete' || ampl === 'partielle') ajouter('sdb.depose.carrelage', ss, 'Depose carrelage', 'demande', 'confirme');
      ajouter('sdb.etancheite', ss, 'Etancheite', 'demande', 'confirme');
      ajouter('sdb.carrelage.sol', ss, 'Carrelage sol', 'demande', 'confirme');
      ajouter('sdb.faience', Math.round(ss * 2.5 * 10) / 10, 'Faience estimee', 'demande', 'hypothese');
      ajouter('sdb.peinture.plafond', ss, 'Peinture plafond', 'demande', 'confirme');
    }
    if (sanit === 'remplaces') ajouter('sdb.sanitaires', 1, 'Sanitaires remplaces', 'demande', 'confirme');
    else if (!sanit) ajouter('sdb.sanitaires', 1, 'Sanitaires a preciser', 'a_confirmer', 'hypothese');
  }
  if (metier === 'carrelage') {
    var sc = parsed.surface;
    if (sc === null || sc <= 0) ajouter('carr.sol.pose', null, 'Surface a preciser', 'demande', 'a_renseigner');
    else {
      if (reponses['carr.depose'] === 'oui') ajouter('carr.depose', sc, 'Depose', 'demande', 'confirme');
      ajouter('carr.prep.support', sc, 'Preparation', 'demande', 'confirme');
      ajouter('carr.sol.pose', sc, 'Pose carrelage sol', 'demande', 'confirme');
    }
  }
  if (metier === 'plaquiste') {
    if (surf) {
      ajouter('placo.ossature', surf, 'Ossature', 'demande', 'confirme');
      ajouter('placo.ba13', surf, 'Plaques', 'demande', 'confirme');
      ajouter('placo.bande.enduit', surf, 'Bandes et enduit', 'demande', 'confirme');
      ajouter('placo.finition', surf, 'Finition N2', 'demande', 'confirme');
    } else ajouter('placo.ba13', null, 'Surface a preciser', 'demande', 'a_renseigner');
  }
  if (metier === 'menuiserie') {
    var qm = parsed.quantiteEquipement;
    var n = qm ? qm.val : null;
    if (/\bfenetre/.test(t)) {
      ajouter('men.depose.ouvrant', n, 'Depose', n ? 'demande' : 'a_confirmer', n ? 'confirme' : 'a_renseigner');
      ajouter('men.fenetre.alu', n, 'Fenetres alu', n ? 'demande' : 'a_confirmer', n ? 'hypothese' : 'a_renseigner');
    } else if (/\bporte/.test(t)) {
      ajouter('men.depose.ouvrant', n, 'Depose', n ? 'demande' : 'a_confirmer', n ? 'confirme' : 'a_renseigner');
      ajouter('men.porte.interieure', n, 'Portes', n ? 'demande' : 'a_confirmer', n ? 'confirme' : 'a_renseigner');
    } else if (/\bvolet/.test(t)) {
      ajouter('men.volet.roulant', n, 'Volets', n ? 'demande' : 'a_confirmer', n ? 'confirme' : 'a_renseigner');
    }
  }
  if (metier === 'toiture') {
    if (surf) {
      ajouter('toit.depose', surf, 'Depose', 'demande', 'confirme');
      if (/\bardoise/.test(t)) ajouter('toit.ardoise.pose', surf, 'Couverture ardoise', 'demande', 'confirme');
      else ajouter('toit.tuile.pose', surf, 'Couverture tuiles', 'demande', 'hypothese');
    } else ajouter('toit.tuile.pose', null, 'Surface a preciser', 'demande', 'a_renseigner');
  }
  if (metier === 'isolation' && surf) {
    if (/\bcombles/.test(t)) ajouter('iso.combles', surf, 'Combles', 'demande', 'confirme');
    else ajouter('iso.mur.interieur', surf, 'Isolation interieure', 'demande', 'hypothese');
  }
  if (metier === 'terrasse' && surf) {
    ajouter('terr.prep', surf, 'Preparation', 'demande', 'confirme');
    ajouter('terr.lambourdes', surf, 'Lambourdes', 'demande', 'confirme');
    if (/\bcomposite/.test(t)) ajouter('terr.lames.composite', surf, 'Composite', 'demande', 'confirme');
    else ajouter('terr.lames.bois', surf, 'Bois', 'demande', 'hypothese');
  }
  if (metier === 'cuisine') {
    ajouter('cuis.depose', 1, 'Depose', 'demande', 'confirme');
    ajouter('cuis.plomberie', 1, 'Plomberie a confirmer', 'a_confirmer', 'hypothese');
    ajouter('cuis.elec', 1, 'Elec a confirmer', 'a_confirmer', 'hypothese');
    ajouter('cuis.pose.meubles', 1, 'Pose meubles', 'demande', 'confirme');
  }

  manuelles.forEach(function(l){ lignes.push(l); });
  return lignes;
}

function calculerTotaux(lignes, tvaPct, zone) {
  var zoneCoeff = ZONES[zone] ? ZONES[zone].coeff : 1;
  var totalHT = 0, coutF = 0, coutMO = 0, lignesIncl = 0, lignesAvecCout = 0;

  for (var i = 0; i < lignes.length; i++) {
    var l = lignes[i];
    if (!l.inclus || l.quantite === null) continue;
    lignesIncl++;
    var tot = l.quantite * l.pu * zoneCoeff;
    totalHT += tot;
    if (l.partF > 0) coutF += tot * l.partF;
    if (l.tempsH > 0 && CONFIG.tauxHoraireInterne > 0) coutMO += l.quantite * l.tempsH * CONFIG.tauxHoraireInterne;
    if (l.partF > 0 || l.tempsH > 0) lignesAvecCout++;
    else if (l._manual) lignesAvecCout = -9999;
  }

  var fg = coutMO * (CONFIG.fraisGenerauxPct / 100);
  var coutRevient = coutF + coutMO + fg;
  var margeCalc = lignesIncl > 0 && lignesAvecCout === lignesIncl;

  totalHT = Math.round(totalHT * 100) / 100;
  var mtva = Math.round(totalHT * tvaPct / 100 * 100) / 100;
  var ttc = Math.round((totalHT + mtva) * 100) / 100;

  var margeB = null, tauxM = null;
  if (margeCalc) {
    margeB = Math.round((totalHT - coutRevient) * 100) / 100;
    tauxM = totalHT > 0 ? Math.round(margeB / totalHT * 1000) / 10 : 0;
  }
  return {
    totalHT: totalHT, montantTVA: mtva, totalTTC: ttc,
    coutFournitures: Math.round(coutF * 100) / 100,
    coutMOInterne: Math.round(coutMO * 100) / 100,
    coutRevient: Math.round(coutRevient * 100) / 100,
    margeBrute: margeB, tauxMarge: tauxM, margeCalculable: margeCalc,
    lignesIncluses: lignesIncl, zoneCoeff: zoneCoeff
  };
}

function charger() {
  try {
    var raw = localStorage.getItem('artisanapp');
    if (!raw) return { clients: [], devis: [], compteurs: { clients: 0, devis: 0 } };
    var d = JSON.parse(raw);
    if (!d.clients) d.clients = [];
    if (!d.devis) d.devis = [];
    if (!d.compteurs) d.compteurs = { clients: 0, devis: 0 };
    return d;
  } catch(e) { return { clients: [], devis: [], compteurs: { clients: 0, devis: 0 } }; }
}
function sauver(d) { try { localStorage.setItem('artisanapp', JSON.stringify(d)); } catch(e) { toast('Erreur de sauvegarde', 'err'); } }
function chargerDraft() { try { var raw = localStorage.getItem('artisanapp_draft'); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function sauverDraft() {
  try {
    if (!DEV_STATE.parsed) { localStorage.removeItem('artisanapp_draft'); return; }
    localStorage.setItem('artisanapp_draft', JSON.stringify({
      parsed: DEV_STATE.parsed, metier: DEV_STATE.metier,
      reponses: DEV_STATE.reponses, lignes: DEV_STATE.lignes,
      tva: DEV_STATE.tva, clientId: DEV_STATE.clientId, editeId: DEV_STATE.editeId
    }));
  } catch(e) {}
}
function effacerDraft() { try { localStorage.removeItem('artisanapp_draft'); } catch(e) {} }

function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function eur(n) { if (n === null || n === undefined) return '-'; return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR'; }
function dateFr(iso) { try { return new Date(iso).toLocaleDateString('fr-FR'); } catch(e) { return '-'; } }
function initiales(nom) { if (!nom) return '?'; var p = nom.split(/\s+/).filter(function(x){ return x.length; }); if (!p.length) return '?'; if (p.length === 1) return p[0].substring(0,2).toUpperCase(); return (p[0][0] + p[1][0]).toUpperCase(); }
var toastTimer = null;
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type === 'err' ? 'err' : (type === 'ok' ? 'ok' : ''));
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ''; }, 3200);
}

var MODAL_CB = null;
function confirmer(titre, message, cbOui, libelleOui) {
  MODAL_CB = cbOui;
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = '<div class="modal"><h3>' + esc(titre) + '</h3><p>' + esc(message) + '</p><div class="modal-actions"><button class="btn btn-danger" onclick="validerModal()">' + esc(libelleOui || 'Confirmer') + '</button><button class="btn btn-ghost" onclick="fermerModal()">Annuler</button></div></div>';
  overlay.classList.add('show');
}
function fermerModal() { document.getElementById('modal-overlay').classList.remove('show'); MODAL_CB = null; }
function validerModal() { var cb = MODAL_CB; fermerModal(); if (cb) cb(); }

var NAV_STACK = [];
var NAV_LOCK = false;
function naviguer(ecran, params, remplacer) {
  params = params || {};
  if (remplacer && NAV_STACK.length) NAV_STACK[NAV_STACK.length - 1] = { ecran: ecran, params: params };
  else NAV_STACK.push({ ecran: ecran, params: params });
  try { history.pushState({ idx: NAV_STACK.length - 1 }, '', '#' + ecran); } catch(e) {}
  rendreEcran();
}
function retour() { if (NAV_STACK.length > 1) { NAV_STACK.pop(); rendreEcran(); } else retourAccueil(); }
function retourAccueil() {
  NAV_STACK = [{ ecran: 'accueil', params: {} }];
  try { history.replaceState({ idx: 0 }, '', '#accueil'); } catch(e) {}
  rendreEcran();
}
window.addEventListener('popstate', function() { if (NAV_STACK.length > 1) { NAV_STACK.pop(); rendreEcran(); } });

function updateNavBar(active) {
  document.getElementById('nav-accueil').classList.remove('active');
  document.getElementById('nav-clients').classList.remove('active');
  document.getElementById('nav-devis').classList.remove('active');
  if(document.getElementById('nav-' + active)) {
    document.getElementById('nav-' + active).classList.add('active');
  }
}

function rendreEcran() {
  var current = NAV_STACK[NAV_STACK.length - 1];
  if (!current) { NAV_STACK = [{ ecran: 'accueil', params: {} }]; current = NAV_STACK[0]; }
  var root = document.getElementById('root');
  var html = '';
  try {
    switch (current.ecran) {
      case 'accueil':        html = ecranAccueil(); updateNavBar('accueil'); break;
      case 'nouveau-client': html = ecranNouveauClient(); updateNavBar('clients'); break;
      case 'client-cree':    html = ecranClientCree(current.params.clientId); updateNavBar('clients'); break;
      case 'client-edit':    html = ecranClientEdit(current.params.clientId); updateNavBar('clients'); break;
      case 'fiche-client':   html = ecranFicheClient(current.params.clientId); updateNavBar('clients'); break;
      case 'liste-clients':  html = ecranListeClients(current.params.filtre || ''); updateNavBar('clients'); break;
      case 'liste-devis':    html = ecranListeDevis(current.params.filtre || ''); updateNavBar('devis'); break;
      case 'devis-detail':   html = ecranDevisDetail(current.params.devisId); updateNavBar('devis'); break;
      case 'nouveau-devis':  html = ecranNouveauDevis(current.params.clientId); updateNavBar('devis'); break;
      case 'devis-edit':     html = ecranDevisEdit(current.params.devisId); updateNavBar('devis'); break;
      default:               html = ecranAccueil(); updateNavBar('accueil');
    }
  } catch(e) {
    console.error(e);
    html = '<div class="banner err">Erreur : ' + esc(e.message) + '</div>' +
           '<div class="card"><button class="btn" onclick="retourAccueil()">Retour a l accueil</button></div>';
  }
  root.innerHTML = html;
  window.scrollTo(0, 0);
  setTimeout(function(){ var e = root.querySelector('[autofocus]'); if (e) e.focus(); }, 50);
}

function boutonRetour(texte) {
  if (NAV_STACK.length <= 1) return '';
  return '<button class="back-btn" onclick="retour()">← ' + esc(texte || 'Retour') + '</button>';
}

/* ─── ACCUEIL ─── */
function ecranAccueil() {
  var data = charger();
  var devis = data.devis;
  var clients = data.clients;
  var parStatut = { brouillon: {n:0,m:0}, 'envoye': {n:0,m:0}, 'accepte': {n:0,m:0}, 'refuse': {n:0,m:0} };
  var caAccepte = 0, caEnAttente = 0;
  devis.forEach(function(d){
    var s = d.statut || 'brouillon';
    var key = s === 'envoye' ? 'envoye' : (s === 'accepte' ? 'accepte' : (s === 'refuse' ? 'refuse' : 'brouillon'));
    if (!parStatut[key]) parStatut[key] = { n:0, m:0 };
    parStatut[key].n++;
    parStatut[key].m += d.totalTTC || 0;
    if (s === 'accepte') caAccepte += d.totalTTC || 0;
    if (s === 'envoye') caEnAttente += d.totalTTC || 0;
  });

  var recent = clients.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); }).slice(0, 3);
  var recentD = devis.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); }).slice(0, 3);
  var draft = chargerDraft();

  var html = '';

  if (draft && draft.parsed) {
    html += '<div class="banner warn">' +
      '<div style="flex:1"><strong>Devis en cours de saisie</strong><br>' +
      esc((draft.parsed.brut || '').substring(0, 50)) + (draft.parsed.brut && draft.parsed.brut.length > 50 ? '...' : '') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">' +
      '<button class="btn btn-sm" onclick="reprendreDraft()">Reprendre</button>' +
      '<button class="btn btn-sm btn-ghost" onclick="abandonnerDraft()">Effacer</button>' +
      '</div></div>';
  }

  html += '<div class="hero-actions">';
  html += '<button class="btn-hero" onclick="naviguer(\'nouveau-client\')"><div class="hi">+</div><div><h3>Nouveau client</h3><p>Saisir une fiche rapide</p></div></button>';
  html += '<button class="btn-hero-2" onclick="naviguer(\'nouveau-devis\')"><div class="hi">D</div><div><h3>Nouveau devis</h3><p>Chiffrer avec le copilote</p></div></button>';
  html += '</div>';

  html += '<div class="kpi-strip">';
  html += '<div class="kpi" onclick="naviguer(\'liste-clients\')"><div class="lbl">Clients</div><div class="val">' + clients.length + '</div></div>';
  html += '<div class="kpi" onclick="naviguer(\'liste-devis\')"><div class="lbl">Devis</div><div class="val">' + devis.length + '</div></div>';
  html += '<div class="kpi full-width" onclick="naviguer(\'liste-devis\')"><div class="lbl">CA Accepté</div><div class="val pos">' + eur(caAccepte) + '</div><div class="sub">' + parStatut.accepte.n + ' devis validés</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-head"><div><div class="card-title">Derniers clients</div></div><button class="btn btn-ghost btn-sm" onclick="naviguer(\'liste-clients\')">Tout voir</button></div>';
  if (!recent.length) html += '<div class="empty">Aucun client enregistre.</div>';
  else {
    html += '<div style="margin:-20px;margin-top:0">';
    recent.forEach(function(c){
      html += '<div class="list-row" onclick="naviguer(\'fiche-client\', {clientId:\'' + c.id + '\'})">';
      html += '<div class="list-avatar">' + initiales(c.nom) + '</div>';
      html += '<div class="list-body"><div class="list-title">' + esc(c.nom) + '</div><div class="list-sub">' + esc(c.ville || '') + '</div></div>';
      html += '<div class="list-row-chev">›</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-head"><div><div class="card-title">Sauvegarde (Sécurité)</div><div class="card-sub">Exportez vos données pour les transférer sur un autre appareil</div></div></div>';
  html += '<div class="row-2">';
  html += '<button class="btn btn-ghost" onclick="exporterDonnees()">⬇️ Exporter (JSON)</button>';
  html += '<button class="btn btn-ghost" onclick="importerDonnees()">⬆️ Importer un fichier</button>';
  html += '</div></div>';

  return html;
}

function reprendreDraft() {
  var draft = chargerDraft();
  if (!draft || !draft.parsed) { toast('Aucun brouillon', 'err'); return; }
  if (draft.editeId) { naviguer('devis-edit', { devisId: draft.editeId }); return; }
  DEV_STATE = { parsed: draft.parsed, metier: draft.metier, reponses: draft.reponses || {}, lignes: draft.lignes || [], tva: draft.tva || 20, clientId: draft.clientId || null, editeId: null };
  naviguer('nouveau-devis', { clientId: draft.clientId });
}
function abandonnerDraft() {
  confirmer('Abandonner le brouillon ?', 'Les informations saisies seront perdues.', function() {
    effacerDraft(); toast('Brouillon efface', 'ok'); rendreEcran();
  }, 'Abandonner');
}

function exporterDonnees() {
  var data = charger();
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = "artisanapp-sauvegarde-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée !', 'ok');
}

function importerDonnees() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.clients || !data.devis) throw new Error("Format invalide");
        confirmer('Importer les données ?', 'Cela remplacera vos données actuelles.', function() {
          sauver(data);
          toast('Import réussi !', 'ok');
          rendreEcran();
        }, 'Importer');
      } catch(err) { toast('Fichier invalide', 'err'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function enregistrerClient() {
  if (NAV_LOCK) return;
  NAV_LOCK = true;
  var btn = document.getElementById('c-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement...'; }

  var nom = (document.getElementById('c-nom').value || '').trim();
  var ville = (document.getElementById('c-ville').value || '').trim();
  if (!nom) { toast('Nom obligatoire', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; } return; }
  if (!ville) { toast('Ville obligatoire', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; } return; }

  try {
    var data = charger();
    var doublon = null;
    for (var i = 0; i < data.clients.length; i++) {
      if (normaliser(data.clients[i].nom) === normaliser(nom) && normaliser(data.clients[i].ville) === normaliser(ville)) {
        doublon = data.clients[i]; break;
      }
    }
    if (doublon) {
      NAV_LOCK = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; }
      confirmer('Client deja existant', 'Un client avec le meme nom et la meme ville existe : ' + doublon.nom + '.', function() {
        naviguer('fiche-client', { clientId: doublon.id }, true);
      }, 'Ouvrir la fiche');
      return;
    }
    data.compteurs.clients = (data.compteurs.clients || 0) + 1;
    var annee = new Date().getFullYear();
    var id = 'C-' + annee + '-' + String(data.compteurs.clients).padStart(4, '0');
    data.clients.push({
      id: id, nom: nom, ville: ville,
      codePostal: (document.getElementById('c-cp').value || '').trim(),
      tel: (document.getElementById('c-tel').value || '').trim(),
      email: (document.getElementById('c-email').value || '').trim(),
      adresse: (document.getElementById('c-adresse').value || '').trim(),
      dateCreation: new Date().toISOString()
    });
    sauver(data);
    toast('Client ' + id + ' cree', 'ok');
    NAV_STACK[NAV_STACK.length - 1] = { ecran: 'client-cree', params: { clientId: id } };
    rendreEcran();
  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; }
  } finally { NAV_LOCK = false; }
}

function ecranClientCree(clientId) {
  var data = charger();
  var c = null;
  for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === clientId) c = data.clients[i];
  if (!c) return '<div class="empty">Client introuvable.</div>';
  return '<div class="success-wrap">' +
    '<div class="success-check">✓</div>' +
    '<h1>Client enregistre</h1>' +
    '<p>' + esc(c.nom) + ' - ' + esc(c.id) + '</p>' +
    '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<button class="btn" onclick="naviguer(\'nouveau-devis\', {clientId:\'' + c.id + '\'})">Créer un devis maintenant</button>' +
    '<button class="btn btn-ghost" onclick="naviguer(\'fiche-client\', {clientId:\'' + c.id + '\'})">Voir sa fiche</button>' +
    '<button class="btn btn-ghost" onclick="retourAccueil()">Retour au tableau de bord</button>' +
    '</div></div>';
}

/* ─── LISTE CLIENTS ─── */
function ecranListeClients(filtre) {
  var data = charger();
  var clients = data.clients.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); });
  var f = normaliser(filtre);
  var filtered = f ? clients.filter(function(c){ return normaliser(c.nom + ' ' + c.ville + ' ' + (c.tel||'') + ' ' + (c.email||'')).indexOf(f) !== -1; }) : clients;

function sauverClientEdit(clientId) {
  if (NAV_LOCK) return;
  NAV_LOCK = true;
  var btn = document.getElementById('ce-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement...'; }
  var nom = (document.getElementById('ce-nom').value || '').trim();
  var ville = (document.getElementById('ce-ville').value || '').trim();
  if (!nom || !ville) {
    toast('Nom et ville obligatoires', 'err');
    NAV_LOCK = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer les modifications'; }
    return;
  }
  try {
    var data = charger();
    for (var i = 0; i < data.clients.length; i++) {
      if (data.clients[i].id === clientId) {
        data.clients[i].nom = nom;
        data.clients[i].ville = ville;
        data.clients[i].codePostal = (document.getElementById('ce-cp').value || '').trim();
        data.clients[i].tel = (document.getElementById('ce-tel').value || '').trim();
        data.clients[i].email = (document.getElementById('ce-email').value || '').trim();
        data.clients[i].adresse = (document.getElementById('ce-adresse').value || '').trim();
        break;
      }
    }
    for (var j = 0; j < data.devis.length; j++) if (data.devis[j].clientId === clientId) data.devis[j].clientNom = nom;
    sauver(data);
    toast('Client modifie', 'ok');
    retour();
  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer les modifications'; }
  } finally { NAV_LOCK = false; }
}

function changerStatutDevis(devisId) {

  if (!Array.isArray(d.historiqueStatut)) d.historiqueStatut = [];
  d.historiqueStatut.push({ ancien: ancien, nouveau: nouveau, date: new Date().toISOString() });
  sauver(data);
  toast('Statut : ' + ancien + ' vers ' + nouveau, 'ok');
  rendreEcran();
}

/* ─── DEVIS — NOUVEAU / EDIT ─── */
var DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId:null, editeId:null };

function ecranNouveauDevis(clientId) {
  var draft = chargerDraft();
  if (draft && draft.parsed && draft.clientId === clientId && !draft.editeId) {
    DEV_STATE = { parsed: draft.parsed, metier: draft.metier, reponses: draft.reponses || {}, lignes: draft.lignes || [], tva: draft.tva || 20, clientId: draft.clientId || null, editeId: null };
  } else {
    DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId: clientId || null, editeId:null };
  }
  return renderNouveauDevis();
}

function ecranDevisEdit(devisId) {
  var data = charger();
  var d = null;
  for (var i = 0; i < data.devis.length; i++) if (data.devis[i].id === devisId) d = data.devis[i];
  if (!d) return '<div class="empty">Devis introuvable.</div>';
  DEV_STATE = {
    parsed: { brut: d.description || '', metier: d.metier },
    metier: d.metier || d.domaine,
    reponses: {},
    lignes: (Array.isArray(d.lignes) ? d.lignes : []).map(function(l){
      return {
        code: 'manual.' + l.designation, designation: l.designation, quantite: l.quantite, unite: l.unite, pu: l.prixUnitaireHT,
        partF: 0, tempsH: 0, motif: l.motif || 'Ligne importee', categorie: l.categorie || (l.inclus ? 'demande' : 'option'),
        confiance: l.confiance || (l.quantite !== null ? 'confirme' : 'a_renseigner'), inclus: l.inclus, src: 'Import', _manual: true
      };
    }),
    tva: d.tauxTVA || 20, clientId: d.clientId, editeId: d.id
  };
  return renderNouveauDevis();
}

function renderNouveauDevis() {
  var data = charger();
  var html = boutonRetour('Retour');
  html += '<div class="card">';
  html += '<div class="card-head"><div><div class="card-title">' + (DEV_STATE.editeId ? 'Modifier le devis' : 'Nouveau devis') + '</div></div></div>';
  html += '<div class="field"><label>Client <span class="req">*</span></label><select class="inp" id="d-client"><option value="">- Selectionner -</option>';
  data.clients.forEach(function(c){
    var sel = DEV_STATE.clientId && DEV_STATE.clientId === c.id ? ' selected' : '';
    html += '<option value="' + esc(c.id) + '"' + sel + '>' + esc(c.nom) + '</option>';
  });
  html += '</select></div>';
  html += '<div class="ai-section"><div class="ai-head"><div class="ai-icon">IA</div><div class="ai-head-txt"><h2>Décrivez les travaux</h2><p>Le copilote pose les questions manquantes.</p></div></div>';
  html += '<div class="ai-input-row"><input class="inp" id="ia-texte" placeholder="Ex : mur de cloture 17m x 1.5m" value="' + esc(DEV_STATE.parsed ? DEV_STATE.parsed.brut : '') + '"><button class="btn" onclick="analyserDevis()">Analyser</button></div>';
  html += '<div id="analyse-result"></div></div>';
  html += '<div id="devis-suite"></div></div>';
  setTimeout(function(){ renderDevisSuite(); }, 0);
  return html;
}

function analyserDevis() {
  var txt = (document.getElementById('ia-texte').value || '').trim();
  if (!txt) { toast('Decrivez les travaux', 'err'); return; }
  var p = parserDescription(txt);
  if (!p.metier) { toast('Metier non reconnu.', 'err'); return; }
  var manuelles = (DEV_STATE.lignes || []).filter(function(l){ return l._manual; });
  DEV_STATE.parsed = p;
  DEV_STATE.metier = p.metier;
  DEV_STATE.reponses = {};
  DEV_STATE.lignes = construireLignes(p, p.metier, {}, manuelles);
  sauverDraft();
  renderDevisSuite();
}

function renderDevisSuite() {
  var p = DEV_STATE.parsed;
  if (!p) return;
  var ar = document.getElementById('analyse-result');
  if (ar) {
    var ah = '<div class="analyse-box">';
    ah += '<div class="analyse-section"><h4>Metier detecte</h4><div style="display:inline-block;background:var(--primary-bg);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700">' + esc(p.metier || DEV_STATE.metier) + '</div></div>';
    var faits = [];
    if (p.quantiteEquipement) faits.push({t:'fact', l:'Quantite', v:p.quantiteEquipement.val + ' ' + p.quantiteEquipement.type});
    if (p.longueur) faits.push({t:'fact', l:'Longueur', v:p.longueur + ' m'});
    if (p.hauteur) faits.push({t:'fact', l:'Hauteur', v:p.hauteur + ' m'});
    if (p.surface) faits.push({t:'fact', l:'Surface', v:p.surface + ' m2'});
    if (p.materiau) faits.push({t:'fact', l:'Materiau', v:p.materiau});
    if (faits.length) {
      ah += '<div class="analyse-section" style="margin-top:12px"><h4>Faits extraits</h4>';
      faits.forEach(function(f){
        ah += '<div class="analyse-fact"><div class="dot ' + f.t + '"></div><div><span class="lbl">' + esc(f.l) + ' :</span> <span class="v">' + esc(f.v) + '</span></div></div>';
      });
      ah += '</div>';
    }
    ah += '</div>';
    ar.innerHTML = ah;
  }
  var suite = document.getElementById('devis-suite');
  if (suite) suite.innerHTML = renderQuestionsBloc() + renderLignesBloc();
}

function renderQuestionsBloc() {
  if (!DEV_STATE.parsed || !DEV_STATE.metier) return '';
  var qs = genererQuestions(DEV_STATE.parsed, DEV_STATE.metier);
  if (!qs.length) return '';
  var html = '<div class="q-box"><h3>' + qs.length + ' question(s) pour affiner</h3>';
  qs.forEach(function(q){
    html += '<div class="q-item"><div class="q-txt">' + esc(q.texte) + '</div><div class="q-opts">';
    q.options.forEach(function(o){
      var sel = DEV_STATE.reponses[q.id] === o.v ? ' selected' : '';
      html += '<button class="q-opt' + sel + '" onclick="repondreDevis(\'' + q.id + '\',\'' + o.v + '\')">' + esc(o.label) + '</button>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function repondreDevis(qid, val) {
  DEV_STATE.reponses[qid] = val;
  var manuelles = (DEV_STATE.lignes || []).filter(function(l){ return l._manual; });
  DEV_STATE.lignes = construireLignes(DEV_STATE.parsed, DEV_STATE.metier, DEV_STATE.reponses, manuelles);
  sauverDraft();
  renderDevisSuite();
}

function renderLignesBloc() {
  var L = DEV_STATE.lignes || [];
  if (!L.length) return '';
  var dem = L.filter(function(l){ return l.categorie === 'demande'; });
  var aCf = L.filter(function(l){ return l.categorie === 'a_confirmer'; });
  var opt = L.filter(function(l){ return l.categorie === 'option'; });

  function tbl(lignes, classe, avecValid, avecRetrait) {
    var t = '<div class="lines-table"><table><thead><tr><th>Designation</th><th class="num" style="width:70px">Qte</th><th class="num" style="width:90px">Total</th><th style="width:80px"></th></tr></thead><tbody>';
    lignes.forEach(function(l){
      var idx = L.indexOf(l);
      var qteInput = '<input type="number" step="0.01" value="' + (l.quantite !== null ? l.quantite : '') + '" placeholder="0" oninput="majLigneDevis(' + idx + ',\'quantite\',this.value)" style="text-align:right">';
      t += '<tr><td><div style="font-weight:700">' + esc(l.designation) + '</div><div class="motif">' + esc(l.unite) + '</div></td>';
      t += '<td class="num">' + qteInput + '</td>';
      t += '<td class="num" style="font-weight:700">' + (l.quantite !== null ? eur(l.quantite * l.pu) : '-') + '</td>';
      t += '<td>';
      if (avecValid || (l._manual && !l.inclus)) t += '<button class="btn btn-sm" onclick="validerLigneDevis(' + idx + ')" style="padding:4px 8px;font-size:11px">Valider</button>';
      if (avecRetrait) t += '<button class="btn btn-ghost btn-sm" onclick="rejeterLigneDevis(' + idx + ')" style="padding:4px 8px;font-size:11px">X</button>';
      t += '</td></tr>';
    });
    t += '</tbody></table></div>';
    return t;
  }

  var html = '';
  if (dem.length) {
    html += '<div class="section-label demande">Prestations <span class="bdg-pill">' + dem.length + '</span></div>';
    html += tbl(dem, 'demande', false, false);
  }
  if (aCf.length) {
    html += '<div class="section-label aConfirmer">A confirmer <span class="bdg-pill">' + aCf.length + '</span></div>';
    html += tbl(aCf, 'aConfirmer', true, true);
  }
  if (opt.length) {
    html += '<div class="section-label option">Options <span class="bdg-pill">' + opt.length + '</span></div>';
    html += tbl(opt, 'option', true, true);
  }

  var tot = calculerTotaux(L, DEV_STATE.tva, CONFIG.zone);
  html += '<div class="totaux">';
  html += '<div class="tr"><span>Total HT</span><span class="v">' + eur(tot.totalHT) + '</span></div>';
  html += '<div class="tr sub"><span>TVA ' + DEV_STATE.tva + ' %</span><span class="v">' + eur(tot.montantTVA) + '</span></div>';
  html += '<div class="tr total"><span>Total TTC</span><span class="v">' + eur(tot.totalTTC) + '</span></div>';
  html += '</div>';

  html += '<div class="field" style="margin-top:16px"><label>TVA</label><select class="inp" onchange="DEV_STATE.tva=parseFloat(this.value);sauverDraft();renderDevisSuite()">';
  [20, 10, 5.5, 0].forEach(function(t){
    html += '<option value="' + t + '"' + (DEV_STATE.tva === t ? ' selected' : '') + '>' + t + ' %</option>';
  });
  html += '</select></div>';

  var statut = evaluerStatutDevis();
  if (statut.bloque) html += '<div class="banner warn" style="margin-top:16px">' + statut.bloque + '</div>';

  var label = DEV_STATE.editeId ? 'Mettre a jour' : 'Enregistrer le devis';
  html += '<div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">';
  html += '<button class="btn" id="submit-devis" onclick="enregistrerDevis()" ' + (statut.bloque ? 'disabled' : '') + '>' + label + '</button>';
  html += '<button class="btn btn-ghost" onclick="annulerDevis()">Annuler</button>';
  html += '</div>';
  return html;
}

function evaluerStatutDevis() {
  if (!DEV_STATE.lignes.length) return { bloque: 'Aucune prestation.' };
  var clientId = document.getElementById('d-client') ? document.getElementById('d-client').value : '';
  var incluses = DEV_STATE.lignes.filter(function(l){ return l.inclus; });
  var demNull = DEV_STATE.lignes.filter(function(l){ return l.categorie === 'demande' && l.quantite === null; });
  var bloqueurs = [];
  if (!clientId) bloqueurs.push('Selectionnez un client.');
  if (!incluses.length) bloqueurs.push('Aucune quantite renseignee.');
  if (demNull.length) bloqueurs.push(demNull.length + ' quantite(s) manquante(s).');
  if (bloqueurs.length) return { bloque: bloqueurs.join(' ') };
  return { bloque: null };
}

function majLigneDevis(i, champ, val) {
  var l = DEV_STATE.lignes[i];
  if (!l) return;
  if (champ === 'quantite') {
    var q = parseFloat(val);
    l.quantite = (isNaN(q) || q < 0) ? null : q;
    l.inclus = l.quantite !== null && l.quantite > 0 && l.categorie === 'demande';
    if (l.quantite !== null && l.quantite > 0) l.confiance = 'confirme'; else l.confiance = 'a_renseigner';
    l._manual = true;
  }
  sauverDraft();
  renderDevisSuite();
}

function validerLigneDevis(i) {
  var l = DEV_STATE.lignes[i];
  if (!l) return;
  if (l.quantite === null || l.quantite <= 0) { toast('Renseignez une quantite', 'err'); return; }
  l.categorie = 'demande'; l.confiance = 'confirme'; l.inclus = true;
  sauverDraft(); renderDevisSuite();
}
function rejeterLigneDevis(i) {
  var l = DEV_STATE.lignes[i];
  if (!l) return;
  l.inclus = false; l.categorie = 'option'; l.confiance = 'hypothese';
  sauverDraft(); renderDevisSuite();
}

function annulerDevis() {
  if (DEV_STATE.editeId) {
    var idEdit = DEV_STATE.editeId;
    DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId:null, editeId:null };
    effacerDraft();
    naviguer('devis-detail', { devisId: idEdit }, true);
  } else {
    confirmer('Annuler ce devis ?', 'Les informations saisies seront perdues.', function() {
      DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId:null, editeId:null };
      effacerDraft();
      retour();
    }, 'Annuler le devis');
  }
}

function enregistrerDevis() {
  if (NAV_LOCK) return;
  NAV_LOCK = true;
  var btn = document.getElementById('submit-devis');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement...'; }

  try {
    var clientId = document.getElementById('d-client').value;
    if (!clientId) { toast('Selectionnez un client', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer'; } return; }
    var statut = evaluerStatutDevis();
    if (statut.bloque) { toast('Incomplet', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer'; } return; }

    var data = charger();
    var client = null;
    for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === clientId) client = data.clients[i];
    var tot = calculerTotaux(DEV_STATE.lignes, DEV_STATE.tva, CONFIG.zone);
    var lignesSerial = DEV_STATE.lignes.map(function(l){
      return {
        designation: l.designation, quantite: l.quantite, unite: l.unite,
        prixUnitaireHT: l.pu, totalHT: l.quantite !== null ? l.quantite * l.pu : null,
        motif: l.motif, confiance: l.confiance, categorie: l.categorie, inclus: l.inclus, src: l.src
      };
    });

    if (DEV_STATE.editeId) {
      for (var j = 0; j < data.devis.length; j++) {
        if (data.devis[j].id === DEV_STATE.editeId) {
          data.devis[j].clientId = clientId;
          data.devis[j].clientNom = client ? client.nom : '';
          data.devis[j].domaine = DEV_STATE.parsed.metier || 'divers';
          data.devis[j].description = DEV_STATE.parsed.brut;
          data.devis[j].lignes = lignesSerial;
          data.devis[j].totalHT = tot.totalHT;
          data.devis[j].tauxTVA = DEV_STATE.tva;
          data.devis[j].montantTVA = tot.montantTVA;
          data.devis[j].totalTTC = tot.totalTTC;
          break;
        }
      }
      sauver(data);
      effacerDraft();
      toast('Devis mis a jour', 'ok');
      var idEdit = DEV_STATE.editeId;
      DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId:null, editeId:null };
      naviguer('devis-detail', { devisId: idEdit }, true);
    } else {
      data.compteurs.devis = (data.compteurs.devis || 0) + 1;
      var annee = new Date().getFullYear();
      var id = 'DEV-' + annee + '-' + String(data.compteurs.devis).padStart(4, '0');
      data.devis.push({
        id: id, clientId: clientId, clientNom: client ? client.nom : '',
        domaine: DEV_STATE.parsed.metier || 'divers', description: DEV_STATE.parsed.brut,
        lignes: lignesSerial, totalHT: tot.totalHT, tauxTVA: DEV_STATE.tva,
        montantTVA: tot.montantTVA, totalTTC: tot.totalTTC, statut: 'brouillon', dateCreation: new Date().toISOString()
      });
      sauver(data);
      effacerDraft();
      toast('Devis enregistre !', 'ok');
      DEV_STATE = { parsed:null, metier:null, reponses:{}, lignes:[], tva:20, clientId:null, editeId:null };
      naviguer('devis-detail', { devisId: id }, true);
    }
  } catch(e) {
    toast('Erreur', 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer'; }
  } finally { NAV_LOCK = false; }
}

/* ─── Init ─── */
(function(){
  var d = document.getElementById('hdr-date');
  if (d) d.textContent = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
  NAV_STACK = [{ ecran:'accueil', params:{} }];
  try { history.replaceState({ idx:0 }, '', '#accueil'); } catch(e) {}
  rendreEcran();
})();
</script>
