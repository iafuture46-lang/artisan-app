<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F172A">
<title>ArtisanApp</title>
<style>
/* ... (Le CSS est strictement identique à celui que tu viens de copier juste au-dessus, je le remets pour que tu puisses tout copier d'un coup) ... */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --border:#E2E8F0; --border-2:#CBD5E1;
  --text:#0F172A; --muted:#64748B; --muted-2:#94A3B8;
  --primary:#2563EB; --primary-h:#1D4ED8; --primary-bg:#EFF6FF;
  --green:#059669; --green-bg:#ECFDF5;
  --amber:#D97706; --amber-bg:#FFFBEB;
  --red:#DC2626; --red-bg:#FEF2F2;
  --sh-sm:0 2px 4px rgba(15,23,42,.04);
  --sh-md:0 8px 16px -4px rgba(15,23,42,.08);
  --sh-lg:0 20px 32px -8px rgba(15,23,42,.12);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:100px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none;cursor:pointer}

.hdr{background:var(--surface);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.hdr-brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.hdr-mark{width:44px;height:44px;background:linear-gradient(135deg, var(--primary), #3B82F6);color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.hdr-text h1{font-size:18px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.hdr-text p{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.hdr-nav{display:none}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0 24px 0;z-index:100;box-shadow:0 -10px 30px rgba(0,0,0,0.05)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 16px;border-radius:16px;transition:all .2s}
.bottom-nav a.active{color:var(--primary);background:var(--primary-bg)}
.bottom-nav svg{width:24px;height:24px;stroke-width:2.5}

.fab{position:fixed;bottom:90px;right:20px;width:64px;height:64px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:300;box-shadow:0 12px 24px rgba(37,99,235,.4);z-index:99;transition:transform .2s}
.fab:active{transform:scale(.9)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 40px}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--sh-md)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.card-title{font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.card-sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}

.hero-actions{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:24px}
.btn-hero{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg, var(--primary), #3B82F6);color:#fff;padding:24px;border-radius:24px;text-align:left;box-shadow:0 12px 24px rgba(37,99,235,.25);transition:transform .1s}
.btn-hero:active{transform:scale(.98)}
.btn-hero .hi{width:52px;height:52px;background:rgba(255,255,255,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.btn-hero h3{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.btn-hero p{font-size:13px;opacity:.9;font-weight:500}
.btn-hero-2{display:flex;align-items:center;gap:20px;background:var(--surface);color:var(--text);border:2px solid var(--border);padding:24px;border-radius:24px;text-align:left;box-shadow:var(--sh-sm);transition:all .2s}
.btn-hero-2:active{background:var(--surface-2)}
.btn-hero-2 .hi{width:52px;height:52px;background:var(--primary-bg);color:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.btn-hero-2 h3{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.btn-hero-2 p{font-size:13px;color:var(--muted);font-weight:500}

.kpi-strip{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.kpi{background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--sh-sm);border:1px solid var(--border)}
.kpi.full-width{grid-column:span 2;background:linear-gradient(to right, var(--surface), #F8FAFC)}
.kpi .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.kpi .val{font-size:26px;font-weight:900;letter-spacing:-1px}
.kpi .val.pos{color:var(--green)}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}

.field{margin-bottom:20px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:var(--text)}
.field .req{color:var(--red);margin-left:2px}
.inp{width:100%;padding:16px;font-size:16px;background:var(--surface-2);border:2px solid transparent;border-radius:16px;transition:all .2s;outline:none;font-weight:600;color:var(--text)}
.inp:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-bg)}
textarea.inp{resize:vertical;min-height:100px}
.row-2,.row-3{display:grid;grid-template-columns:1fr;gap:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 24px;border-radius:16px;font-size:16px;font-weight:700;background:var(--primary);color:#fff;transition:all .2s;width:100%;box-shadow:0 4px 12px rgba(37,99,235,.2)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--surface-2);color:var(--muted-2);box-shadow:none;transform:none}
.btn-ghost{background:var(--surface);color:var(--text);border:2px solid var(--border);box-shadow:none}
.btn-sm{padding:10px 16px;font-size:14px;width:auto;border-radius:12px}
.btn-danger{background:var(--red);box-shadow:0 4px 12px rgba(220,38,38,.2)}
.back-btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:20px;padding:10px 16px;background:var(--surface);border-radius:12px;border:1px solid var(--border);box-shadow:var(--sh-sm)}

.list-row{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.list-row:last-child{border-bottom:none}
.list-row:active{background:var(--surface-2)}
.list-avatar{width:48px;height:48px;border-radius:16px;flex-shrink:0;background:linear-gradient(135deg, var(--primary), #3B82F6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 4px 8px rgba(37,99,235,.2)}
.list-body{flex:1;min-width:0}
.list-title{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:2px;color:var(--text)}
.list-sub{font-size:13px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-right{font-size:16px;font-weight:900;text-align:right;flex-shrink:0;letter-spacing:-.5px}
.list-right .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.list-row-chev{color:var(--muted-2);font-size:20px;font-weight:300}

.ai-section{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--sh-md);border:1px solid var(--primary-bg)}
.ai-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.ai-icon{width:48px;height:48px;background:linear-gradient(135deg, var(--primary), #3B82F6);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.ai-head-txt h2{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.ai-head-txt p{font-size:13px;color:var(--muted);font-weight:500}
.ai-input-row{display:flex;flex-direction:column;gap:12px}

.analyse-box{background:var(--surface-2);border-radius:16px;padding:20px;margin-top:16px;border:1px solid var(--border)}
.analyse-section{margin-bottom:16px}
.analyse-section:last-child{margin-bottom:0}
.analyse-section h4{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:10px;letter-spacing:.05em}
.analyse-fact{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:14px}
.analyse-fact .v{font-weight:800;color:var(--text)}

.q-box{background:var(--amber-bg);border:1px solid #FCD34D;border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--sh-sm)}
.q-box h3{font-size:15px;font-weight:800;color:var(--amber);margin-bottom:16px}
.q-item{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.q-item .q-txt{font-size:15px;font-weight:800;margin-bottom:16px;color:var(--text)}
.q-item .q-opts{display:flex;flex-wrap:wrap;gap:10px}
.q-opt{padding:12px 20px;border:2px solid var(--border);border-radius:16px;background:var(--surface);font-size:14px;font-weight:700;transition:all .1s;color:var(--muted)}
.q-opt.selected{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.2)}

.section-label{font-size:15px;font-weight:900;margin:24px 0 12px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.section-label .bdg-pill{padding:2px 10px;border-radius:12px;font-size:12px}
.section-label.demande .bdg-pill{background:var(--green-bg);color:var(--green)}
.section-label.aConfirmer .bdg-pill{background:var(--amber-bg);color:var(--amber)}
.section-label.option .bdg-pill{background:var(--primary-bg);color:var(--primary)}

.lines-table{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh-sm);border:1px solid var(--border)}
.lines-table table{width:100%;border-collapse:collapse}
.lines-table th{text-align:left;padding:16px 12px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border)}
.lines-table td{padding:16px 12px;border-bottom:1px solid var(--border);font-size:15px;vertical-align:top}
.lines-table tr:last-child td{border-bottom:none}
.lines-table input{width:100%;border:2px solid transparent;background:var(--surface-2);padding:10px;border-radius:12px;font-size:16px;font-weight:700;text-align:center}
.lines-table input:focus{border-color:var(--primary);background:#fff}
.lines-table td.num{text-align:right;font-family:ui-monospace,monospace;font-weight:700;color:var(--text)}
.lines-table td.motif{font-size:12px;color:var(--muted);font-weight:500;padding-top:6px}
.pu-wrapper { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.pu-wrapper input { width: 80px; }
.btn-reset { background: var(--surface-2); border-radius: 8px; padding: 8px; font-size: 14px; cursor: pointer; }
.btn-reset:hover { background: var(--border); }

.totaux{background:var(--surface-2);border-radius:var(--radius);padding:24px;margin-top:24px;border:1px solid var(--border)}
.totaux .tr{display:flex;justify-content:space-between;padding:10px 0;font-size:16px;font-weight:600;color:var(--muted)}
.totaux .tr .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--text)}
.totaux .tr.total{font-weight:900;font-size:24px;border-top:2px solid var(--border-2);padding-top:20px;margin-top:12px;color:var(--text)}
.totaux .tr.total .v{color:var(--primary)}

.bdg{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.bdg.ok,.bdg.accepted{background:var(--green-bg);color:var(--green)}
.bdg.warn,.bdg.sent{background:var(--amber-bg);color:var(--amber)}
.bdg.draft{background:var(--surface-2);color:var(--muted)}
.bdg.refused{background:var(--red-bg);color:var(--red)}

.banner{padding:16px 20px;border-radius:16px;margin-bottom:20px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:var(--sh-sm)}
.banner.warn{background:var(--amber-bg);border:1px solid #FCD34D;color:var(--amber)}
.banner.err{background:var(--red-bg);border:1px solid #FCA5A5;color:var(--red)}
.banner.ok{background:var(--green-bg);border:1px solid #6EE7B7;color:var(--green)}

#toast{position:fixed;top:20px;left:20px;right:20px;z-index:1000;background:var(--text);color:#fff;padding:16px;border-radius:16px;font-size:15px;font-weight:700;box-shadow:var(--sh-lg);opacity:0;transform:translateY(-20px);transition:all .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{background:var(--green)}
#toast.err{background:var(--red)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:28px 28px 0 0;padding:32px 24px;width:100%;box-shadow:var(--sh-lg);transform:translateY(100%);transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:12px;color:var(--text)}
.modal p{color:var(--muted);font-size:15px;margin-bottom:28px;font-weight:500;line-height:1.6}
.modal-actions{display:flex;flex-direction:column;gap:12px}

.success-wrap{max-width:640px;margin:32px auto;text-align:center}
.success-check{width:88px;height:88px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:44px;font-weight:900}
.success-wrap h1{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px}
.success-wrap p{color:var(--muted);margin-bottom:40px;font-size:16px;font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-style:italic;font-size:15px;font-weight:500}

@media (min-width:768px){
  body{padding-bottom:0}
  .bottom-nav,.fab{display:none}
  .hdr-nav{display:flex;gap:8px}
  .hdr-nav a{font-size:14px;font-weight:700;color:var(--muted);padding:10px 16px;border-radius:12px}
  .hdr-nav a:hover{background:var(--surface-2);color:var(--text)}
  .hero-actions{grid-template-columns:2fr 1fr}
  .kpi-strip{grid-template-columns:repeat(4, 1fr)}
  .kpi.full-width{grid-column:span 1}
  .row-2{grid-template-columns:1fr 1fr}
  .row-3{grid-template-columns:1fr 1fr 1fr}
  .ai-input-row{flex-direction:row}
  .modal-overlay{align-items:center}
  .modal{border-radius:24px;max-width:480px;transform:translateY(20px)}
  .modal-actions{flex-direction:row;justify-content:flex-end}
  .btn{width:auto}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand" onclick="retourAccueil()">
    <div class="hdr-mark">A</div>
    <div class="hdr-text">
      <h1>ArtisanApp</h1>
      <p>Votre copilote de chantier</p>
    </div>
  </div>
  <div class="hdr-right">
    <nav class="hdr-nav" id="top-nav">
      <a onclick="retourAccueil()">Tableau de bord</a>
      <a onclick="naviguer('liste-clients')">Clients</a>
      <a onclick="naviguer('liste-devis')">Devis</a>
    </nav>
    <div class="hdr-meta" id="hdr-date"></div>
  </div>
</header>

<a class="fab" onclick="naviguer('nouveau-devis')">+</a>

<nav class="bottom-nav">
  <a onclick="retourAccueil()" id="nav-accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Accueil
  </a>
  <a onclick="naviguer('liste-clients')" id="nav-clients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    Clients
  </a>
  <a onclick="naviguer('liste-devis')" id="nav-devis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    Devis
  </a>
</nav>

<div id="toast"></div>
<div id="error-banner" onclick="this.style.display='none'"></div>
<div class="modal-overlay" id="modal-overlay"></div>
<div class="wrap" id="root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ARTISANAPP V7 — Deep Pricing & Control
   ═══════════════════════════════════════════════════════════════════ */

window.addEventListener('error', function(e){
  var el = document.getElementById('error-banner');
  if (el) { el.textContent = 'Erreur : ' + (e.message || 'inconnue'); el.style.display = 'block'; }
  console.error(e);
});

var DEFAULT_CONFIG = { tauxHoraireInterne: 25, fraisGenerauxPct: 15, zone: 'province' };
var ZONES = {
  paris:        { label:'Paris (75)',      coeff:1.25 },
  idf:          { label:'Ile-de-France',   coeff:1.15 },
  grande_ville: { label:'Grande ville',    coeff:1.08 },
  province:     { label:'Province',        coeff:1.00 },
  rural:        { label:'Rural',           coeff:0.95 }
};
function chargerConfig() {
  try {
    var raw = localStorage.getItem('artisanapp_config');
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    var c = JSON.parse(raw);
    for (var k in DEFAULT_CONFIG) if (c[k] === undefined) c[k] = DEFAULT_CONFIG[k];
    return c;
  } catch(e) { return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function sauverConfig(c) { try { localStorage.setItem('artisanapp_config', JSON.stringify(c)); } catch(e) {} }
var CONFIG = chargerConfig();

/* ─── Base tarifaire TRÈS DÉTAILLÉE ─── */
var TARIFS = { postes: {
  'elec.prise.neuve':{d:'Pose prise 16A neuve',u:'u',pu:85,partF:0.15,tempsH:0.6},
  'elec.prise.rempl':{d:'Remplacement prise existante',u:'u',pu:45,partF:0.20,tempsH:0.4},
  'elec.interrupteur':{d:'Pose interrupteur / va-et-vient',u:'u',pu:75,partF:0.18,tempsH:0.5},
  'elec.cable.ml':{d:'Cable sous gaine ICTA',u:'ml',pu:14,partF:0.50,tempsH:0.08},
  'elec.disj.16A':{d:'Disjoncteur 16A fourni et pose',u:'u',pu:65,partF:0.40,tempsH:0.3},
  'elec.tableau.depose':{d:'Depose ancien tableau electrique',u:'forfait',pu:180,partF:0,tempsH:2},
  'elec.tableau.neuf':{d:'Fourniture et pose tableau electrique',u:'forfait',pu:1100,partF:0.55,tempsH:6},
  'elec.consuel':{d:'Essais et attestation Consuel',u:'forfait',pu:280,partF:0,tempsH:2},
  
  'plomb.fuite':{d:'Recherche et reparation de fuite',u:'forfait',pu:280,partF:0.15,tempsH:2},
  'plomb.robinet':{d:'Remplacement robinet',u:'u',pu:135,partF:0.35,tempsH:1},
  'plomb.chauffeEau':{d:'Fourniture et pose chauffe-eau 200L',u:'u',pu:1450,partF:0.55,tempsH:3},
  'plomb.wc.std':{d:'Fourniture et pose WC classique',u:'u',pu:650,partF:0.55,tempsH:2.5},

function chargerCatalogueCustom() {
  try { var raw = localStorage.getItem('artisanapp_catalogue'); return raw ? JSON.parse(raw) : {}; } catch(e) { return {}; }
}
function sauverCatalogueCustom(cat) { try { localStorage.setItem('artisanapp_catalogue', JSON.stringify(cat)); } catch(e) {} }
var CATALOGUE_CUSTOM = chargerCatalogueCustom();

function getPrixUnitaire(code, codeBase) {
  if (CATALOGUE_CUSTOM[codeBase] !== undefined) return CATALOGUE_CUSTOM[codeBase];
  return TARIFS.postes[codeBase] ? TARIFS.postes[codeBase].pu : 0;
}

function normaliser(s) {
  if (!s) return '';
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

var METIERS_MOTS = {
  electricite: ['electricite','prise','interrupteur','disjoncteur','tableau','cable','terre','consuel','coffret'],
  plomberie: ['plomberie','plombier','fuite','chauffe-eau','robinet','wc','toilette','evier','douche','baignoire'],
  peinture: ['peinture','peindre','repeindre','peint','plafond','enduit','sous-couche','lessivage'],
  maconnerie: ['maconnerie','mur','parpaing','agglo','brique','pierre','dalle','fondation','terrassement','chape','chainage','cloture','muret'],
  carrelage: ['carrelage','faience','plinthe','ragreage','mosaique','grand format', '30x30', '60x60'],
  plaquiste: ['placo','plaquiste','ba13','cloison','doublage','faux plafond'],
  menuiserie: ['menuiserie','porte','fenetre','volet','placard'],
  toiture: ['toiture','toit','tuile','ardoise','couverture','charpente','gouttiere'],
  sdb: ['salle de bain','sdb','salle d eau','vasque','sanitaire'],
  cuisine: ['cuisine','plan de travail','meuble','hotte'],
  isolation: ['isolation','isolant','laine de verre'],
  terrasse: ['terrasse','lame','composite','lambourde']
};

function parserDescription(texte) {
  var raw = texte;
  var t = ' ' + normaliser(texte).replace(/,/g, '.') + ' ';
  var r = { brut:raw, metier:null, longueur:null, hauteur:null, surface:null, distanceEquipement:null, quantiteEquipement:null, materiau:null, exclusions:[], motsInclus:[], nouvelles:false, remplacement:false, depose:false, formatMat:null };
  var m;

  var reLong = /(\d+(?:\.\d+)?)\s*(?:metres?|m(?![\w])|ml|lineaire)\s*(?:de\s+long)?/gi;
  while ((m = reLong.exec(t)) !== null) {
    var v = parseFloat(m[1]);
    if (v > 0 && v < 500) {
      if (/a\s*$/.test(t.substring(Math.max(0, m.index - 8), m.index))) continue;
      if (r.longueur === null || v > r.longueur) r.longueur = v;
    }
  }

  var reH = /(?:hauteur\s*(?:de\s*)?(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:metres?|m)?\s*(?:de\s+)?(?:haut(?:eur)?))/gi;
  while ((m = reH.exec(t)) !== null) {
    var vh = parseFloat(m[1] || m[2]);
    if (vh > 0 && vh < 15) { r.hauteur = vh; break; }
  }

  var reS = /(\d+(?:\.\d+)?)\s*m\s*[²2]/gi;
  while ((m = reS.exec(t)) !== null) {
    var vs = parseFloat(m[1]);
    if (vs > 0) { r.surface = vs; break; }
  }

  if (/\bparpaings?\b|\bagglos?\b/.test(t)) r.materiau = 'parpaing';
  else if (/\bbriques?\b/.test(t)) r.materiau = 'brique';
  else if (/\bpierres?\b/.test(t)) r.materiau = 'pierre';

  if (/\bgrand\s+format\b|\b60x60\b|\b80x80\b|\b120x120\b/.test(t)) r.formatMat = 'grand';
  else if (/\bmosaique\b|\bpetit\s+format\b/.test(t)) r.formatMat = 'mosaique';
  else if (/\bdiagonale\b/.test(t)) r.formatMat = 'diag';

  if (/\bfourni(e?s?)?\s*(et\s*)?pose/.test(t) || /\bfourniture\s+et\s+pose\b/.test(t)) r.motsInclus.push('fourniture_et_pose');
  if (/\bpose\s+seule?\b/.test(t) || /\bjuste\s+pose\b/.test(t)) r.motsInclus.push('pose_seule');
  
  if (/\bdepose\b/.test(t) || /\bcasse\b/.test(t) || /\bdemolition\b/.test(t)) r.depose = true;

  if (/\bremplacement\b/.test(t) || /\bremplacer\b/.test(t)) r.remplacement = true;
  if (/\bneuf(ve)?s?\b/.test(t) || /\bcreation\b/.test(t)) r.nouvelles = true;

  var scores = {};
  for (var k in METIERS_MOTS) {
    var sc = 0;
    for (var i = 0; i < METIERS_MOTS[k].length; i++) if (t.indexOf(METIERS_MOTS[k][i]) !== -1) sc += METIERS_MOTS[k][i].length;
    if (sc > 0) scores[k] = sc;
  }
  var best = null, bestSc = 0;
  for (var kk in scores) if (scores[kk] > bestSc) { bestSc = scores[kk]; best = kk; }
  r.metier = best;
  return r;
}

function genererQuestions(parsed, metier) {
  var qs = [];
  var t = normaliser(parsed.brut);

  if (parsed.motsInclus.indexOf('fourniture_et_pose') === -1 && parsed.motsInclus.indexOf('pose_seule') === -1) {
    qs.push({ id:'fourniture', texte:'Qui fournit les materiaux principaux ?',
      options:[{v:'fourniture_et_pose',label:'Fourniture + pose'},{v:'pose_seule',label:'Pose seule'}] });
  }
  if (metier === 'electricite') {
    if (parsed.quantiteEquipement && /prise|interrupteur|disjoncteur/.test(parsed.quantiteEquipement.type) && !parsed.remplacement) {
      qs.push({ id:'elec.type', texte:'Les ' + parsed.quantiteEquipement.val + ' ' + parsed.quantiteEquipement.type + ' sont :',
        options:[{v:'neuf',label:'Neuves'},{v:'remplacement',label:'Remplacement'}] });
    }
  }
  if (metier === 'plomberie') {
    if (/\bwc\b|\btoilette/.test(t) && !/suspendu|classique|standard/.test(t)) {
      qs.push({ id:'plomb.wc.type', texte:'Type de WC :',
        options:[{v:'classique',label:'Classique'},{v:'suspendu',label:'Suspendu'}] });
    }
  }
  if (metier === 'peinture') {
    qs.push({ id:'peint.etat', texte:'Etat des supports :',
      options:[{v:'bon',label:'Bon'},{v:'moyen',label:'Moyen'},{v:'mauvais',label:'Mauvais'}] });
    if (!/mat|satin|brillant/.test(t)) {
      qs.push({ id:'peint.finition', texte:'Type de peinture :',
        options:[{v:'mat',label:'Mat'},{v:'satin',label:'Satiné'}] });
    }
  }
  if (metier === 'maconnerie' && /cloture|muret|mur/.test(t)) {
    if (!parsed.materiau && !/parpaing|brique|pierre/.test(t)) {
      qs.push({ id:'mac.materiau', texte:'Materiau du mur :',
        options:[{v:'parpaing',label:'Parpaing'},{v:'brique',label:'Brique'},{v:'pierre',label:'Pierre'}] });
    }
  }
  if (metier === 'carrelage' || metier === 'sdb') {
    if (!parsed.depose && !/depose|existant/.test(t)) {
      qs.push({ id:'carr.depose', texte:'Deposer l ancien carrelage ?',
        options:[{v:'oui',label:'Oui'},{v:'non',label:'Non'}] });
    }
    if (!parsed.formatMat && !/standard|grand|mosaique|diagonale/.test(t)) {
      qs.push({ id:'carr.format', texte:'Quel format de carrelage ?',
        options:[{v:'std',label:'Standard'},{v:'grand',label:'Grand format (60x60+)'},{v:'mosaique',label:'Mosaïque'},{v:'diag',label:'En diagonale'}] });
    }
  }
  if (metier === 'menuiserie' && /fenetre/.test(t) && !/pvc|alu|bois/.test(t)) {
    qs.push({ id:'men.materiau', texte:'Materiau des fenêtres :',
      options:[{v:'pvc',label:'PVC'},{v:'alu',label:'Aluminium'}] });
  }
  return qs;
}

function nouvelleLigne(codeBase, qte, motif, categorie, confiance) {
  var p = TARIFS.postes[codeBase];
  if (!p) return null;
  var valide = (qte !== null && qte !== undefined && !isNaN(qte) && qte > 0);
  return {
    code: codeBase, 
    designation: p.d, 
    quantite: valide ? Math.round(qte * 100) / 100 : null,
    unite: p.u, 
    pu: getPrixUnitaire(null, codeBase), 
    puBase: p.pu, 
    partF: p.partF || 0, 
    tempsH: p.tempsH || 0,
    motif: motif, 
    categorie: categorie,
    confiance: confiance || (valide ? 'confirme' : 'a_renseigner'),
    inclus: valide && categorie === 'demande', 
    _manual: false
  };
}

function construireLignes(parsed, metier, reponses, lignesExistantes) {
  var manuelles = [];
  if (lignesExistantes && lignesExistantes.length) {
    lignesExistantes.forEach(function(l){ if (l._manual) manuelles.push(l); });
  }
  var lignes = [];
  var t = normaliser(parsed.brut);
  var surf = parsed.surface || (parsed.longueur && parsed.hauteur ? parsed.longueur * parsed.hauteur : null);
  var L = parsed.longueur, H = parsed.hauteur;
  var poseSeule = reponses.fourniture === 'pose_seule' || parsed.motsInclus.indexOf('pose_seule') !== -1;

  function ajouter(codeBase, qte, motif, categorie, conf) {
    for (var i = 0; i < manuelles.length; i++) if (manuelles[i].code === codeBase) return;
    var l = nouvelleLigne(codeBase, qte, motif, categorie, conf);
    if (!l) return;
    if (poseSeule && l.partF > 0) {
      l.pu = Math.round((l.pu * (1 - l.partF * 0.7)) * 100) / 100;
      l.partF = 0;
    }
    lignes.push(l);
  }

  if (metier === 'electricite') {
    var qe = parsed.quantiteEquipement;
    var typeE = reponses['elec.type'] || (parsed.remplacement ? 'remplacement' : (parsed.nouvelles ? 'neuf' : null));
    if (qe && /prise/.test(qe.type)) {
      var codeP = typeE === 'remplacement' ? 'elec.prise.rempl' : 'elec.prise.neuve';
      ajouter(codeP, qe.val, 'Quantite : ' + qe.val, 'demande', 'confirme');
    } else if (/prise/.test(t) && !qe) {
      ajouter('elec.prise.neuve', null, 'Prises sans quantite', 'demande', 'a_renseigner');
    }
  }
  if (metier === 'plomberie') {
    if (/\bwc\b|\btoilette/.test(t)) {
      var typeWC = reponses['plomb.wc.type'];
      if (typeWC === 'suspendu') ajouter('plomb.wc.suspendu', 1, 'WC suspendu', 'demande', 'confirme');
      else if (typeWC === 'classique') ajouter('plomb.wc.std', 1, 'WC classique', 'demande', 'confirme');
      else ajouter('plomb.wc.std', null, 'Type de WC a preciser', 'a_confirmer', 'a_renseigner');
    }
  }
  if (metier === 'peinture') {
    if (surf === null || surf <= 0) {
      ajouter('peint.mur.mat', null, 'Surface a renseigner', 'demande', 'a_renseigner');
    } else {
      var fin = reponses['peint.finition'] || 'mat';
      var codeM = fin === 'satin' ? 'peint.mur.satin' : 'peint.mur.mat';
      ajouter(codeM, surf, 'Peinture ' + fin, 'demande', 'confirme');
    }
  }
  if (metier === 'maconnerie') {
    if (/cloture|muret|\bmur\b/.test(t)) {
      if (L !== null && H !== null) {
        var S = L * H;
        var mat = reponses['mac.materiau'] || parsed.materiau || 'parpaing';
        var codeM = 'mac.mur.' + mat + (mat === 'parpaing' ? '.20' : '');
        ajouter(codeM, S, 'Surface = ' + L + ' x ' + H + ' = ' + S.toFixed(2) + ' m2', 'demande', 'confirme');
      } else {
        ajouter('mac.mur.parpaing.20', null, 'Dimensions a preciser', 'demande', 'a_renseigner');
      }
    }
  }
  if (metier === 'carrelage') {
    var sc = parsed.surface;
    if (sc === null || sc <= 0) ajouter('carr.sol.std', null, 'Surface a preciser', 'demande', 'a_renseigner');
    else {
      var f = reponses['carr.format'] || parsed.formatMat || 'std';
      var codePose = f === 'grand' ? 'carr.sol.grand' : (f === 'mosaique' ? 'carr.sol.mosaique' : (f === 'diag' ? 'carr.sol.diag' : 'carr.sol.std'));
      if (reponses['carr.depose'] === 'oui' || parsed.depose) ajouter('carr.depose', sc, 'Depose', 'demande', 'confirme');
      ajouter('carr.prep.support', sc, 'Preparation', 'demande', 'confirme');
      ajouter(codePose, sc, 'Pose ' + f, 'demande', 'confirme');
    }
  }
  if (metier === 'sdb') {
    var ampl = reponses['sdb.ampleur'];
    var sanit = reponses['sdb.sanitaires'];
    var ss = parsed.surface;
    var f2 = reponses['carr.format'] || parsed.formatMat || 'std';
    var codeFaience = f2 === 'mosaique' ? 'carr.mur.mosaique' : 'sdb.faience';
    
    if (ss === null || ss <= 0) ajouter('sdb.carrelage.sol', null, 'Surface SDB a preciser', 'demande', 'a_renseigner');
    else {
      if (ampl === 'complete') {
        ajouter('sdb.depose.sanitaires', 1, 'Renovation complete', 'demande', 'confirme');
        ajouter('sdb.plomberie', 1, 'Renovation complete', 'demande', 'confirme');
      }
      if (ampl === 'complete' || ampl === 'partielle' || parsed.depose) ajouter('sdb.depose.carrelage', ss, 'Depose carrelage', 'demande', 'confirme');
      ajouter('sdb.etancheite', ss, 'Etancheite', 'demande', 'confirme');
      ajouter('sdb.carrelage.sol', ss, 'Carrelage sol ' + f2, 'demande', 'confirme');
      ajouter(codeFaience, Math.round(ss * 2.5 * 10) / 10, 'Faience murale', 'demande', 'hypothese');
    }
  }
  if (metier === 'menuiserie') {
    var qm = parsed.quantiteEquipement;
    var n = qm ? qm.val : null;
    if (/\bfenetre/.test(t)) {
      var mat2 = reponses['men.materiau'] || 'pvc';
      var codeF = mat2 === 'alu' ? 'men.fenetre.alu' : 'men.fenetre.pvc';
      ajouter('men.depose.ouvrant', n, 'Depose', n ? 'demande' : 'a_confirmer', n ? 'confirme' : 'a_renseigner');
      ajouter(codeF, n, 'Fenetres ' + mat2, n ? 'demande' : 'a_confirmer', n ? 'hypothese' : 'a_renseigner');
    }
  }

  if (metier === 'plaquiste' && surf) {
    ajouter('placo.ossature', surf, 'Ossature', 'demande', 'confirme');
    ajouter('placo.ba13', surf, 'Plaques', 'demande', 'confirme');
    ajouter('placo.bande.enduit', surf, 'Bandes', 'demande', 'confirme');
  }

  manuelles.forEach(function(l){ lignes.push(l); });
  return lignes;
}

function calculerTotaux(lignes, tvaPct, zone) {
  var zoneCoeff = ZONES[zone] ? ZONES[zone].coeff : 1;
  var totalHT = 0, coutF = 0, coutMO = 0, lignesIncl = 0, lignesAvecCout = 0;

  for (var i = 0; i < lignes.length; i++) {
    var l = lignes[i];
    if (!l.inclus || l.quantite === null) continue;
    lignesIncl++;
    var tot = l.quantite * l.pu * zoneCoeff;
    totalHT += tot;
    if (l.partF > 0) coutF += tot * l.partF;
    if (l.tempsH > 0 && CONFIG.tauxHoraireInterne > 0) coutMO += l.quantite * l.tempsH * CONFIG.tauxHoraireInterne;
    if (l.partF > 0 || l.tempsH > 0) lignesAvecCout++;
    else if (l._manual) lignesAvecCout = -9999;
  }

  var fg = coutMO * (CONFIG.fraisGenerauxPct / 100);
  var coutRevient = coutF + coutMO + fg;
  var margeCalc = lignesIncl > 0 && lignesAvecCout === lignesIncl;

  totalHT = Math.round(totalHT * 100) / 100;
  var mtva = Math.round(totalHT * tvaPct / 100 * 100) / 100;
  var ttc = Math.round((totalHT + mtva) * 100) / 100;

  var margeB = null, tauxM = null;
  if (margeCalc) {
    margeB = Math.round((totalHT - coutRevient) * 100) / 100;
    tauxM = totalHT > 0 ? Math.round(margeB / totalHT * 1000) / 10 : 0;
  }
  return {
    totalHT: totalHT, montantTVA: mtva, totalTTC: ttc,
    margeBrute: margeB, margeCalculable: margeCalc
  };
}

function charger() {
  try {
    var raw = localStorage.getItem('artisanapp');
    if (!raw) return { clients: [], devis: [], compteurs: { clients: 0, devis: 0 } };
    var d = JSON.parse(raw);
    if (!d.clients) d.clients = [];
    if (!d.devis) d.devis = [];
    if (!d.compteurs) d.compteurs = { clients: 0, devis: 0 };
    return d;
  } catch(e) { return { clients: [], devis: [], compteurs: { clients: 0, devis: 0 } }; }
}
function sauver(d) { try { localStorage.setItem('artisanapp', JSON.stringify(d)); } catch(e) { toast('Erreur de sauvegarde', 'err'); } }
function chargerDraft() { try { var raw = localStorage.getItem('artisanapp_draft'); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function sauverDraft() {
  try {
    if (!DEV_STATE.parsed) { localStorage.removeItem('artisanapp_draft'); return; }
    localStorage.setItem('artisanapp_draft', JSON.stringify({
      parsed: DEV_STATE.parsed, metier: DEV_STATE.metier,
      reponses: DEV_STATE.reponses, lignes: DEV_STATE.lignes,
      tva: DEV_STATE.tva, clientId: DEV_STATE.clientId, editeId: DEV_STATE.editeId
    }));
  } catch(e) {}
}
function effacerDraft() { try { localStorage.removeItem('artisanapp_draft'); } catch(e) {} }

function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function eur(n) { if (n === null || n === undefined) return '-'; return (parseFloat(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR'; }
function dateFr(iso) { try { return new Date(iso).toLocaleDateString('fr-FR'); } catch(e) { return '-'; } }
function initiales(nom) { if (!nom) return '?'; var p = nom.split(/\s+/).filter(function(x){ return x.length; }); if (!p.length) return '?'; if (p.length === 1) return p[0].substring(0,2).toUpperCase(); return (p[0][0] + p[1][0]).toUpperCase(); }
var toastTimer = null;
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type === 'err' ? 'err' : (type === 'ok' ? 'ok' : ''));
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ''; }, 3200);
}

var MODAL_CB = null;
function confirmer(titre, message, cbOui, libelleOui) {
  MODAL_CB = cbOui;
  var overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = '<div class="modal"><h3>' + esc(titre) + '</h3><p>' + esc(message) + '</p><div class="modal-actions"><button class="btn btn-danger" onclick="validerModal()">' + esc(libelleOui || 'Confirmer') + '</button><button class="btn btn-ghost" onclick="fermerModal()">Annuler</button></div></div>';
  overlay.classList.add('show');
}
function fermerModal() { document.getElementById('modal-overlay').classList.remove('show'); MODAL_CB = null; }
function validerModal() { var cb = MODAL_CB; fermerModal(); if (cb) cb(); }

var NAV_STACK = [];
var NAV_LOCK = false;
function naviguer(ecran, params, remplacer) {
  params = params || {};
  if (remplacer && NAV_STACK.length) NAV_STACK[NAV_STACK.length - 1] = { ecran: ecran, params: params };
  else NAV_STACK.push({ ecran: ecran, params: params });
  try { history.pushState({ idx: NAV_STACK.length - 1 }, '', '#' + ecran); } catch(e) {}
  rendreEcran();
}
function retour() { if (NAV_STACK.length > 1) { NAV_STACK.pop(); rendreEcran(); } else retourAccueil(); }
function retourAccueil() {
  NAV_STACK = [{ ecran: 'accueil', params: {} }];
  try { history.replaceState({ idx: 0 }, '', '#accueil'); } catch(e) {}
  rendreEcran();
}
window.addEventListener('popstate', function() { if (NAV_STACK.length > 1) { NAV_STACK.pop(); rendreEcran(); } });

function updateNavBar(active) {
  document.getElementById('nav-accueil').classList.remove('active');
  document.getElementById('nav-clients').classList.remove('active');
  document.getElementById('nav-devis').classList.remove('active');
  if(document.getElementById('nav-' + active)) {
    document.getElementById('nav-' + active).classList.add('active');
  }
  var fab = document.querySelector('.fab');
  if(active === 'accueil' || active === 'clients' || active === 'devis') { fab.style.display = 'flex'; }
  else { fab.style.display = 'none'; }
}

function rendreEcran() {
  var current = NAV_STACK[NAV_STACK.length - 1];
  if (!current) { NAV_STACK = [{ ecran: 'accueil', params: {} }]; current = NAV_STACK[0]; }
  var root = document.getElementById('root');
  var html = '';
  try {
    switch (current.ecran) {
      case 'accueil':        html = ecranAccueil(); updateNavBar('accueil'); break;
      case 'nouveau-client': html = ecranNouveauClient(); updateNavBar('clients'); break;
      case 'client-cree':    html = ecranClientCree(current.params.clientId); updateNavBar('clients'); break;
      case 'client-edit':    html = ecranClientEdit(current.params.clientId); updateNavBar('clients'); break;
      case 'fiche-client':   html = ecranFicheClient(current.params.clientId); updateNavBar('clients'); break;
      case 'liste-clients':  html = ecranListeClients(current.params.filtre || ''); updateNavBar('clients'); break;
      case 'liste-devis':    html = ecranListeDevis(current.params.filtre || ''); updateNavBar('devis'); break;
      case 'devis-detail':   html = ecranDevisDetail(current.params.devisId); updateNavBar('devis'); break;
      case 'nouveau-devis':  html = ecranNouveauDevis(current.params.clientId); updateNavBar('devis'); break;
      case 'devis-edit':     html = ecranDevisEdit(current.params.devisId); updateNavBar('devis'); break;
      default:               html = ecranAccueil(); updateNavBar('accueil');
    }
  } catch(e) {
    console.error(e);
    html = '<div class="banner err">Erreur : ' + esc(e.message) + '</div>' +
           '<div class="card"><button class="btn" onclick="retourAccueil()">Retour a l accueil</button></div>';
  }
  root.innerHTML = html;
  window.scrollTo(0, 0);
  setTimeout(function(){ var e = root.querySelector('[autofocus]'); if (e) e.focus(); }, 50);
}

function boutonRetour(texte) {
  if (NAV_STACK.length <= 1) return '';
  return '<button class="back-btn" onclick="retour()">← ' + esc(texte || 'Retour') + '</button>';
}

/* ─── ACCUEIL ─── */
function ecranAccueil() {
  var data = charger();
  var devis = data.devis;
  var clients = data.clients;
  var parStatut = { brouillon: {n:0,m:0}, 'envoye': {n:0,m:0}, 'accepte': {n:0,m:0}, 'refuse': {n:0,m:0} };
  var caAccepte = 0;
  devis.forEach(function(d){
    var s = d.statut || 'brouillon';
    var key = s === 'envoye' ? 'envoye' : (s === 'accepte' ? 'accepte' : (s === 'refuse' ? 'refuse' : 'brouillon'));
    if (!parStatut[key]) parStatut[key] = { n:0, m:0 };
    parStatut[key].n++;
    parStatut[key].m += d.totalTTC || 0;
    if (s === 'accepte') caAccepte += d.totalTTC || 0;
  });

  var recent = clients.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); }).slice(0, 3);
  var draft = chargerDraft();

  var html = '';

  if (draft && draft.parsed) {
    html += '<div class="banner warn">' +
      '<div style="flex:1"><strong style="font-size:15px">Brouillon en attente</strong><br><span style="font-size:13px;opacity:.8">' +
      esc((draft.parsed.brut || '').substring(0, 40)) + (draft.parsed.brut && draft.parsed.brut.length > 40 ? '...' : '') +
      '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0">' +
      '<button class="btn btn-sm" onclick="reprendreDraft()">Reprendre</button>' +
      '</div></div>';
  }

  html += '<div class="hero-actions">';
  html += '<button class="btn-hero" onclick="naviguer(\'nouveau-client\')"><div class="hi">+</div><div><h3>Nouveau client</h3><p>Saisir une fiche rapide</p></div></button>';
  html += '<button class="btn-hero-2" onclick="naviguer(\'nouveau-devis\')"><div class="hi">D</div><div><h3>Nouveau devis</h3><p>Chiffrer avec le copilote</p></div></button>';
  html += '</div>';

  html += '<div class="kpi-strip">';
  html += '<div class="kpi" onclick="naviguer(\'liste-clients\')"><div class="lbl">Clients</div><div class="val">' + clients.length + '</div></div>';
  html += '<div class="kpi" onclick="naviguer(\'liste-devis\')"><div class="lbl">Devis</div><div class="val">' + devis.length + '</div></div>';
  html += '<div class="kpi full-width" onclick="naviguer(\'liste-devis\')"><div class="lbl">Chiffre d\'Affaires Accepté</div><div class="val pos">' + eur(caAccepte) + '</div><div class="sub">' + parStatut.accepte.n + ' devis validés par vos clients</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-head"><div><div class="card-title">Derniers clients</div></div><button class="btn btn-ghost btn-sm" onclick="naviguer(\'liste-clients\')">Tout voir</button></div>';
  if (!recent.length) html += '<div class="empty">Aucun client enregistre.</div>';
  else {
    html += '<div style="margin:-24px;margin-top:0">';
    recent.forEach(function(c){
      html += '<div class="list-row" onclick="naviguer(\'fiche-client\', {clientId:\'' + c.id + '\'})">';
      html += '<div class="list-avatar">' + initiales(c.nom) + '</div>';
      html += '<div class="list-body"><div class="list-title">' + esc(c.nom) + '</div><div class="list-sub">' + esc(c.ville || '') + '</div></div>';
      html += '<div class="list-row-chev">›</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-head"><div><div class="card-title">Sauvegarde (Sécurité)</div><div class="card-sub">Exportez vos données pour les transférer sur un autre appareil</div></div></div>';
  html += '<div class="row-2">';
  html += '<button class="btn btn-ghost" onclick="exporterDonnees()">⬇️ Exporter (JSON)</button>';
  html += '<button class="btn btn-ghost" onclick="importerDonnees()">⬆️ Importer un fichier</button>';
  html += '</div></div>';

  return html;
}

function reprendreDraft() {
  var draft = chargerDraft();
  if (!draft || !draft.parsed) { toast('Aucun brouillon', 'err'); return; }
  if (draft.editeId) { naviguer('devis-edit', { devisId: draft.editeId }); return; }
  DEV_STATE = { parsed: draft.parsed, metier: draft.metier, reponses: draft.reponses || {}, lignes: draft.lignes || [], tva: draft.tva || 20, clientId: draft.clientId || null, editeId: null };
  naviguer('nouveau-devis', { clientId: draft.clientId });
}

function exporterDonnees() {
  var data = charger();
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = "artisanapp-sauvegarde-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée !', 'ok');
}

function importerDonnees() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!data.clients || !data.devis) throw new Error("Format invalide");
        confirmer('Importer les données ?', 'Cela remplacera vos données actuelles.', function() {
          sauver(data);
          toast('Import réussi !', 'ok');
          rendreEcran();
        }, 'Importer');
      } catch(err) { toast('Fichier invalide', 'err'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ─── NOUVEAU CLIENT ─── */
function ecranNouveauClient() {
  var html = boutonRetour('Retour');
  html += '<div class="card">';
  html += '<div class="card-head"><div><div class="card-title">Nouveau client</div><div class="card-sub">Nom et ville obligatoires</div></div></div>';
  html += '<div class="field"><label>Nom <span class="req">*</span></label><input class="inp" id="c-nom" autofocus placeholder="ex : Mme Dupont"></div>';
  html += '<div class="row-2"><div class="field"><label>Ville <span class="req">*</span></label><input class="inp" id="c-ville" placeholder="ex : Lyon"></div><div class="field"><label>Code postal</label><input class="inp" id="c-cp" placeholder="ex : 69003"></div></div>';
  html += '<div class="row-2"><div class="field"><label>Telephone</label><input class="inp" id="c-tel" type="tel"></div><div class="field"><label>Email</label><input class="inp" id="c-email" type="email"></div></div>';
  html += '<div class="field"><label>Adresse chantier</label><input class="inp" id="c-adresse"></div>';
  html += '<button class="btn" id="c-submit" onclick="enregistrerClient()" style="margin-top:16px">Enregistrer le client</button>';
  html += '</div>';
  return html;
}

function enregistrerClient() {
  if (NAV_LOCK) return;
  NAV_LOCK = true;
  var btn = document.getElementById('c-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement...'; }

  var nom = (document.getElementById('c-nom').value || '').trim();
  var ville = (document.getElementById('c-ville').value || '').trim();
  if (!nom) { toast('Nom obligatoire', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; } return; }
  if (!ville) { toast('Ville obligatoire', 'err'); NAV_LOCK = false; if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; } return; }

  try {
    var data = charger();
    var doublon = null;
    for (var i = 0; i < data.clients.length; i++) {
      if (normaliser(data.clients[i].nom) === normaliser(nom) && normaliser(data.clients[i].ville) === normaliser(ville)) {
        doublon = data.clients[i]; break;
      }
    }
    if (doublon) {
      NAV_LOCK = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; }
      confirmer('Client deja existant', 'Un client avec le meme nom et la meme ville existe : ' + doublon.nom + '.', function() {
        naviguer('fiche-client', { clientId: doublon.id }, true);
      }, 'Ouvrir la fiche');
      return;
    }
    data.compteurs.clients = (data.compteurs.clients || 0) + 1;
    var annee = new Date().getFullYear();
    var id = 'C-' + annee + '-' + String(data.compteurs.clients).padStart(4, '0');
    data.clients.push({
      id: id, nom: nom, ville: ville,
      codePostal: (document.getElementById('c-cp').value || '').trim(),
      tel: (document.getElementById('c-tel').value || '').trim(),
      email: (document.getElementById('c-email').value || '').trim(),
      adresse: (document.getElementById('c-adresse').value || '').trim(),
      dateCreation: new Date().toISOString()
    });
    sauver(data);
    toast('Client ' + id + ' cree', 'ok');
    NAV_STACK[NAV_STACK.length - 1] = { ecran: 'client-cree', params: { clientId: id } };
    rendreEcran();
  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer le client'; }
  } finally { NAV_LOCK = false; }
}

function ecranClientCree(clientId) {
  var data = charger();
  var c = null;
  for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === clientId) c = data.clients[i];
  if (!c) return '<div class="empty">Client introuvable.</div>';
  return '<div class="success-wrap">' +
    '<div class="success-check">✓</div>' +
    '<h1>Client enregistre</h1>' +
    '<p>' + esc(c.nom) + ' - ' + esc(c.id) + '</p>' +
    '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<button class="btn" onclick="naviguer(\'nouveau-devis\', {clientId:\'' + c.id + '\'})">Créer un devis maintenant</button>' +
    '<button class="btn btn-ghost" onclick="naviguer(\'fiche-client\', {clientId:\'' + c.id + '\'})">Voir sa fiche</button>' +
    '<button class="btn btn-ghost" onclick="retourAccueil()">Retour au tableau de bord</button>' +
    '</div></div>';
}

/* ─── LISTE CLIENTS ─── */
function ecranListeClients(filtre) {
  var data = charger();
  var clients = data.clients.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); });
  var f = normaliser(filtre);
  var filtered = f ? clients.filter(function(c){ return normaliser(c.nom + ' ' + c.ville + ' ' + (c.tel||'') + ' ' + (c.email||'')).indexOf(f) !== -1; }) : clients;

  var html = boutonRetour('Retour');
  html += '<div class="card"><div class="card-head"><div><div class="card-title">Clients (' + clients.length + ')</div></div><button class="btn btn-sm" onclick="naviguer(\'nouveau-client\')">+ Nouveau</button></div>';
  html += '<div class="field" style="margin-bottom:20px"><input class="inp" id="search-client" placeholder="Rechercher nom, ville..." value="' + esc(filtre) + '" oninput="rechercherClients(this.value)"></div>';
  html += '<div id="liste-clients-body">' + renderListeClientsBody(filtered, data) + '</div>';
  html += '</div>';
  return html;
}

function renderListeClientsBody(clients, data) {
  if (!clients.length) return '<div class="empty">Aucun client trouve.</div>';
  var h = '<div style="margin:-24px;margin-top:0">';
  clients.forEach(function(c){
    var dv = data.devis.filter(function(d){ return d.clientId === c.id; });
    var ca = 0; dv.forEach(function(d){ ca += d.totalTTC || 0; });
    h += '<div class="list-row" onclick="naviguer(\'fiche-client\', {clientId:\'' + c.id + '\'})">';
    h += '<div class="list-avatar">' + initiales(c.nom) + '</div>';
    h += '<div class="list-body"><div class="list-title">' + esc(c.nom) + '</div><div class="list-sub">' + esc(c.ville || '') + ' / ' + dv.length + ' devis</div></div>';
    h += '<div class="list-right"><div>' + eur(ca) + '</div><div class="sub">cumul</div></div>';
    h += '<div class="list-row-chev">›</div></div>';
  });
  h += '</div>';
  return h;
}

var searchTimer = null;
function rechercherClients(val) {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var current = NAV_STACK[NAV_STACK.length - 1];
    if (current.ecran !== 'liste-clients') return;
    current.params.filtre = val;
    var data = charger();
    var clients = data.clients.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); });
    var f = normaliser(val);
    var filtered = f ? clients.filter(function(c){ return normaliser(c.nom + ' ' + c.ville + ' ' + (c.tel||'') + ' ' + (c.email||'')).indexOf(f) !== -1; }) : clients;
    var body = document.getElementById('liste-clients-body');
    if (body) body.innerHTML = renderListeClientsBody(filtered, data);
  }, 150);
}

/* ─── FICHE CLIENT ─── */
function ecranFicheClient(clientId) {
  var data = charger();
  var c = null;
  for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === clientId) c = data.clients[i];
  if (!c) return '<div class="empty">Client introuvable.</div>';
  var dv = data.devis.filter(function(d){ return d.clientId === clientId; });
  var ca = 0; dv.forEach(function(d){ ca += d.totalTTC || 0; });

  var html = boutonRetour('Retour');
  html += '<div class="card"><div class="card-head"><div><div class="card-title">' + esc(c.nom) + '</div><div class="card-sub">' + esc(c.id) + '</div></div><button class="btn btn-ghost btn-sm" onclick="naviguer(\'client-edit\', {clientId:\'' + c.id + '\'})">Modifier</button></div>';
  html += '<div class="row-2">';
  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Ville</div><div style="font-weight:700">' + esc(c.ville || '-') + '</div></div>';
  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Code postal</div><div style="font-weight:700">' + esc(c.codePostal || '-') + '</div></div>';
  html += '</div>';
  html += '<div class="row-2" style="margin-top:16px">';
  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Telephone</div><div style="font-weight:700">' + esc(c.tel || '-') + '</div></div>';
  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Email</div><div style="font-weight:700">' + esc(c.email || '-') + '</div></div>';
  html += '</div>';
  html += '<div style="margin-top:24px;padding-top:24px;border-top:2px solid var(--border)"><div style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Chiffre d\'Affaires Cumulé</div><div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1.5px">' + eur(ca) + '</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-head"><div><div class="card-title">Devis (' + dv.length + ')</div></div><button class="btn btn-sm" onclick="naviguer(\'nouveau-devis\', {clientId:\'' + c.id + '\'})">+ Devis</button></div>';
  if (!dv.length) html += '<div class="empty">Aucun devis pour ce client.</div>';
  else {
    html += '<div style="margin:-24px;margin-top:0">';
    dv.forEach(function(d){
      var cls = d.statut === 'accepte' ? 'accepted' : (d.statut === 'envoye' ? 'sent' : (d.statut === 'refuse' ? 'refused' : 'draft'));
      html += '<div class="list-row" onclick="naviguer(\'devis-detail\', {devisId:\'' + d.id + '\'})">';
      html += '<div class="list-avatar" style="background:var(--surface-2);color:var(--muted)">' + esc((d.id || '').substring(4, 7)) + '</div>';
      html += '<div class="list-body"><div class="list-title">' + esc(d.id) + '</div><div class="list-sub">' + dateFr(d.dateCreation) + ' - ' + esc(d.domaine) + '</div></div>';
      html += '<div class="list-right"><div>' + eur(d.totalTTC) + '</div><div class="sub"><span class="bdg ' + cls + '">' + esc(d.statut) + '</span></div></div></div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ─── EDIT CLIENT ─── */
function ecranClientEdit(clientId) {
  var data = charger();
  var c = null;
  for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === clientId) c = data.clients[i];
  if (!c) return '<div class="empty">Client introuvable.</div>';
  var html = boutonRetour('Retour');
  html += '<div class="card">';
  html += '<div class="card-head"><div><div class="card-title">Modifier le client</div></div></div>';
  html += '<div class="field"><label>Nom <span class="req">*</span></label><input class="inp" id="ce-nom" autofocus value="' + esc(c.nom) + '"></div>';
  html += '<div class="row-2"><div class="field"><label>Ville <span class="req">*</span></label><input class="inp" id="ce-ville" value="' + esc(c.ville || '') + '"></div><div class="field"><label>Code postal</label><input class="inp" id="ce-cp" value="' + esc(c.codePostal || '') + '"></div></div>';
  html += '<div class="row-2"><div class="field"><label>Telephone</label><input class="inp" id="ce-tel" type="tel" value="' + esc(c.tel || '') + '"></div><div class="field"><label>Email</label><input class="inp" id="ce-email" type="email" value="' + esc(c.email || '') + '"></div></div>';

  html += '<button class="btn" id="ce-submit" onclick="sauverClientEdit(\'' + c.id + '\')">Enregistrer les modifications</button>';
  html += '<button class="btn btn-ghost" onclick="retour()">Annuler</button></div>';
  html += '</div>';
  return html;
}

function sauverClientEdit(clientId) {
  if (NAV_LOCK) return;
  NAV_LOCK = true;
  var btn = document.getElementById('ce-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement...'; }
  var nom = (document.getElementById('ce-nom').value || '').trim();
  var ville = (document.getElementById('ce-ville').value || '').trim();
  if (!nom || !ville) {
    toast('Nom et ville obligatoires', 'err');
    NAV_LOCK = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer les modifications'; }
    return;
  }
  try {
    var data = charger();
    for (var i = 0; i < data.clients.length; i++) {
      if (data.clients[i].id === clientId) {
        data.clients[i].nom = nom;
        data.clients[i].ville = ville;
        data.clients[i].codePostal = (document.getElementById('ce-cp').value || '').trim();
        data.clients[i].tel = (document.getElementById('ce-tel').value || '').trim();
        data.clients[i].email = (document.getElementById('ce-email').value || '').trim();
        data.clients[i].adresse = (document.getElementById('ce-adresse').value || '').trim();
        break;
      }
    }
    for (var j = 0; j < data.devis.length; j++) if (data.devis[j].clientId === clientId) data.devis[j].clientNom = nom;
    sauver(data);
    toast('Client modifie', 'ok');
    retour();
  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Enregistrer les modifications'; }
  } finally { NAV_LOCK = false; }
}

/* ─── LISTE DEVIS ─── */
function ecranListeDevis(filtre) {
  var data = charger();
  var devis = data.devis.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); });
  var f = normaliser(filtre);
  var filtered = f ? devis.filter(function(d){ return normaliser((d.id||'') + ' ' + (d.clientNom||'') + ' ' + (d.domaine||'')).indexOf(f) !== -1; }) : devis;

  var html = boutonRetour('Retour');
  html += '<div class="card"><div class="card-head"><div><div class="card-title">Tous les devis</div><div class="card-sub">' + devis.length + ' au total</div></div><button class="btn btn-sm" onclick="naviguer(\'nouveau-devis\')">+ Nouveau</button></div>';
  html += '<div class="field" style="margin-bottom:20px"><input class="inp" id="search-devis" placeholder="Rechercher un client..." value="' + esc(filtre) + '" oninput="rechercherDevis(this.value)"></div>';
  html += '<div id="liste-devis-body">' + renderListeDevisBody(filtered) + '</div>';
  html += '</div>';
  return html;
}

function renderListeDevisBody(devis) {
  if (!devis.length) return '<div class="empty">Aucun devis trouve.</div>';
  var h = '<div style="margin:-24px;margin-top:0">';
  devis.forEach(function(d){
    var cls = d.statut === 'accepte' ? 'accepted' : (d.statut === 'envoye' ? 'sent' : (d.statut === 'refuse' ? 'refused' : 'draft'));
    h += '<div class="list-row" onclick="naviguer(\'devis-detail\', {devisId:\'' + d.id + '\'})">';
    h += '<div class="list-avatar" style="background:var(--surface-2);color:var(--muted)">' + esc((d.id || '').substring(4, 7)) + '</div>';
    h += '<div class="list-body"><div class="list-title">' + esc(d.clientNom) + '</div><div class="list-sub">' + esc(d.id) + ' - ' + esc(d.domaine) + '</div></div>';
    h += '<div class="list-right"><div>' + eur(d.totalTTC) + '</div><div class="sub"><span class="bdg ' + cls + '">' + esc(d.statut) + '</span></div></div></div>';
  });
  h += '</div>';
  return h;
}

function rechercherDevis(val) {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var current = NAV_STACK[NAV_STACK.length - 1];
    if (current.ecran !== 'liste-devis') return;
    current.params.filtre = val;
    var data = charger();
    var devis = data.devis.slice().sort(function(a,b){ return new Date(b.dateCreation) - new Date(a.dateCreation); });
    var f = normaliser(val);
    var filtered = f ? devis.filter(function(d){ return normaliser((d.id||'') + ' ' + (d.clientNom||'') + ' ' + (d.domaine||'')).indexOf(f) !== -1; }) : devis;
    var body = document.getElementById('liste-devis-body');
    if (body) body.innerHTML = renderListeDevisBody(filtered);
  }, 150);
}

/* ─── DETAIL DEVIS ─── */
function ecranDevisDetail(devisId) {
  var data = charger();
  var d = null;
  for (var i = 0; i < data.devis.length; i++) if (data.devis[i].id === devisId) d = data.devis[i];
  if (!d) return '<div class="empty">Devis introuvable.</div>';
  var lignes = Array.isArray(d.lignes) ? d.lignes : [];

  html += '<button class="btn btn-ghost btn-sm" onclick="naviguer(\'devis-edit\', {devisId:\'' + d.id + '\'})">Editer</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="supprimerDevis(\'' + d.id + '\')">Suppr</button>';
  html += '</div></div>';

  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Statut</div><div><span class="bdg ' + statutClass + '">' + esc(d.statut || '') + '</span></div></div>';
  html += '<div><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Actions</div><button class="btn btn-sm" onclick="changerStatutDevis(\'' + d.id + '\')">Changer</button></div>';

  if (lignes.length) {
    var incluses = lignes.filter(function(l){ return l.inclus; });

      incluses.forEach(function(l){
        html += '<div style="padding:16px 0;border-bottom:1px solid var(--border)">';
        html += '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px"><span>' + esc(l.designation) + '</span><span>' + (l.quantite !== null ? eur(l.quantite * l.prixUnitaireHT) : '-') + '</span></div>';
        html += '<div style="font-size:13px;color:var(--muted);margin-top:6px;font-weight:500">' + (l.quantite !== null ? l.quantite : '-') + ' ' + esc(l.unite) + ' x ' + eur(l.prixUnitaireHT) + '</div>';

      });

  }
